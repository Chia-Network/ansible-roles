---
- name: Copy CA from URL to the trusted CA key file
  become: yes
  get_url:
    url: "{{ ca_url }}"
    dest: "{{ ssh_ca_trusted_user_ca_keys }}"
    mode: "0644"
  when: ca_url != ""
  notify: restart-ssh

- name: Copy CA Content to the trusted CA key file
  become: yes
  copy:
    content: "{{ ca_content }}"
    dest: "{{ ssh_ca_trusted_user_ca_keys }}"
    mode: "0644"
  when: ca_content != ""
  notify: restart-ssh

# TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem
- name: Ensure ssh config has the trusted CA
  become: yes
  ansible.builtin.lineinfile:
    path: "{{ ssh_ca_sshd_config }}"
    regexp: "^TrustedUserCAKeys"
    line: "TrustedUserCAKeys {{ ssh_ca_trusted_user_ca_keys }}"
  when: ca_url != "" or ca_content != ""
  notify: restart-ssh
