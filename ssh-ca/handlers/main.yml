- name: ssh-ca-restart-ssh-linux
  become: yes
  ansible.builtin.service:
    name: ssh
    state: restarted
  register: systemd_action
  retries: 10
  until: systemd_action is success
  when: ansible_os_family != "Darwin"
  listen: ssh-ca-restart-ssh

- name: ssh-ca-restart-ssh-darwin
  become: yes
  ansible.builtin.command:
    argv: [/bin/launchctl, kickstart, -k, system/com.openssh.sshd]
  changed_when: true
  when: ansible_os_family == "Darwin"
  listen: ssh-ca-restart-ssh
