---
# Linux (sshd service) and Darwin (launchd com.openssh.sshd) are separate task
# files. Darwin never falls through into the Linux tasks.
- name: Harden SSH on Darwin
  ansible.builtin.include_tasks: darwin.yml
  when: ansible_os_family == "Darwin"

- name: Harden SSH on Linux
  ansible.builtin.include_tasks: linux.yml
  when: ansible_os_family != "Darwin"
