---
# Linux (apt/systemd) and Darwin (Homebrew/launchd) are separate task files.
- name: Install and configure Alloy on Darwin
  ansible.builtin.include_tasks: darwin.yml
  when: ansible_os_family == "Darwin"

- name: Install and configure Alloy on Linux
  ansible.builtin.include_tasks: linux.yml
  when: ansible_os_family != "Darwin"
