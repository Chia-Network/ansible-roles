  config:
    mainnet:
      address_prefix: "xch"
      default_full_node_port: 8444
    testnet10:
      address_prefix: "txch"
      default_full_node_port: 58444
    testnet11:
      address_prefix: "txch"
      default_full_node_port: 58444

# If set 'True', the timelord will create compact proofs of time, instead of
# extending the chain.
bluebox_mode: "False"

# Seconds of no finished SP/IP/EOS before the timelord resets all VDF chains.
# Matches chia-blockchain default. 0 disables the inactivity reset.
chia_timelord_max_allowed_inactivity_time: 60

# Number of VDF client processes to keep alive in the local machine.
timelord_launcher_host: localhost
process_count: 3
vdf_client_ips:
  - localhost
  - 127.0.0.1
vdf_server_hostname: localhost

# 'send_uncompact_interval' seconds. Set to 0 if you don't use this feature. Recommended is 300
send_uncompact_interval: 0

# HW VDF Config
chia_enable_hw_vdf: false
chia_hw_vdf_version: latest
chia_hw_vdf_vdf_threads: 16
chia_hw_vdf_proof_threads: 14
chia_hw_vdf_freq: 1100
# 0 will have the effect of not setting this flag
chia_hw_vdf_max_freq: 0
# 0 will have the effect of not enabling it
chia_hw_vdf_auto_freq_period: 0
# Mask: Enabled Core(s)
# 1: 0
# 2: 1
# 3: 0,1
# 4: 2
# 5: 0,2
# 6: 1,2
# 7: 0,1,2
chia_hw_vdf_mask: 7
chia_hw_num_vdfs: "{{ '1' if chia_hw_vdf_mask in [1,2,4] else '2' if chia_hw_vdf_mask in [3,5,6] else '3' }}"

# Seeder Config
minimum_height: 240000
bootstrap_peers:
  - node.chia.net
domain_name: dns-introducer.chia.net.
nameserver: chia.net.
ttl: 300
soa_rname: "hostmaster.chia.net."

# monit service related
chia_add_healthcheck_service: true
chia_healthcheck_port: 9950
# Must match chia-healthcheck's --healthcheck-threshold (default 5m).
chia_healthcheck_threshold_seconds: 300
# Must match the monit role's monit_cycle_time.
chia_monit_cycle_seconds: 60
add_monit_config: true
chia_add_hw_vdf_monit_config: "{{ chia_enable_hw_vdf }}"
monit_start_now: true
chia_alerts_receiver_token: ""
chia_monit_alert_on_restart: false
chia_monit_alert_webhook_url: ""
# How many times the port check needs to fail before monit will increase chia logging to DEBUG
chia_monit_log_debug_threshold: 2
# How many times the port check needs to fail before monit will restart the service
chia_monit_failure_threshold: 3
# Wall-clock seconds after last new height before monit restarts chia.target for /full_node.
# Cycles = max(1, (this - chia_healthcheck_threshold_seconds) / chia_monit_cycle_seconds).
# Default 480 = 300s healthcheck + 3 cycles, matching prior behavior.
chia_monit_progress_restart_seconds: 480
# When true, also monitor /full_node/ports (process liveness) with the fast failure threshold.
# Useful when chia_monit_progress_restart_seconds is raised so a dead node still restarts quickly.
chia_monit_check_full_node_ports: false
# Off by default so mainnet keeps the existing monit files.
# While a failure persists the quiet period is min, min*factor, min*factor^2,
# ... capped at max, and monit keeps retrying at max. The counter goes back to
# 0 when no restart has been allowed for twice the max (time based, no monit
# event involved). 600, 2, 3600 is 10m, 20m, 40m, then 60m.
chia_monit_restart_backoff: false
# With backoff on, the restart script sends the restart alert; monit's own
# "if 1 restarts ... exec monit-notify-chia.sh" line is not rendered, because
# monit counts skipped calls as restarts. Turning backoff off again removes the
# script during the play, but monit is only reloaded by the restart-monit handler
# at the end, so a restart in that window fails and monit retries next cycle.
chia_monit_restart_script: "/etc/monit/monit-chia-restart-{{ chia_service_base }}.sh"
chia_monit_restart_state_dir: "/var/lib/chia-monit/{{ chia_service_base }}"
chia_monit_restart_min_seconds: 600
chia_monit_restart_backoff_factor: 2
# Seconds to wait after a restart for the units to be active and listening before alerting.
# Must be between 10 and 200.
# Whole restart call must finish inside monit's 600 s restart timeout: lock 0 s (held lock skips),
# stop up to 120 s plus about 4 s of waits, start up to 180 s, verify up to this value (200 max),
# alert call up to 30 s: about 534 s worst case. Leftover chia processes owned by the chia user
# (e.g. started outside systemd) are terminated after the stop.
chia_monit_restart_verify_seconds: 90
chia_monit_restart_max_seconds: 3600
# Only used when chia_monit_restart_backoff is true. Opting in changes the
# hw-vdf failure threshold from chia_monit_failure_threshold (default 3) to
# this value (default 5).
chia_monit_hw_vdf_failure_threshold: 5

# Connect to certain peers on a given interval
chia_periodic_connect_interval:
  minute: "*/5"
  hour: "*"
chia_periodic_connect_peers: []

# Set to false to limit connections to trusted nodes only (like localhost)
chia_wallet_connect_to_unknown_peers: true

# ---------------------------------------------------------------------------
# Darwin (Apple Silicon) ASIC timelord. Unused on Linux.
#
# Linux keeps its own hw_vdf defaults and the systemd argv in
# templates/systemd/chia-hw-vdf.service.j2 (freq 1100, 16 vdf threads, 14 proof
# threads, no --voltage, --retain-asic-values, --checkpoint-threshold, or
# --expected-serial). Do not point the Linux unit at the chia_darwin_hw_vdf_*
# variables.
#
# chia_darwin_topology:
#   local-internal   Local full node and timelord. CHIA_ROOT is a real directory
#                    on the internal disk. Wrappers do not wait for a volume.
#   local-external   Local full node and timelord. ~/.chia and CHIA_ROOT are
#                    real directories on the internal disk. Only
#                    <chia_root>/db is a symlink onto the volume at
#                    <chia_darwin_volume_chia_dir>/<network>/db (for example,
#                    /Volumes/Chia-DB/dot-chia/mainnet/db). Reusing that path
#                    keeps an existing on-volume database in place. Wrappers
#                    that open the blockchain database wait until the volume
#                    is mounted and that DB directory is readable (not for
#                    config.yaml on the volume). Expected Full Disk Access:
#                    only the full-node process (the wrapper interpreter
#                    running chia_full_node), not companion binaries or
#                    tailscaled. See the note this role writes under the
#                    service user's etc directory. This role does not edit
#                    TCC.db and does not install the profile.
#   remote-node      No local full node (Apple internal storage is the wrong
#                    place for a blockchain DB). Timelord still runs locally and
#                    peers with chia_timelord_full_node_peer_host:full_node_port.
#                    CHIA_ROOT stays on the internal disk. On chia 2.7.1 and
#                    later the remote full node accepts inbound timelords only
#                    from localhost or exempt_peer_networks, so that node must
#                    list this Mac.
#   vdf-only         Only the ASIC hw_vdf_client jobs. The daemon, full node,
#                    timelord, chia-exporter, and chia-healthcheck jobs are not
#                    installed. Set chia_darwin_hw_vdf_ip to the remote
#                    timelord's VDF server address. The watchdog still watches
#                    the board LaunchDaemons. This topology is for a Mac that
#                    only supplies ASIC VDF engines to a timelord elsewhere.
#
# Network: the same `network` variable as Linux (mainnet or testnet11). Darwin
# CHIA_ROOT defaults to ~/.chia/<network>, so the two networks do not share a
# directory. testnet11 full nodes listen on 58444; set full_node_port and
# introducer_peer in inventory. Those Linux defaults are intentionally not
# overridden here. Run a second network under a different
# chia_darwin_launchd_prefix so the LaunchDaemon labels do not collide.
#
# Connection: SSH as an account with passwordless sudo. Keep that account
# separate from `user`, the dedicated non-admin service account the
# LaunchDaemons run as (the Linux default `ubuntu` is refused). If the only
# practical SSH login is the service account, the operator must set
# chia_darwin_allow_root_capable_service_user: true and accept a weaker
# posture than the Linux split. Use chia_darwin_brew_user when a different
# account owns the Homebrew prefix. Homebrew itself is not installed here.
#
# Ansible runs modules with whatever interpreter discovery selects. On a fresh
# Mac that is often Homebrew python@3.13, which does not ship packaging or
# setuptools. This role does not use the pip module, and it does not need a
# chia virtualenv (or any other virtualenv) on the SSH user's PATH. Packages
# are installed with chia_darwin_venv's python -m pip. PyPI stays the default
# index, and chia_darwin_pip_extra_index is added with --extra-index-url.
#
# chia_darwin_enable_hw_vdf is independent of chia_enable_hw_vdf. The Linux
# flag still selects apt chiavdf-hw and monit, and stays false by default. The
# Darwin default is true for chia-blockchain and false for timelord-app, which
# refuses role-managed ASIC clients.
# ---------------------------------------------------------------------------
chia_darwin_topology: local-external
# chia-blockchain runs the Python timelord and the role-managed hw_vdf_client
# jobs. timelord-app runs the signed Timelord.app supervisor instead; the app
# owns both the timelord and the ASIC USB clients, so role-managed hw-vdf jobs
# are refused. local-internal and local-external still install the role-managed
# full node and daemon. remote-node with the app skips Python and chia-blockchain
# entirely and imports a prebuilt connection bundle. vdf-only is incompatible.
chia_darwin_timelord_implementation: chia-blockchain
chia_darwin_timelord_app_enabled: "{{ chia_darwin_timelord_implementation == 'timelord-app' }}"
chia_darwin_enable_hw_vdf: "{{ chia_darwin_timelord_implementation == 'chia-blockchain' }}"
# The service account normally has no sudo. A deployment that uses the
# service account as the SSH/CI/automation login must explicitly accept the
# weaker posture of a root-capable network-facing account. The service user
# stays out of the admin group even with the opt-in; passwordless sudo comes
# from sudoers.
chia_darwin_allow_root_capable_service_user: false
chia_darwin_group: staff
chia_darwin_home: "/Users/{{ user }}"
chia_darwin_root: "{{ chia_darwin_home }}/.chia/{{ network }}"
# Darwin uses the shared log_level and target_outbound_peer_count. Set them in
# the Darwin host/group vars (log_level: INFO and target_outbound_peer_count: 30
# match the Linux timelord fleet). This role no longer silently overrides them.
chia_darwin_homebrew_prefix: /opt/homebrew
chia_darwin_brew: "{{ chia_darwin_homebrew_prefix }}/bin/brew"
# When the SSH/automation login is the service user, set this to the account
# that owns chia_darwin_homebrew_prefix. Homebrew tasks then run as that user
# through sudo. Empty means the connecting user owns the prefix (Linux-style).
chia_darwin_brew_user: ""
chia_darwin_python_formula: python@3.13
chia_darwin_python: "{{ chia_darwin_homebrew_prefix }}/opt/python@3.13/bin/python3.13"
chia_darwin_venv: "{{ chia_darwin_home }}/chia-venv"
chia_darwin_bin_dir: "{{ chia_darwin_home }}/bin"
chia_darwin_etc_dir: "{{ chia_darwin_home }}/etc"
chia_darwin_log_dir: "{{ chia_darwin_home }}/Library/Logs/chia"
chia_darwin_env_script: "{{ chia_darwin_bin_dir }}/chia-env.sh"
chia_darwin_pip_package: chia-blockchain
# Required. Pin this to the chia-blockchain release to run.
chia_darwin_pip_version: ""
chia_darwin_pip_extra_index: https://pypi.chia.net/simple
# brew tap name for github.com/Chia-Network/homebrew-chia
chia_darwin_chiavdf_tap: Chia-Network/chia
chia_darwin_chiavdf_formula: chiavdf
# Empty skips the version assert. 1.2.2 is the formula this role was validated with.
chia_darwin_chiavdf_version: "1.2.2"
chia_darwin_hw_vdf_client: "{{ chia_darwin_homebrew_prefix }}/bin/hw_vdf_client"
# Initial full-node database seeding from the same S3 snapshot Linux uses.
# Reuses blockchain_backup_bucket, download_blockchain_db, network, and
# db_version. Only local-internal and local-external seed. The AWS CLI is
# installed with Homebrew when a seed is actually needed. Credentials use the
# AWS CLI's normal discovery as the service user.
chia_darwin_aws: "{{ chia_darwin_homebrew_prefix }}/bin/aws"
chia_darwin_awscli_formula: awscli
chia_darwin_db_seed_stub_bytes: 10240
chia_darwin_db_volume: /Volumes/Chia-DB
chia_darwin_volume_chia_dir: "{{ chia_darwin_db_volume }}/dot-chia"
chia_darwin_volume_db_dir: "{{ chia_darwin_volume_chia_dir }}/{{ network }}/db"
chia_darwin_db_marker: "{{ chia_darwin_volume_db_dir }}"
# Overridable so CI can stub the mount binary. Production uses /sbin/mount.
chia_darwin_mount: /sbin/mount
chia_darwin_wait_interval: 5
chia_darwin_wait_log_every: 12
chia_darwin_launchd_prefix: net.chia.timelord
# When chia_darwin_launchd_become is true these must stay launchctl and
# /Library/LaunchDaemons. Tests set become to false and point them elsewhere.
chia_darwin_launchctl: launchctl
chia_darwin_launchd_dir: /Library/LaunchDaemons
chia_darwin_launchd_become: true
chia_darwin_process_type: Interactive
chia_darwin_nofile: 60000
chia_darwin_start_now: "{{ start_now }}"
chia_darwin_start_on_boot: "{{ start_on_boot }}"
chia_darwin_daemon_throttle_interval: 15
chia_darwin_daemon_exit_timeout: 60
chia_darwin_full_node_throttle_interval: 30
chia_darwin_full_node_exit_timeout: 300
chia_darwin_timelord_throttle_interval: 15
chia_darwin_timelord_exit_timeout: 60
chia_darwin_hw_vdf_throttle_interval: 15
chia_darwin_hw_vdf_exit_timeout: 30
# Seconds to keep polling after a job's ExitTimeOut before giving up.
# launchd SIGKILLs at ExitTimeOut; launchctl print can still see the job
# briefly after that. The restart handler waits ExitTimeOut plus this margin
# (one second per try) and does not bootstrap a job that is still loaded.
chia_darwin_restart_unload_margin: 30
# Software VDF launcher is not installed. Zero keeps a manual launcher from
# spawning CPU clients next to the ASIC.
chia_darwin_process_count: 0
chia_darwin_interpreter: /bin/zsh
chia_darwin_sudo: /usr/bin/sudo
# hw_vdf_client argv. Linux does not use these.
# Frequency and voltage apply to every board. They are the role defaults
# (1540 MHz, 1.0 V), not chiavdf's own 1100 / 0.88 defaults.
chia_darwin_hw_vdf_freq: 1540
chia_darwin_hw_vdf_voltage: "1.0"
# 0 disables the flag, matching the Linux hw_vdf unit. Set these in inventory
# to use the same runtime tuning as the Linux ASIC fleet (for example freq 1620,
# auto-freq 60).
chia_darwin_hw_vdf_max_freq: 0
chia_darwin_hw_vdf_auto_freq_period: 0
# Host threads per VDF engine. A board with two engines uses about twice the
# CPU of a board with one engine at the same pair. Inventory entries may set
# vdf_threads and proof_threads; the role does not invent a new pair from the
# engine count.
chia_darwin_hw_vdf_vdf_threads: 12
chia_darwin_hw_vdf_proof_threads: 11
chia_darwin_hw_vdf_checkpoint_threshold: 500000
# Used only on the legacy single-board path (empty board list with a serial).
# With a board list or auto-discovered boards the role assigns masks: 7 for
# one board, 3 then 1 for two, and 1 for each of three.
chia_darwin_hw_vdf_mask: 7
chia_darwin_hw_num_vdfs: "{{ '1' if (chia_darwin_hw_vdf_mask | int) in [1, 2, 4] else ('2' if (chia_darwin_hw_vdf_mask | int) in [3, 5, 6] else '3') }}"
chia_darwin_hw_vdf_retain_asic_values: true
# Legacy single board. Not given a default because a serial belongs to one
# board. Do not set this and the board list together. If the board list is
# empty and this is empty, the role discovers boards with
# hw_vdf_client --list (the same source chiavdf uses for --device-loc).
chia_darwin_hw_vdf_expected_serial: ""
# hw_vdf_client --list prints rows in the format documented for chiavdf 1.2.2
# (https://github.com/Chia-Network/chiavdf/blob/1.2.2/src/hw/ftdi_driver.cpp,
# FtdiDriver::List()). That source also prints only FT4222H interfaces whose
# description ends in A; it does not filter serial numbers to Chia ASIC
# boards. Discovery keeps only serials matching the owner-confirmed factory
# format for these boards: a CHIA prefix, ten digits, and a trailing A.
# chiavdf does not enforce that serial pattern, so adjust this pattern if your
# boards print something else. --expected-serial accepts the printed form or
# the base form without that final A. Discovery matches wrappers and --list
# rows directly and preserves the SERIAL spelling already stored in a wrapper.
# New boards keep the full serial printed by --list.
chia_darwin_hw_vdf_serial_pattern: "^CHIA[0-9]{10}A$"
# One to three boards. A non-empty list overrides auto-discovery and pins each
# board's location and serial. Empty with chia_darwin_hw_vdf_expected_serial
# set keeps the legacy single-board path (no --device-loc). Empty with both
# unset discovers boards with hw_vdf_client --list. Boards held by running
# clients are invisible to --list, so discovery also reads this role's
# installed wrappers: existing IDs are retained, visible boards refresh their
# location, hidden boards keep the stored one, and new serials take the next
# free ID. A board removed from --list stays claimed until an explicit board
# list retires it. Each explicit entry allows only id, device_loc,
# expected_serial, vdf_threads, and proof_threads. id is 1, 2, or 3. device_loc
# is the decimal location from hw_vdf_client --list; 0 is allowed only for one
# board. expected_serial is 1-15 printable non-space characters. See
# DARWIN-HW-VDF.md.
chia_darwin_hw_vdf_boards: []
# Seconds after the timelord port is up before board N in ID order opens USB.
# Board 0 waits only chia_darwin_hw_vdf_settle_seconds. Later boards wait
# that plus index * this value, so they do not enumerate FTDI together.
# 0 starts every board after the shared settle.
chia_darwin_hw_vdf_open_stagger: 15
# A plist that does not run this role's wrapper is left in place. Set true
# to replace that label.
chia_darwin_hw_vdf_claim_existing: false
chia_darwin_hw_vdf_ip: 127.0.0.1
chia_darwin_hw_vdf_port: "{{ chia_timelord_launcher_port }}"
chia_darwin_hw_vdf_settle_seconds: 3
chia_darwin_rotpipe_max_bytes: 52428800
chia_darwin_rotpipe_backups: 5
# Companion services. These are the Darwin equivalents of the separate
# chia-exporter, chia-healthcheck, and prometheus-node-exporter roles plus the
# Linux monit checks, all owned here so one play applies the whole timelord
# stack. Set a flag to false to leave that job to another owner; the role then
# removes its plist but leaves installed binaries and wrappers in place.
chia_darwin_enable_chia_exporter: true
chia_darwin_enable_chia_healthcheck: true
chia_darwin_enable_node_exporter: true
chia_darwin_enable_watchdog: true
# Pinned release artifacts. Checksums are for the published darwin-arm64
# archives; update both when changing a version. Empty checksums are allowed
# but not recommended.
chia_darwin_install_companion_binaries: true
chia_darwin_companion_bin_dir: "{{ chia_darwin_home }}/opt/bin"
chia_darwin_companion_download_dir: "{{ chia_darwin_home }}/opt/downloads"
chia_darwin_chia_exporter_version: "1.0.3"
chia_darwin_chia_exporter_sha256: "52ef18ae6ec0d0a2312f9a8e9ac3eda95e7ee387e286bc0a36d5824696be9a12"
chia_darwin_chia_exporter_port: "{{ chia_exporter_port | default(9914) }}"
chia_darwin_chia_healthcheck_version: "1.0.3"
chia_darwin_chia_healthcheck_sha256: "3931d301e0eff12f038d82721c2e499b2c47163c4318d328dc41ff0cf547b76e"
chia_darwin_chia_healthcheck_port: "{{ chia_healthcheck_port | default(9950) }}"
chia_darwin_chia_healthcheck_dns_hostname: "{{ chia_healthcheck_dns_hostname | default('') }}"
chia_darwin_node_exporter_version: "1.12.1"
chia_darwin_node_exporter_sha256: "35b246a34af55a8f0c3f11067f17aecf9836cfd4689bde364776b3a4ad3a84d6"
chia_darwin_node_exporter_port: 9100
# CHIA_ROOT used by chia-exporter and chia-healthcheck. The Linux units use
# the real chia root. A host may point this at a read-only config copy without
# changing CHIA_ROOT for the daemons. Companions no longer wait for the
# database volume or chia_darwin_db_marker: local-external keeps CHIA_ROOT
# internal by default, so their CHIA_ROOT is on the internal disk.
chia_darwin_companion_chia_root: "{{ chia_root }}"
chia_darwin_companion_rotpipe_max_bytes: 20971520
chia_darwin_companion_rotpipe_backups: 3
chia_darwin_companion_throttle_interval: 15
chia_darwin_companion_exit_timeout: 30
# Periodic full-node peer connect. Linux uses cron; launchd uses a StartInterval
# job. Reuses chia_periodic_connect_peers and full_node_port. Set the list empty
# to skip the job. 300s matches the Linux */5 cron interval.
chia_darwin_periodic_connect_interval_seconds: 300
# ---------------------------------------------------------------------------
# Signed Timelord.app (chia_darwin_timelord_implementation: timelord-app).
#
# The app owns the timelord worker and the bundled hw_vdf_client ASIC clients.
# The role still installs the full node and daemon for local-internal and
# local-external. remote-node app deployments install no Python or
# chia-blockchain and must provide a connection bundle created on the full-node
# host. The app writes learned board settings into its config, so the role only
# renders the full base config when it is missing or force_config is true; it
# updates the node section through the app's own local-node/import-node commands
# and leaves hardware state alone.
#
# Release: https://github.com/Chia-Network/timelord-app/releases/tag/v1.0.0
# The DMG is arm64, requires macOS 14 or later, and is signed and notarized.
# The upstream repository is private; see the download variables below.
chia_darwin_timelord_app_version: "1.0.0"
chia_darwin_timelord_app_sha256: "c2032d433ba095b62a3dd6e0561122236f6f371b45912b39850e375d7f37287a"
chia_darwin_timelord_app_dmg_name: "Timelord-{{ chia_darwin_timelord_app_version }}-macos-arm64.dmg"
chia_darwin_timelord_app_dmg_url: >-
  https://github.com/Chia-Network/timelord-app/releases/download/v{{ chia_darwin_timelord_app_version }}/{{ chia_darwin_timelord_app_dmg_name }}
# Private release assets need the API endpoint with Accept:
# application/octet-stream. Update the asset ID with the version and checksum.
chia_darwin_timelord_app_asset_id: "715836523"
chia_darwin_timelord_app_api_url: >-
  https://api.github.com/repos/Chia-Network/timelord-app/releases/assets/{{ chia_darwin_timelord_app_asset_id }}
chia_darwin_timelord_app_dmg: "{{ chia_darwin_companion_download_dir }}/timelord-app-{{ chia_darwin_timelord_app_version }}/{{ chia_darwin_timelord_app_dmg_name }}"
# The upstream repository is private. Set github_token to use the pinned GitHub
# API asset, point dmg_url at an internal mirror, or set download false and
# place the pinned DMG at chia_darwin_timelord_app_dmg before the play runs.
chia_darwin_timelord_app_download: true
chia_darwin_timelord_app_github_token: ""
chia_darwin_timelord_app_mountpoint: "{{ chia_darwin_companion_download_dir }}/timelord-app-{{ chia_darwin_timelord_app_version }}/mnt"
chia_darwin_timelord_app_path: /Applications/Timelord.app
chia_darwin_timelord_app_stage_path: "/Applications/.Timelord.app.ansible-new"
chia_darwin_timelord_app_helpers_dir: "{{ chia_darwin_timelord_app_path }}/Contents/Helpers"
chia_darwin_timelord_app_service_binary: "{{ chia_darwin_timelord_app_helpers_dir }}/timelord-service"
chia_darwin_timelord_app_supervisor_binary: "{{ chia_darwin_timelord_app_helpers_dir }}/timelord-supervisor"
chia_darwin_timelord_app_client_binary: "{{ chia_darwin_timelord_app_helpers_dir }}/hw_vdf_client"
chia_darwin_timelord_app_driver_library: "{{ chia_darwin_timelord_app_path }}/Contents/Frameworks/libftd2xx.dylib"
chia_darwin_timelord_app_installer: "{{ chia_darwin_timelord_app_path }}/Contents/Resources/install-service.sh"
# Fixed by the vendor installer; do not put chia_darwin_launchd_prefix here.
chia_darwin_timelord_app_service_label: net.chia.timelord.supervisor
chia_darwin_timelord_app_config_dir: "{{ chia_darwin_home }}/Library/Application Support/Timelord"
chia_darwin_timelord_app_config: "{{ chia_darwin_timelord_app_config_dir }}/config.toml"
chia_darwin_timelord_app_stage_dir: "{{ chia_darwin_timelord_app_config_dir }}/.ansible"
chia_darwin_timelord_app_stage_config: "{{ chia_darwin_timelord_app_stage_dir }}/config.toml"
chia_darwin_timelord_app_status_listen: 127.0.0.1:9257
# The app serves Prometheus metrics and health probes directly; no chia-exporter
# is needed for the timelord. Match the Linux timelord monitoring posture by
# exposing the worker deployment listener (9258) and supervisor listener (9259)
# to the fleet scrape. Set chia_darwin_timelord_app_expose_observability false to
# keep both on loopback and leave observability_listen unset.
chia_darwin_timelord_app_expose_observability: true
chia_darwin_timelord_app_observability_listen: >-
  {{ '0.0.0.0:9258'
  if chia_darwin_timelord_app_expose_observability | bool else '' }}
chia_darwin_timelord_app_supervisor_listen: >-
  {{ '0.0.0.0:9259'
  if chia_darwin_timelord_app_expose_observability | bool else '127.0.0.1:9259' }}
chia_darwin_timelord_app_allow_remote_observability: >-
  {{ chia_darwin_timelord_app_expose_observability | bool }}
chia_darwin_timelord_app_manage_service: true
# Seconds to wait for the vendor supervisor label to disappear from launchctl
# before replacing the app bundle or reporting removal complete.
chia_darwin_timelord_app_stop_timeout: 60
chia_darwin_timelord_app_status_port: "{{ chia_darwin_timelord_app_status_listen | split(':') | last | int }}"
chia_darwin_timelord_app_supervisor_port: "{{ chia_darwin_timelord_app_supervisor_listen | split(':') | last | int }}"
chia_darwin_timelord_app_supervisor_probe_host: >-
  {{ '127.0.0.1'
  if chia_darwin_timelord_app_supervisor_listen.split(':')[0] in
  ['0.0.0.0', '127.0.0.1', 'localhost']
  else chia_darwin_timelord_app_supervisor_listen.rsplit(':', 1)[0] }}
# App connection bundle. For remote-node set either a directory already on the
# target (chia_darwin_timelord_app_bundle_path) or a controller directory copied
# to chia_darwin_timelord_app_bundle_dest (chia_darwin_timelord_app_bundle_src).
chia_darwin_timelord_app_bundle_path: ""
chia_darwin_timelord_app_bundle_src: ""
chia_darwin_timelord_app_bundle_dest: "{{ chia_darwin_timelord_app_config_dir }}/connection-bundle"
chia_darwin_timelord_app_bundle_source: >-
  {{ chia_darwin_timelord_app_bundle_dest
  if chia_darwin_timelord_app_bundle_src | length > 0
  else chia_darwin_timelord_app_bundle_path }}
chia_darwin_timelord_app_bundle_manifest: connection.toml
chia_darwin_timelord_app_bundle_fingerprint_file: "{{ chia_darwin_timelord_app_config_dir }}/.ansible-bundle.sha256"
chia_darwin_timelord_app_managed_marker: "{{ chia_darwin_etc_dir }}/timelord-app-managed"
# Set true to replace the complete app config from the role template. That also
# discards app-learned board tuning and the hardware registry.
chia_darwin_timelord_app_force_config: false
# Remove identity directories left by earlier bundle imports. References from
# config.toml and the supervisor's last-good checkpoint are always kept.
chia_darwin_timelord_app_prune_identities: true
# Watchdog: the macOS equivalent of the Linux monit checks. It runs as root so
# it can kickstart LaunchDaemons. The alert files stay root-only and are only
# written when the corresponding variable is nonempty. The token and URL must
# be set together; the role refuses a half-configured alert sink.
chia_darwin_watchdog_cycle: 60
# Delay the first check after the watchdog starts. Match the Linux monit
# "start delay 3600" so boot-time launchd churn settles. This is not used after
# a watchdog-initiated restart; chia_darwin_watchdog_restart_grace is.
chia_darwin_watchdog_grace: 3600
# Delay after a watchdog-initiated restart. Matches the previous Darwin
# behavior and the Linux monit cycle behavior, where checks resume promptly.
chia_darwin_watchdog_restart_grace: 600
chia_darwin_watchdog_fail_cycles: 3
# Raise Chia to DEBUG after this many failed /full_node or /timelord checks,
# then restore log_level when the healthcheck recovers. Matches the
# Linux monit chia_monit_log_debug_threshold behavior.
chia_darwin_watchdog_log_debug_threshold: 2
# Also monitor /full_node/ports (process liveness) so a full node whose RPC is
# up but whose peer ports are dead is restarted. Off on Linux by default to
# preserve the existing monit files; on Darwin there is no legacy file to keep.
chia_darwin_watchdog_check_full_node_ports: true
chia_darwin_watchdog_board_stop_timeout: "{{ chia_darwin_hw_vdf_exit_timeout | int + chia_darwin_restart_unload_margin | int }}"
chia_darwin_watchdog_throttle_interval: 30
chia_darwin_watchdog_exit_timeout: 30
chia_darwin_watchdog_conf_dir: /usr/local/etc/chia-watchdog
chia_darwin_watchdog_script: /usr/local/libexec/chia-watchdog/chia-watchdog.sh
chia_darwin_watchdog_log: /var/log/chia-watchdog.log
chia_darwin_watchdog_log_dir: /var/log
chia_darwin_watchdog_alert_token: ""
chia_darwin_watchdog_webhook_url: ""
chia_darwin_pmset_apply: true
chia_darwin_pmset:
  sleep: 0
  disksleep: 0
  womp: 1
  autorestart: 1
  tcpkeepalive: 1
chia_darwin_emit_pppc: true
chia_darwin_pppc_dest: "{{ chia_darwin_etc_dir }}/chia-timelord-fda.mobileconfig"
chia_darwin_fda_note_dest: "{{ chia_darwin_etc_dir }}/FULL-DISK-ACCESS.txt"
chia_darwin_pppc_identifier: net.chia.timelord.fda
chia_darwin_pppc_payload_uuid: 6f2c1a84-7b3e-4d19-9c5a-1e8d4f0a7b22
chia_darwin_pppc_profile_uuid: c4a91e57-2d08-4f6b-b731-9a0e5c8d14f6
chia_darwin_pppc_code_requirement: 'identifier "com.apple.zsh" and anchor apple'
