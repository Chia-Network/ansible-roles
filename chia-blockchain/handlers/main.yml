- name: systemd-daemon-reload
  become: true
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart-chia
  become: true
  ansible.builtin.service:
    name: "{{ chia_service_base }}.target"
    state: restarted
  when: start_now
  register: systemd_action
  retries: 10
  until: systemd_action is success

- name: restart-monit
  become: true
  ansible.builtin.service:
    name: monit
    state: restarted
  when: (add_monit_config or chia_add_hw_vdf_monit_config) and monit_start_now
  register: systemd_action
  retries: 10
  until: systemd_action is success

- name: Note that the Darwin service jobs must restart
  ansible.builtin.set_fact:
    chia_darwin_restart_services: true
  listen: restart-chia-darwin

- name: Note that the Darwin companion jobs must restart
  ansible.builtin.set_fact:
    chia_darwin_restart_companions: true
  listen: restart-chia-darwin-companions

- name: Note that the Darwin boards must restart
  ansible.builtin.set_fact:
    chia_darwin_restart_boards: true
  listen: restart-chia-darwin-boards
