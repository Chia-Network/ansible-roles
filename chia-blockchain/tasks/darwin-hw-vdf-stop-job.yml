---
# Stop one loaded hw-vdf LaunchDaemon and wait out its ExitTimeOut.
# The caller has already decided this job is loaded and role-owned.
- name: Stop LaunchDaemon {{ item.label }} before the new board set starts
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl }}"
      - bootout
      - "system/{{ item.label }}"
  register: chia_hw_stop_bootout
  changed_when: chia_hw_stop_bootout.rc == 0
  failed_when: false

- name: Wait until LaunchDaemon {{ item.label }} is unloaded
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl }}"
      - print
      - "system/{{ item.label }}"
  register: chia_hw_stop_gone
  changed_when: false
  failed_when: false
  retries: "{{ (item.exit_timeout | int) + (chia_darwin_restart_unload_margin | int) }}"
  delay: 1
  until: chia_hw_stop_gone.rc != 0
  when: chia_hw_stop_bootout.rc == 0

- name: Stop if LaunchDaemon {{ item.label }} is still loaded
  ansible.builtin.fail:
    msg: >-
      {{ item.label }} is still loaded after bootout, past its ExitTimeOut
      of {{ item.exit_timeout }}s plus {{ chia_darwin_restart_unload_margin }}s.
      The new board set was not started.
  when:
    - chia_hw_stop_bootout.rc | default(1) | int == 0
    - chia_hw_stop_gone.rc | default(1) | int == 0
