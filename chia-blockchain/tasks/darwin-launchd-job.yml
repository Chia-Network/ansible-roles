---
# One LaunchDaemon. Included once per entry in chia_darwin_launchd_jobs.
# launchd has no Requires/After, so start order is whatever bootstraps first;
# the zsh wrappers wait for the daemon port and the timelord VDF port.
- name: Install LaunchDaemon plist {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.template:
    src: darwin/launchdaemon.plist.j2
    dest: "{{ chia_darwin_launchd_dir }}/{{ chia_job.label }}.plist"
    owner: "{{ 'root' if (chia_darwin_launchd_become | bool) else omit }}"
    group: "{{ 'wheel' if (chia_darwin_launchd_become | bool) else omit }}"
    mode: "0644"
  when: chia_job.enabled | bool
  register: chia_darwin_plist_written
  notify: "{{ 'restart-chia-darwin-boards' if chia_job.board is defined else 'restart-chia-darwin' }}"

- name: A board plist change restarts that board
  ansible.builtin.set_fact:
    chia_darwin_hw_vdf_changed_labels: "{{ chia_darwin_hw_vdf_changed_labels | default([]) + [chia_job.label] }}"
  when:
    - chia_darwin_plist_written is changed
    - chia_job.board is defined
  changed_when: false

- name: Check whether LaunchDaemon is loaded {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl | default('launchctl') }}"
      - print
      - "system/{{ chia_job.label }}"
  register: chia_darwin_launchd_loaded
  changed_when: false
  failed_when: false

- name: Bootout LaunchDaemon {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl | default('launchctl') }}"
      - bootout
      - "system/{{ chia_job.label }}"
  when:
    - chia_darwin_launchd_loaded.rc == 0
    - (not (chia_job.enabled | bool)) or (not (chia_darwin_start_now | bool))
  register: chia_darwin_bootout
  changed_when: chia_darwin_bootout.rc == 0
  failed_when: false

- name: Remove retired LaunchDaemon plist {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    path: "{{ chia_darwin_launchd_dir }}/{{ chia_job.label }}.plist"
    state: absent
  when: not (chia_job.enabled | bool)

- name: Enable LaunchDaemon at boot {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl | default('launchctl') }}"
      - enable
      - "system/{{ chia_job.label }}"
  when:
    - chia_job.enabled | bool
    - (chia_darwin_start_now | bool) or (chia_darwin_start_on_boot | bool)
  changed_when: false

- name: Bootstrap LaunchDaemon {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl | default('launchctl') }}"
      - bootstrap
      - system
      - "{{ chia_darwin_launchd_dir }}/{{ chia_job.label }}.plist"
  register: chia_darwin_launchd_bootstrap
  changed_when: true
  when:
    - chia_job.enabled | bool
    - chia_darwin_start_now | bool
    - chia_darwin_launchd_loaded.rc != 0
    # Boards start from the ordered restart handler, after any service restart.
    - chia_job.board is not defined

- name: Start ASIC board {{ chia_job.label }} from the ordered restart
  ansible.builtin.debug:
    msg: "{{ chia_job.label }} is not loaded."
  when:
    - chia_job.board is defined
    - chia_job.enabled | bool
    - chia_darwin_start_now | bool
    - chia_darwin_launchd_loaded.rc != 0
  changed_when: true
  notify: restart-chia-darwin-boards

- name: Record freshly bootstrapped LaunchDaemons
  ansible.builtin.set_fact:
    chia_darwin_fresh_bootstraps: "{{ (chia_darwin_fresh_bootstraps | default([])) + [chia_job.label] }}"
  when: chia_darwin_launchd_bootstrap.changed | default(false)

- name: Disable LaunchDaemon at boot {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl | default('launchctl') }}"
      - disable
      - "system/{{ chia_job.label }}"
  when: not ((chia_job.enabled | bool) and (chia_darwin_start_on_boot | bool))
  changed_when: false
