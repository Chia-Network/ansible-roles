---
# Build a scratch Timelord.app config from the connection bundle with the
# installed app, and run the vendor installer's `plan`. Included from
# darwin-timelord-app-preflight.yml before anything is stopped. `plan`
# changes nothing; it only reads the config and prints the job.
- name: Build and check a scratch Timelord.app config
  vars:
    chia_darwin_timelord_app_installer_config: "{{ chia_darwin_timelord_app_stage_dir }}/preflight/config.toml"
  block:
    - name: Create the scratch directory
      become: true
      become_user: "{{ user }}"
      ansible.builtin.file:
        path: "{{ chia_darwin_timelord_app_stage_dir }}/preflight"
        state: directory
        mode: "0700"

    - name: Render a scratch base config
      become: true
      become_user: "{{ user }}"
      ansible.builtin.template:
        src: darwin/timelord-app-config.toml.j2
        dest: "{{ chia_darwin_timelord_app_installer_config }}"
        owner: "{{ user }}"
        group: "{{ chia_darwin_group }}"
        mode: "0600"

    - name: Import the connection bundle into the scratch config
      become: true
      become_user: "{{ user }}"
      ansible.builtin.command:
        argv:
          - "{{ chia_darwin_timelord_app_service_binary }}"
          - import-node
          - --config
          - "{{ chia_darwin_timelord_app_installer_config }}"
          - --bundle
          - "{{ chia_darwin_timelord_app_bundle_source }}/{{ chia_darwin_timelord_app_bundle_manifest }}"
      environment:
        HOME: "{{ chia_darwin_home }}"
      changed_when: false

    - name: Have the vendor installer read the scratch config
      become: true
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ chia_darwin_timelord_app_installer }}"
          - plan
          - --app
          - "{{ chia_darwin_timelord_app_path }}"
          - --config
          - "{{ chia_darwin_timelord_app_installer_config }}"
          - --user
          - "{{ user }}"
      changed_when: false
  rescue:
    - name: Stop before anything is stopped
      ansible.builtin.fail:
        msg: >-
          The installed Timelord.app could not turn the connection bundle in
          {{ chia_darwin_timelord_app_bundle_source }} into a config that its
          installer accepts
          ({{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('unknown error'), true) }}).
          Nothing has been stopped yet. Set
          chia_darwin_timelord_app_probe_installer to false to skip this check.
  always:
    - name: Remove the scratch directory
      become: true
      become_user: "{{ user }}"
      ansible.builtin.file:
        path: "{{ chia_darwin_timelord_app_stage_dir }}/preflight"
        state: absent
