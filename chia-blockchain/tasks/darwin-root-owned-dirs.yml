---
# Ensure each requested directory and every ancestor up to / exist as root-owned
# directories with no group or world write permission. Existing paths are
# inspected through symlinks so a link into a user-writable tree is rejected
# rather than trusted. Callers pass chia_darwin_root_owned_dirs as a list of
# {path, mode} entries; mode defaults to 0755.
- name: Compute every ancestor of the requested root-owned directories
  ansible.builtin.set_fact:
    chia_darwin_root_owned_dir_entries: >-
      {%- set ns = namespace(entries={}) -%}
      {%- for entry in chia_darwin_root_owned_dirs -%}
        {%- set path = entry.path -%}
        {%- set mode = entry.mode | default('0755') -%}
        {%- set parts = path.split('/') -%}
        {%- for i in range(2, parts | length + 1) -%}
          {%- set ancestor = parts[:i] | join('/') -%}
          {%- set ancestor_mode = mode if ancestor == path else '0755' -%}
          {%- if ancestor not in ns.entries or ancestor_mode != '0755' -%}
            {%- set _ = ns.entries.update({ancestor: ancestor_mode}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.entries | dict2items(key_name='path', value_name='mode') | to_json | from_json }}

- name: Stat the resolved root-owned directories
  become: true
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: true
  loop: "{{ chia_darwin_root_owned_dir_entries }}"
  loop_control:
    label: "{{ item.path }}"
  register: chia_darwin_root_owned_dir_stats

- name: Inspect the root-owned directories for symlinks
  become: true
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ chia_darwin_root_owned_dir_entries }}"
  loop_control:
    label: "{{ item.path }}"
  register: chia_darwin_root_owned_dir_links

- name: Refuse unsafe existing root-owned directories
  ansible.builtin.assert:
    that:
      - not (chia_darwin_root_owned_dir_links.results[item_index].stat.islnk | default(false)) or
        (item.stat.exists | default(false))
      - not (item.stat.exists | default(false)) or
        (item.stat.isdir | default(false))
      - not (item.stat.exists | default(false)) or
        (item.stat.pw_name | default('')) == 'root'
      - not (item.stat.exists | default(false)) or
        not (item.stat.wgrp | default(true))
      - not (item.stat.exists | default(false)) or
        not (item.stat.woth | default(true))
    fail_msg: >-
      {{ item.item.path }} must resolve to a root-owned directory with neither
      group nor world write permission when it exists. A dangling symlink or a
      symlink into an unsafe tree is refused.
  loop: "{{ chia_darwin_root_owned_dir_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
    index_var: item_index

- name: Create missing root-owned directories
  become: true
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: directory
    owner: root
    group: wheel
    mode: "{{ item.item.mode }}"
  loop: "{{ chia_darwin_root_owned_dir_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: not (item.stat.exists | default(false))
