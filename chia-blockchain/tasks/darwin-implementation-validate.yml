---
# The single Darwin allow-list. darwin.yml includes this before it derives jobs
# or changes the host; the CI harness includes it with synthetic facts.
- name: Require a supported Darwin combination
  ansible.builtin.assert:
    that:
      - >-
        [chia_darwin_timelord_implementation, chia_darwin_topology,
        chia_darwin_enable_hw_vdf | bool, chia_darwin_timelord_app_enabled | bool] in
        [['chia-blockchain', 'local-external', true, false],
        ['timelord-app', 'local-external', false, true],
        ['timelord-app', 'remote-node', false, true]]
    fail_msg: >-
      Darwin supports exactly three combinations: chia-blockchain on
      local-external with chia_darwin_enable_hw_vdf true and 1-3 role-managed
      ASIC boards; timelord-app on local-external; timelord-app on remote-node.
      timelord-app owns the timelord and its ASIC clients, so it needs
      chia_darwin_enable_hw_vdf false. local-internal and vdf-only are no longer
      supported. Got implementation={{ chia_darwin_timelord_implementation }},
      topology={{ chia_darwin_topology }},
      enable_hw_vdf={{ chia_darwin_enable_hw_vdf }},
      timelord_app_enabled={{ chia_darwin_timelord_app_enabled }}.

- name: Require the Timelord.app remote observability opt-in
  ansible.builtin.assert:
    that:
      - >-
        chia_darwin_timelord_app_allow_remote_observability | bool or
        (chia_darwin_timelord_app_observability_listen | length == 0 and
        chia_darwin_timelord_app_supervisor_probe_host in ['127.0.0.1', '[::1]'])
    fail_msg: >-
      Non-loopback Timelord.app worker or supervisor observability listeners
      require chia_darwin_timelord_app_allow_remote_observability: true. The
      app listener has no authentication or TLS; use a private network or an
      authenticated reverse proxy.
  when: chia_darwin_timelord_app_enabled | bool

- name: Require a remote connection bundle for timelord-app without a local full node
  ansible.builtin.assert:
    that:
      - >-
        (chia_darwin_timelord_app_bundle_path | length > 0) or
        (chia_darwin_timelord_app_bundle_src | length > 0)
    fail_msg: >-
      timelord-app on remote-node has no local CHIA_ROOT to read identities
      from. Set chia_darwin_timelord_app_bundle_path to a connection bundle
      already on this Mac, or chia_darwin_timelord_app_bundle_src to a
      controller directory to copy. The bundle must contain connection.toml and
      the dedicated peer/RPC client identities created on the full-node host.
  when: chia_darwin_topology == "remote-node"
