---
# Linux (apt/source, systemd, monit) and Darwin (pip venv, Homebrew chiavdf, launchd)
# are separate task files. Darwin never falls through into the Linux tasks.
- name: Install and configure Chia on Darwin
  ansible.builtin.include_tasks: darwin.yml
  when: ansible_os_family == "Darwin"

- name: Install and configure Chia on Linux
  ansible.builtin.include_tasks: linux.yml
  when: ansible_os_family != "Darwin"
