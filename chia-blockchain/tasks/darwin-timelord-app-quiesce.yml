---
# The Timelord.app GUI can run outside launchd as the service user and start a
# user-session supervisor that holds owner.lock. Quitting the GUI stops it from
# restoring that supervisor; evicting any unlabeled supervisor then clears a
# lock that install-service.sh check-owner would reject. Both steps are no-ops
# when the app and lock are absent, and neither touches the launchd-owned PID.
- name: Install the Timelord.app quiesce helpers
  become: true
  become_user: "{{ user }}"
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  loop:
    - src: darwin/timelord-app-quit.sh
      dest: "{{ chia_darwin_timelord_app_quit_script }}"
    - src: darwin/timelord-app-evict-supervisor.sh
      dest: "{{ chia_darwin_timelord_app_evict_script }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Quit a running Timelord.app GUI
  become: true
  become_user: "{{ user }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_timelord_app_quit_script }}"
      - --app
      - "{{ chia_darwin_timelord_app_path }}"
      - --bundle-id
      - "{{ chia_darwin_timelord_app_bundle_id }}"
      - --timeout
      - "{{ chia_darwin_timelord_app_quit_timeout }}"
  register: chia_darwin_timelord_app_quit
  changed_when: "'changed=true' in chia_darwin_timelord_app_quit.stdout"

- name: Evict an unlabeled Timelord.app supervisor
  # Root can see system/<label> in `launchctl print`; the quit task above must
  # stay the service user so osascript can address that user's GUI session.
  become: true
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_timelord_app_evict_script }}"
      - --label
      - "{{ chia_darwin_timelord_app_service_label }}"
      - --lock
      - "{{ chia_darwin_timelord_app_supervisor_lock }}"
      - --binary
      - "{{ chia_darwin_timelord_app_supervisor_binary }}"
      - --launchctl
      - "{{ chia_darwin_launchctl }}"
      - --timeout
      - "{{ chia_darwin_timelord_app_stop_timeout }}"
  environment:
    HOME: "{{ chia_darwin_home }}"
  register: chia_darwin_timelord_app_evict
  changed_when: "'changed=true' in chia_darwin_timelord_app_evict.stdout"
