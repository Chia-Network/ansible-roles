- name: HW VDF Repository
  become: true
  ansible.builtin.apt_repository:
    repo: deb [arch={{ chia_repo_arch }} signed-by=/usr/share/keyrings/chia.gpg] https://repo.chia.net/chiavdf-hw/debian/ stable main
    update_cache: true

- name: Install HW VDF Client
  become: true
  ansible.builtin.apt:
    name:
      - "chiavdf-hw{{ (chia_hw_vdf_version == 'latest') | ternary('', '=' + chia_hw_vdf_version) }}"
    update_cache: true
    cache_valid_time: 300
    state: "{{ (chia_hw_vdf_version == 'latest') | ternary('latest', 'present') }}"
    allow_downgrade: true
  register: hwvdf_install
  notify: restart-chia
  retries: 100
  until: hwvdf_install is success or ('Failed to lock apt for exclusive operation' not in hwvdf_install.msg and '/var/lib/dpkg/lock' not in hwvdf_install.msg)

- name: Grant the HW VDF service account USB access
  become: true
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-z-chiavdf-access.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible. Apply after the package's 99-chiavdf.rules.
      SUBSYSTEM=="usb", ATTR{idVendor}=="0403", ATTR{idProduct}=="601c", OWNER="{{ user }}", GROUP="{{ group }}", MODE="0660"
  notify: restart-chia

# Reapply on every deployment to repair already-connected boards even when
# the rule is unchanged (for example, after a package upgrade or downgrade).
- name: Reload HW VDF USB access rules
  become: true
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false

- name: Apply HW VDF USB access to connected boards
  become: true
  ansible.builtin.command:
    argv:
      - udevadm
      - trigger
      - --subsystem-match=usb
      - --attr-match=idVendor=0403
      - --attr-match=idProduct=601c
  changed_when: false

- name: Wait for HW VDF USB access rules to finish
  become: true
  ansible.builtin.command: udevadm settle --timeout=30
  changed_when: false

- name: Install iproute2 for HW VDF ASIC connection checks
  become: true
  ansible.builtin.apt:
    name:
      - iproute2
    state: present
    update_cache: true
    cache_valid_time: 300
  when: chia_add_hw_vdf_monit_config
  register: apt_action
  retries: 100
  until: apt_action is success or ('Failed to lock apt for exclusive operation' not in apt_action.msg and '/var/lib/dpkg/lock' not in apt_action.msg)

- name: Add HW VDF ASIC connection check script for monit
  become: true
  ansible.builtin.template:
    src: check-hw-vdf-asics.sh.j2
    dest: /etc/monit/check-hw-vdf-asics.sh
    mode: "0744"
  when: chia_add_hw_vdf_monit_config
  notify: restart-monit

- name: Add custom monit hw-vdf config to conf.d
  become: true
  ansible.builtin.template:
    src: monit_hw_vdf.j2
    dest: /etc/monit/conf.d/chia_hw_vdf
    mode: "0644"
  when: chia_add_hw_vdf_monit_config
  notify: restart-monit

- name: Add a notify script that send a webhook to Keybase if monit restarts the chia service
  become: true
  ansible.builtin.template:
    src: monit-hw-vdf-restart-alert.sh.j2
    dest: /etc/monit/monit-hw-vdf-restart-alert.sh
    mode: "0744"
  when: chia_add_hw_vdf_monit_config
  notify: restart-monit
