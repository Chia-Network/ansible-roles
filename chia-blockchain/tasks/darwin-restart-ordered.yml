---
# One restart path. A shared-runtime change (restart-chia-darwin) stops the
# watchdog, stops the ASIC boards, restarts the daemon, full node, and timelord,
# then starts the boards in ID order and finally restarts the watchdog with a
# fresh grace. restart-chia-darwin-boards alone only touches boards whose own
# files changed and starts boards that are down.
- name: Restart Darwin services and boards in order
  when: chia_darwin_start_now | bool
  block:
    - name: Note whether the watchdog must be quiesced
      ansible.builtin.set_fact:
        chia_darwin_watchdog_quiesced: >-
          {{ (chia_darwin_restart_services | bool) or
          (chia_darwin_hw_vdf_changed_labels | length > 0) }}
      when:
        - chia_darwin_enable_watchdog | default(false) | bool
        - chia_darwin_watchdog_job is defined
      changed_when: false

    - name: Stop the watchdog before a service or board restart
      when: chia_darwin_watchdog_quiesced | default(false) | bool
      vars:
        chia_job: "{{ chia_darwin_watchdog_job }}"
      ansible.builtin.include_tasks: darwin-stop-job.yml

    - name: Stop ASIC boards before the service restart or a board file change
      when:
        - chia_job.enabled | bool
        - (chia_darwin_restart_services | bool) or (chia_job.label in chia_darwin_hw_vdf_changed_labels)
      ansible.builtin.include_tasks: darwin-stop-job.yml
      loop: "{{ chia_darwin_hw_vdf_jobs }}"
      loop_control:
        loop_var: chia_job
        label: "{{ chia_job.label }}"

    - name: Restart service jobs
      when: chia_darwin_restart_services | bool
      ansible.builtin.include_tasks: darwin-restart-job.yml
      loop: "{{ chia_darwin_service_jobs }}"
      loop_control:
        loop_var: chia_job
        label: "{{ chia_job.label }}"

    - name: Restart companion jobs
      when: chia_darwin_restart_companions | default(false) | bool
      ansible.builtin.include_tasks: darwin-restart-job.yml
      loop: "{{ chia_darwin_companion_jobs | default([]) | rejectattr('name', 'equalto', 'watchdog') | list }}"
      loop_control:
        loop_var: chia_job
        label: "{{ chia_job.label }}"

    - name: See which ASIC boards are loaded after the stops
      when:
        - >-
          (chia_darwin_restart_services | bool) or
          (chia_darwin_hw_vdf_changed_labels | length > 0) or
          (chia_darwin_start_down_boards | default(false) | bool)
        - item.enabled | bool
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.command:
        argv:
          - "{{ chia_darwin_launchctl }}"
          - print
          - "system/{{ item.label }}"
      register: chia_darwin_board_loaded
      changed_when: false
      failed_when: false
      loop: "{{ chia_darwin_hw_vdf_jobs }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Start ASIC boards that are down, in ID order
      when:
        - >-
          (chia_darwin_restart_services | bool) or
          (chia_darwin_hw_vdf_changed_labels | length > 0) or
          (chia_darwin_start_down_boards | default(false) | bool)
        - item.rc | default(0) | int != 0
        - item.item.enabled | bool
      vars:
        chia_job: "{{ item.item }}"
      ansible.builtin.include_tasks: darwin-restart-job.yml
      loop: "{{ chia_darwin_board_loaded.results }}"
      loop_control:
        label: "{{ item.item.label }}"
  always:
    # The watchdog is restored even when a service or board restart fails, and
    # the restart flags are cleared whether the watchdog restart succeeds or
    # not. A failed apply must not leave monitoring down.
    - name: Restore the watchdog and reset the restart flags
      block:
        - name: Restart the watchdog after the service and board restart
          when:
            - chia_darwin_enable_watchdog | default(false) | bool
            - chia_darwin_watchdog_job is defined
            - (chia_darwin_watchdog_quiesced | default(false) | bool) or
              (chia_darwin_restart_companions | default(false) | bool)
          vars:
            chia_job: "{{ chia_darwin_watchdog_job }}"
            chia_darwin_restart_forced: "{{ chia_darwin_watchdog_quiesced | default(false) | bool }}"
          ansible.builtin.include_tasks: darwin-restart-job.yml
      always:
        - name: Clear the service restart request
          ansible.builtin.set_fact:
            chia_darwin_restart_services: false
            chia_darwin_restart_companions: false
            chia_darwin_restart_boards: false
            chia_darwin_start_down_boards: false
            chia_darwin_watchdog_quiesced: false

- name: Clear the service restart request when not starting now
  when: not (chia_darwin_start_now | bool)
  ansible.builtin.set_fact:
    chia_darwin_restart_services: false
    chia_darwin_restart_companions: false
    chia_darwin_restart_boards: false
    chia_darwin_start_down_boards: false
    chia_darwin_watchdog_quiesced: false
