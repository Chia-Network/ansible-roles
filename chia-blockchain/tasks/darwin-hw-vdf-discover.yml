---
# Installed role wrappers are the persisted inventory. Managed claims keep their
# IDs; legacy wrappers are taken over with their jobs stopped only for --list.
- name: Discover attached ASIC boards
  when:
    - chia_darwin_enable_hw_vdf | bool
    - chia_darwin_hw_vdf_boards | length == 0
    - chia_darwin_hw_vdf_expected_serial | length == 0
  block:
    - name: Read the role's installed hw-vdf wrappers
      become: "{{ chia_darwin_launchd_become | bool }}"
      become_user: "{{ user }}"
      ansible.builtin.slurp:
        src: "{{ item.wrapper }}"
      loop: "{{ chia_darwin_hw_vdf_slots }}"
      loop_control:
        label: "{{ item.id }}"
      register: chia_darwin_hw_vdf_persisted_wrappers
      failed_when: false

    - name: Classify installed wrappers as takeover candidates
      ansible.builtin.set_fact:
        chia_darwin_hw_vdf_takeover_labels: >-
          {{ chia_darwin_hw_vdf_persisted_wrappers.results | selectattr('content', 'defined')
            | map(attribute='item')
            | rejectattr('label', 'in', chia_darwin_hw_vdf_persisted_wrappers.results | chia_hw_vdf_claim_labels)
            | map(attribute='label') | list }}

    - name: Check privileged launchctl settings before takeover
      when: chia_darwin_hw_vdf_takeover_labels | length > 0
      ansible.builtin.include_tasks: darwin-hw-vdf-launchd-guard.yml

    - name: Check which plist runs each takeover wrapper
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.shell: |
        dir={{ chia_darwin_launchd_dir | quote }}
        wrapper={{ item.wrapper | quote }}
        label={{ item.label | quote }}
        [ -d "$dir" ] && [ -r "$dir" ] && [ -x "$dir" ] || { echo "Could not check every LaunchDaemon plist under $dir for wrapper ownership: Permission denied. Refusing the takeover." >&2; exit 2; }
        set -- "$dir"/*.plist
        [ -e "$1" ] || [ -L "$1" ] || exit 0
        matches=$(grep -lF -- "$wrapper" "$@" 2>/dev/null)
        status=$?
        [ "$status" -le 1 ] || { echo "Could not check every LaunchDaemon plist under $dir for wrapper ownership. Refusing the takeover." >&2; exit 2; }
        if [ -z "$matches" ] || [ "$matches" = "$dir/$label.plist" ]; then
          exit 0
        fi
        echo "$label is not safe to take over: a plist other than $dir/$label.plist also runs $wrapper: $matches." >&2
        exit 3
      args:
        executable: /bin/sh
      loop: "{{ chia_darwin_hw_vdf_slots | selectattr('label', 'in', chia_darwin_hw_vdf_takeover_labels) | list }}"
      loop_control:
        label: "{{ item.label }}"
      changed_when: false

    - name: Find loaded takeover jobs
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.shell: |
        for label in {{ chia_darwin_hw_vdf_takeover_labels | map('quote') | join(' ') }}; do
          {{ chia_darwin_launchctl | quote }} print "system/$label" >/dev/null 2>&1 &&
            echo "$label"
        done
        exit 0
      register: chia_darwin_hw_vdf_takeover_loaded
      changed_when: false

    - name: Stop and enumerate takeover boards
      block:
        - name: Stop LaunchDaemons auto-discovery takes over
          ansible.builtin.include_tasks: darwin-stop-job.yml
          loop: "{{ chia_darwin_hw_vdf_slots | selectattr('label', 'in', chia_darwin_hw_vdf_takeover_labels) | list }}"
          loop_control:
            loop_var: takeover_slot
            label: "{{ takeover_slot.label }}"
          vars:
            chia_job:
              label: "{{ takeover_slot.label }}"
              exit_timeout: "{{ chia_darwin_hw_vdf_exit_timeout }}"

        - name: List attached ASIC boards
          become: false
          ansible.builtin.command:
            argv: ["{{ chia_darwin_hw_vdf_client }}", --list]
          register: chia_darwin_hw_vdf_list
          changed_when: false
          failed_when: false

        - name: Require each takeover board to be visible after its job stops
          when: chia_darwin_hw_vdf_list.rc | default(1) | int == 0
          vars:
            hidden: "{{ chia_darwin_hw_vdf_persisted_wrappers.results | chia_hw_vdf_hidden_takeover(chia_darwin_hw_vdf_takeover_labels, chia_darwin_hw_vdf_list) }}"
          ansible.builtin.assert:
            that: hidden | length == 0
            fail_msg: >-
              {{ chia_darwin_hw_vdf_takeover_labels | join(', ') }} stopped, but
              {{ hidden | join(', ') }} is still hidden from hw_vdf_client --list.
              Another job or process inside or outside {{ chia_darwin_launchd_dir }}
              may hold it, or the board is detached. Refusing the takeover; set
              chia_darwin_hw_vdf_boards explicitly if a board is detached.
      always:
        # The install step and its ordered restart handler replace these jobs
        # later. Until then the old jobs keep running, so a later failure leaves
        # them up.
        - name: Find old takeover jobs that are no longer loaded
          become: "{{ chia_darwin_launchd_become | bool }}"
          ansible.builtin.shell: |
            for label in {{ chia_darwin_hw_vdf_takeover_loaded.stdout_lines | default([]) | map('quote') | join(' ') }}; do
              {{ chia_darwin_launchctl | quote }} print "system/$label" >/dev/null 2>&1 ||
                echo "$label"
            done
            exit 0
          register: chia_darwin_hw_vdf_takeover_stopped
          changed_when: false

        - name: Restart old hw-vdf jobs that were stopped for --list
          ansible.builtin.include_tasks: darwin-restart-job.yml
          loop: "{{ chia_darwin_hw_vdf_takeover_stopped.stdout_lines }}"
          loop_control:
            loop_var: takeover_label
            label: "{{ takeover_label }}"
          vars:
            chia_job:
              label: "{{ takeover_label }}"
              enabled: true
              exit_timeout: "{{ chia_darwin_hw_vdf_exit_timeout }}"
            chia_darwin_start_now: true

    - name: Merge attached boards with previously claimed boards
      ansible.builtin.set_fact:
        chia_darwin_hw_vdf_discovered_boards: >-
          {{ chia_darwin_hw_vdf_list | chia_hw_vdf_merge_boards(
            chia_darwin_hw_vdf_persisted_wrappers.results,
            chia_darwin_hw_vdf_serial_pattern, chia_darwin_hw_vdf_client,
            chia_darwin_hw_vdf_slots | map(attribute='id') | list) }}
