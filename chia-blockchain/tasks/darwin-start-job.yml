---
# Bootstrap one LaunchDaemon that is not loaded. The caller sets chia_job.
- name: See whether LaunchDaemon {{ chia_job.label }} is loaded
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl }}"
      - print
      - "system/{{ chia_job.label }}"
  register: chia_darwin_start_loaded
  changed_when: false
  failed_when: false

- name: Start LaunchDaemon {{ chia_job.label }}
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl }}"
      - bootstrap
      - system
      - "{{ chia_darwin_launchd_dir }}/{{ chia_job.label }}.plist"
  register: chia_darwin_start_bootstrap
  changed_when: chia_darwin_start_bootstrap.rc == 0
  failed_when: false
  retries: 10
  delay: 3
  until: chia_darwin_start_bootstrap.rc == 0
  when: chia_darwin_start_loaded.rc | int != 0
