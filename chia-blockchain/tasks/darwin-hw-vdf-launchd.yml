---
# Ownership is the plist text. A plist that runs this role's wrapper is ours.
# Anything else with the same label is left alone unless
# chia_darwin_hw_vdf_claim_existing is true.
- name: Require the system launchctl when the role becomes root
  when: chia_darwin_launchd_become | bool
  ansible.builtin.assert:
    that:
      - chia_darwin_launchctl in ["launchctl", "/bin/launchctl"]
      - chia_darwin_launchd_dir == "/Library/LaunchDaemons"
    fail_msg: >-
      chia_darwin_launchd_become is true, so chia_darwin_launchctl must be
      launchctl or /bin/launchctl and chia_darwin_launchd_dir must be
      /Library/LaunchDaemons.

- name: See whether each hw-vdf plist was written by this role
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - grep
      - -F
      - -q
      - "{{ item.wrapper }}"
      - "{{ chia_darwin_launchd_dir }}/{{ item.label }}.plist"
  register: chia_darwin_hw_plist_owner
  changed_when: false
  failed_when: false
  loop: "{{ chia_darwin_hw_vdf_jobs }}"
  loop_control:
    label: "{{ item.label }}"

- name: Refuse to replace a LaunchDaemon this role did not write
  ansible.builtin.fail:
    msg: >-
      {{ item.item.label }} already has
      {{ chia_darwin_launchd_dir }}/{{ item.item.label }}.plist, and that plist
      does not run {{ item.item.wrapper }}. This role will not replace it.
      Set chia_darwin_hw_vdf_claim_existing to true to take over that label.
  loop: "{{ chia_darwin_hw_plist_owner.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - item.item.enabled | bool
    - not (chia_darwin_hw_vdf_claim_existing | bool)
    - (item.rc | default(2) | int) == 1

- name: Clear the hw-vdf removal list
  ansible.builtin.set_fact:
    chia_darwin_hw_vdf_owned_labels: []
  changed_when: false

- name: Record hw-vdf jobs this role will remove
  ansible.builtin.set_fact:
    chia_darwin_hw_vdf_owned_labels: "{{ chia_darwin_hw_vdf_owned_labels + [item.item.label] }}"
  loop: "{{ chia_darwin_hw_plist_owner.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - not (item.item.enabled | bool)
    - (item.rc | default(2) | int) == 0
  changed_when: false

- name: Start the LaunchDaemon list with the non-ASIC jobs
  ansible.builtin.set_fact:
    chia_darwin_launchd_jobs: "{{ chia_darwin_service_jobs | default([]) }}"
  changed_when: false

- name: Add enabled or role-owned hw-vdf jobs
  ansible.builtin.set_fact:
    chia_darwin_launchd_jobs: "{{ chia_darwin_launchd_jobs + [item] }}"
  loop: "{{ chia_darwin_hw_vdf_jobs }}"
  loop_control:
    label: "{{ item.label }}"
  when: (item.enabled | bool) or (item.label in chia_darwin_hw_vdf_owned_labels)
  changed_when: false
