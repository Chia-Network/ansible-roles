---
# Ownership is the plist text. A plist that runs this role's wrapper is ours.
# Anything else with the same label is left alone unless
# chia_darwin_hw_vdf_claim_existing is true.
- name: Check privileged launchctl settings
  ansible.builtin.include_tasks: darwin-hw-vdf-launchd-guard.yml

- name: Read each board enabled flag as a boolean
  ansible.builtin.set_fact:
    chia_darwin_hw_vdf_jobs: >-
      {{
        chia_darwin_hw_vdf_jobs[:ansible_loop.index0]
        + [item | combine({'id': item.id | int, 'enabled': item.enabled | bool})]
        + chia_darwin_hw_vdf_jobs[ansible_loop.index0 + 1:]
      }}
  loop: "{{ chia_darwin_hw_vdf_jobs }}"
  loop_control:
    extended: true
    label: "{{ item.label }}"
  changed_when: false

- name: See whether each hw-vdf plist was written by this role
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - grep
      - -F
      - -q
      - "{{ item.wrapper }}"
      - "{{ chia_darwin_launchd_dir }}/{{ item.label }}.plist"
  register: chia_darwin_hw_plist_owner
  changed_when: false
  failed_when: false
  loop: "{{ chia_darwin_hw_vdf_jobs }}"
  loop_control:
    label: "{{ item.label }}"

- name: Refuse to replace a LaunchDaemon this role did not write
  ansible.builtin.fail:
    msg: >-
      {{ item.item.label }} already has
      {{ chia_darwin_launchd_dir }}/{{ item.item.label }}.plist, and that plist
      does not run {{ item.item.wrapper }}. This role will not replace it.
      Set chia_darwin_hw_vdf_claim_existing to true to take over that label.
  loop: "{{ chia_darwin_hw_plist_owner.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when:
    - item.item.enabled | bool
    - not (chia_darwin_hw_vdf_claim_existing | bool)
    - (item.rc | default(2) | int) == 1
    - item.item.label not in (chia_darwin_hw_vdf_takeover_labels | default([]))

- name: Build the LaunchDaemon list
  ansible.builtin.set_fact:
    chia_darwin_launchd_jobs: >-
      {{
        (chia_darwin_service_jobs | default([]))
        + (chia_darwin_hw_vdf_jobs | selectattr('enabled', 'equalto', true) | list)
        + (
          chia_darwin_hw_plist_owner.results
          | selectattr('rc', 'equalto', 0)
          | map(attribute='item')
          | selectattr('enabled', 'equalto', false)
          | rejectattr('label', 'in', chia_darwin_hw_vdf_takeover_labels | default([]))
          | list
        )
        + (
          chia_darwin_hw_vdf_jobs
          | selectattr('enabled', 'equalto', false)
          | selectattr('label', 'in', chia_darwin_hw_vdf_takeover_labels | default([]))
          | list
        )
      }}
  changed_when: false
