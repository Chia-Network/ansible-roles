---
# Unregister the vendor supervisor before replacing the app bundle or removing
# the role-managed registration. The vendor remove is preferred because it also
# removes the plist, but a failure must not leave the job loaded.
- name: Check for the vendor Timelord.app service installer
  ansible.builtin.stat:
    path: "{{ chia_darwin_timelord_app_installer }}"
  register: chia_darwin_timelord_app_stop_installer

- name: Unregister Timelord.app with the vendor installer
  become: true
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ chia_darwin_timelord_app_installer }}"
      - remove
  when: chia_darwin_timelord_app_stop_installer.stat.exists | default(false)
  changed_when: true
  failed_when: false

- name: Boot out a leftover Timelord.app registration
  become: true
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl }}"
      - bootout
      - "system/{{ chia_darwin_timelord_app_service_label }}"
  register: chia_darwin_timelord_app_stop_bootout
  changed_when: chia_darwin_timelord_app_stop_bootout.rc == 0
  failed_when: false

- name: Remove a leftover Timelord.app plist
  become: true
  ansible.builtin.file:
    path: "{{ chia_darwin_launchd_dir }}/{{ chia_darwin_timelord_app_service_label }}.plist"
    state: absent

- name: Wait for the Timelord.app service to unload
  ansible.builtin.include_tasks: darwin-timelord-app-wait.yml
