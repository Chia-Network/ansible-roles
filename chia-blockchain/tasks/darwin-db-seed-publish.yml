---
# Publish one staged snapshot file. The caller loops over this file so a failed
# rename stops the loop before any later file, especially the main database.
- name: Publish the database seed staging file {{ item }}
  ansible.builtin.command:
    argv:
      - /bin/mv
      - -f
      - "{{ chia_darwin_db_seed_staging_dir }}/{{ item }}"
      - "{{ chia_darwin_db_seed_db_dir }}/{{ item }}"
  changed_when: true
