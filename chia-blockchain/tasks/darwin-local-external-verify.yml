---
# Final layout check shared by every successful local-external path. The later
# darwin.yml follow=false db symlink assert stays as the second guard.
- name: Inspect the local-external CHIA_ROOT layout after the run
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ chia_darwin_local_external_dot_chia }}"
    - "{{ chia_darwin_local_external_root_db }}"
    - "{{ chia_darwin_volume_db_dir }}"
  register: chia_darwin_local_external_final_stats

- name: Require the local-external CHIA_ROOT layout to be complete
  ansible.builtin.assert:
    that:
      - chia_darwin_local_external_final_stats.results[0].stat.isdir | default(false)
      - not (chia_darwin_local_external_final_stats.results[0].stat.islnk | default(false))
      - chia_darwin_local_external_final_stats.results[1].stat.islnk | default(false)
      - >-
        (chia_darwin_local_external_final_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
        chia_darwin_local_external_volume_db_dir_norm
      - chia_darwin_local_external_final_stats.results[2].stat.isdir | default(false)
    fail_msg: >-
      The local-external layout is incomplete. Inspect
      {{ chia_darwin_local_external_dot_chia }} and
      {{ chia_darwin_volume_db_dir }}. The volume database was not moved or
      deleted.
