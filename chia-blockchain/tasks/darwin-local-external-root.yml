---
# local-external keeps ~/.chia and CHIA_ROOT on the internal disk. Only
# <chia_root>/db is a symlink onto the existing on-volume database directory
# <chia_darwin_volume_chia_dir>/<network>/db. Reusing that path keeps an
# existing database in place instead of moving it.
#
# This file creates the layout on a fresh host, repairs a missing db symlink,
# and migrates the old ~/.chia -> volume/dot-chia symlink without moving,
# copying, or deleting the blockchain database. A leftover non-db file on the
# volume is intentionally left in place after migration.
#
# The caller (darwin.yml) requires the database volume to be mounted before
# this include runs. The include also fails closed if that is not true.

- name: Set the local-external CHIA_ROOT paths
  ansible.builtin.set_fact:
    chia_darwin_local_external_dot_chia: "{{ chia_darwin_home }}/.chia"
    chia_darwin_local_external_dot_chia_legacy: "{{ chia_darwin_home }}/.chia.legacy-volume-link"
    chia_darwin_local_external_dot_chia_migrating: "{{ chia_darwin_home }}/.chia.migrating"
    chia_darwin_local_external_root_db: "{{ chia_root }}/db"
    chia_darwin_local_external_volume_chia_dir_norm: "{{ chia_darwin_volume_chia_dir | regex_replace('/+$', '') }}"
    chia_darwin_local_external_volume_db_dir_norm: "{{ chia_darwin_volume_db_dir | regex_replace('/+$', '') }}"
  changed_when: false

- name: Inspect the local-external CHIA_ROOT and volume paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ chia_darwin_local_external_dot_chia }}"
    - "{{ chia_darwin_local_external_root_db }}"
    - "{{ chia_darwin_volume_chia_dir }}"
    - "{{ chia_darwin_volume_db_dir }}"
    - "{{ chia_darwin_local_external_dot_chia_legacy }}"
    - "{{ chia_darwin_local_external_dot_chia_migrating }}"
  register: chia_darwin_local_external_path_stats

- name: Record the local-external CHIA_ROOT stats
  ansible.builtin.set_fact:
    chia_darwin_local_external_dot_chia_stat: "{{ chia_darwin_local_external_path_stats.results[0].stat }}"
    chia_darwin_local_external_root_db_stat: "{{ chia_darwin_local_external_path_stats.results[1].stat }}"
    chia_darwin_local_external_volume_chia_dir_stat: "{{ chia_darwin_local_external_path_stats.results[2].stat }}"
    chia_darwin_local_external_volume_db_dir_stat: "{{ chia_darwin_local_external_path_stats.results[3].stat }}"
    chia_darwin_local_external_legacy_stat: "{{ chia_darwin_local_external_path_stats.results[4].stat }}"
    chia_darwin_local_external_migrating_stat: "{{ chia_darwin_local_external_path_stats.results[5].stat }}"
  changed_when: false

- name: Classify the local-external CHIA_ROOT layout
  ansible.builtin.set_fact:
    chia_darwin_local_external_dot_kind: >-
      {%- if not (chia_darwin_local_external_dot_chia_stat.exists | default(false)) -%}absent{%- elif chia_darwin_local_external_dot_chia_stat.islnk | default(false) -%}{%- if (chia_darwin_local_external_dot_chia_stat.lnk_target | default('') | regex_replace('/+$', '')) == chia_darwin_local_external_volume_chia_dir_norm -%}legacy-volume-link{%- else -%}unexpected-symlink{%- endif -%}{%- elif chia_darwin_local_external_dot_chia_stat.isdir | default(false) -%}real-directory{%- else -%}unexpected{%- endif -%}
    chia_darwin_local_external_root_db_kind: >-
      {%- if not (chia_darwin_local_external_root_db_stat.exists | default(false)) -%}absent{%- elif chia_darwin_local_external_root_db_stat.islnk | default(false) -%}{%- if (chia_darwin_local_external_root_db_stat.lnk_target | default('') | regex_replace('/+$', '')) == chia_darwin_local_external_volume_db_dir_norm -%}correct-symlink{%- else -%}wrong-symlink{%- endif -%}{%- elif chia_darwin_local_external_root_db_stat.isdir | default(false) -%}real-directory{%- else -%}file{%- endif -%}
    chia_darwin_local_external_fresh: >-
      {{ (not (chia_darwin_local_external_dot_chia_stat.exists | default(false))) and
      (not (chia_darwin_local_external_migrating_stat.exists | default(false))) and
      (not (chia_darwin_local_external_legacy_stat.exists | default(false))) }}
  changed_when: false

- name: Read mounted filesystems before changing the local-external CHIA_ROOT
  ansible.builtin.command:
    argv: ["{{ chia_darwin_mount }}"]
  register: chia_darwin_local_external_mounts
  changed_when: false

- name: Require the database volume to be mounted before changing the local-external CHIA_ROOT
  ansible.builtin.assert:
    that:
      - chia_darwin_local_external_mounts.stdout is search(' on ' ~ (chia_darwin_db_volume | regex_escape) ~ ' ')
    fail_msg: >-
      {{ chia_darwin_db_volume }} is not mounted. Mount it before the
      local-external CHIA_ROOT can be prepared. No local CHIA_ROOT path was
      changed.

- name: Refuse a leftover local-external migration tree while ~/.chia exists
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_dot_chia_migrating }} exists while
      {{ chia_darwin_local_external_dot_chia }} also exists. A previous
      migration did not finish. Inspect and remove the staging tree manually
      before rerunning. This role will not overwrite it.
  when:
    - chia_darwin_local_external_dot_kind != "absent"
    - chia_darwin_local_external_migrating_stat.exists | default(false)

- name: Refuse an unexpected ~/.chia symlink target
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_dot_chia }} is a symlink to
      {{ chia_darwin_local_external_dot_chia_stat.lnk_target | default('') }},
      not {{ chia_darwin_volume_chia_dir }}. This role only migrates the
      historical local-external volume symlink. Move it aside manually.
  when: chia_darwin_local_external_dot_kind == "unexpected-symlink"

- name: Refuse an unexpected ~/.chia path type
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_dot_chia }} exists but is neither a
      directory nor a symlink. Move it aside before using local-external.
      This role does not delete data.
  when: chia_darwin_local_external_dot_kind == "unexpected"

- name: Finish a local-external migration interrupted after the first rename
  when:
    - chia_darwin_local_external_dot_kind == "absent"
    - chia_darwin_local_external_migrating_stat.exists | default(false)
    - chia_darwin_local_external_legacy_stat.exists | default(false)
  block:
    - name: Inspect the interrupted staging network directory
      ansible.builtin.stat:
        path: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ network }}"
      register: chia_darwin_local_external_interrupted_network

    - name: Require the interrupted staging tree to look complete
      ansible.builtin.assert:
        that:
          - chia_darwin_local_external_interrupted_network.stat.isdir | default(false)
        fail_msg: >-
          {{ chia_darwin_local_external_dot_chia }} is missing and
          {{ chia_darwin_local_external_dot_chia_migrating }} is not complete.
          The legacy link was left in place. Inspect both paths manually; this
          role will not overwrite the staging tree.

    - name: Finish the interrupted local-external swap
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.command:
        argv:
          - /bin/mv
          - "{{ chia_darwin_local_external_dot_chia_migrating }}"
          - "{{ chia_darwin_local_external_dot_chia }}"
      changed_when: true

    - name: Inspect the finished interrupted migration
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_local_external_dot_chia }}"
        - "{{ chia_darwin_local_external_root_db }}"
        - "{{ chia_darwin_volume_db_dir }}"
      register: chia_darwin_local_external_finished_stats

    - name: Require the finished interrupted migration to be complete
      ansible.builtin.assert:
        that:
          - chia_darwin_local_external_finished_stats.results[0].stat.isdir | default(false)
          - not (chia_darwin_local_external_finished_stats.results[0].stat.islnk | default(false))
          - chia_darwin_local_external_finished_stats.results[1].stat.islnk | default(false)
          - >-
            (chia_darwin_local_external_finished_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            chia_darwin_local_external_volume_db_dir_norm
          - chia_darwin_local_external_finished_stats.results[2].stat.isdir | default(false)
        fail_msg: >-
          The interrupted migration moved the staging tree into place but the
          result is incomplete. Inspect {{ chia_darwin_local_external_dot_chia }}
          and {{ chia_darwin_volume_db_dir }}. The volume database was not moved.

    - name: Request a Darwin restart after finishing the interrupted migration
      ansible.builtin.set_fact:
        chia_darwin_restart_services: true

- name: Refuse an incomplete interrupted local-external migration
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_dot_chia }} is missing and
      {{ chia_darwin_local_external_dot_chia_migrating }} exists without
      {{ chia_darwin_local_external_dot_chia_legacy }}. Inspect the staging
      tree manually; this role will not overwrite or delete it.
  when:
    - chia_darwin_local_external_dot_kind == "absent"
    - chia_darwin_local_external_migrating_stat.exists | default(false)
    - not (chia_darwin_local_external_legacy_stat.exists | default(false))

- name: Restore the legacy ~/.chia symlink after an interrupted swap
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - /bin/mv
      - "{{ chia_darwin_local_external_dot_chia_legacy }}"
      - "{{ chia_darwin_local_external_dot_chia }}"
  when:
    - chia_darwin_local_external_dot_kind == "absent"
    - not (chia_darwin_local_external_migrating_stat.exists | default(false))
    - chia_darwin_local_external_legacy_stat.exists | default(false)
  changed_when: true

- name: Request a Darwin restart after restoring the legacy symlink
  ansible.builtin.set_fact:
    chia_darwin_restart_services: true
  when:
    - chia_darwin_local_external_dot_kind == "absent"
    - not (chia_darwin_local_external_migrating_stat.exists | default(false))
    - chia_darwin_local_external_legacy_stat.exists | default(false)

- name: Fail an interrupted local-external migration that was restored
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_dot_chia }} was missing after an
      interrupted swap. The legacy symlink was restored so the services can
      run. Rerun the role to retry the migration.
  when:
    - chia_darwin_local_external_dot_kind == "absent"
    - not (chia_darwin_local_external_migrating_stat.exists | default(false))
    - chia_darwin_local_external_legacy_stat.exists | default(false)

- name: Refuse to replace a conflicting db path on a fresh local-external host
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_root_db }} exists as
      {{ chia_darwin_local_external_root_db_kind }} while ~/.chia is absent.
      This role will not replace a real local database or retarget a symlink.
  when:
    - chia_darwin_local_external_fresh | bool
    - chia_darwin_local_external_root_db_kind not in ["absent", "correct-symlink"]

- name: Create the internal ~/.chia directory
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    path: "{{ chia_darwin_local_external_dot_chia }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  when: chia_darwin_local_external_fresh | bool

- name: Ensure the internal CHIA_ROOT directory exists for local-external
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    path: "{{ chia_root }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  when: chia_darwin_local_external_fresh | bool

- name: Ensure the on-volume database directory exists for local-external
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    path: "{{ chia_darwin_volume_db_dir }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  when: chia_darwin_local_external_fresh | bool

- name: Link the local-external database path at the on-volume database
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    src: "{{ chia_darwin_volume_db_dir }}"
    dest: "{{ chia_darwin_local_external_root_db }}"
    state: link
    force: false
  when:
    - chia_darwin_local_external_fresh | bool
    - chia_darwin_local_external_root_db_kind == "absent"

- name: Refuse to replace a real local database directory with a symlink
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_root_db }} is a real directory while
      {{ chia_darwin_local_external_dot_chia }} is already a real directory.
      The data may already be local. This role will not replace it with a
      symlink. Move it aside manually if the on-volume database should be used.
  when:
    - chia_darwin_local_external_dot_kind == "real-directory"
    - chia_darwin_local_external_root_db_kind == "real-directory"

- name: Refuse to retarget a db symlink with an unexpected target
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_root_db }} is a symlink to
      {{ chia_darwin_local_external_root_db_stat.lnk_target | default('') }},
      not {{ chia_darwin_volume_db_dir }}. This role will not retarget it.
  when:
    - chia_darwin_local_external_dot_kind == "real-directory"
    - chia_darwin_local_external_root_db_kind == "wrong-symlink"

- name: Refuse to replace a file at the local-external db path
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_root_db }} is a regular file. This role
      will not replace it with a symlink. Move it aside manually.
  when:
    - chia_darwin_local_external_dot_kind == "real-directory"
    - chia_darwin_local_external_root_db_kind == "file"

- name: Ensure the internal CHIA_ROOT directory exists for a db symlink repair
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    path: "{{ chia_root }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  when:
    - chia_darwin_local_external_dot_kind == "real-directory"
    - chia_darwin_local_external_root_db_kind == "absent"

- name: Ensure the on-volume database directory exists for a db symlink repair
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    path: "{{ chia_darwin_volume_db_dir }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  when:
    - chia_darwin_local_external_dot_kind == "real-directory"
    - chia_darwin_local_external_root_db_kind == "absent"

- name: Repair a missing local-external database symlink
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.file:
    src: "{{ chia_darwin_volume_db_dir }}"
    dest: "{{ chia_darwin_local_external_root_db }}"
    state: link
    force: false
  when:
    - chia_darwin_local_external_dot_kind == "real-directory"
    - chia_darwin_local_external_root_db_kind == "absent"

- name: Refuse a legacy migration when the legacy backup path already exists
  ansible.builtin.fail:
    msg: >-
      {{ chia_darwin_local_external_dot_chia_legacy }} already exists while
      {{ chia_darwin_local_external_dot_chia }} is still the legacy volume
      symlink. Inspect both paths manually before rerunning. This role will not
      overwrite the backup path.
  when:
    - chia_darwin_local_external_dot_kind == "legacy-volume-link"
    - chia_darwin_local_external_legacy_stat.exists | default(false)

- name: Require the existing on-volume database directory for the legacy migration
  ansible.builtin.assert:
    that:
      - chia_darwin_local_external_volume_db_dir_stat.isdir | default(false)
    fail_msg: >-
      {{ chia_darwin_volume_db_dir }} does not exist or is not a directory.
      The legacy migration expects the existing on-volume database and will
      not invent a new location. Nothing local was changed.
  when: chia_darwin_local_external_dot_kind == "legacy-volume-link"

- name: Migrate the legacy external CHIA_ROOT symlink
  when:
    - chia_darwin_local_external_dot_kind == "legacy-volume-link"
    - not (chia_darwin_local_external_legacy_stat.exists | default(false))
  block:
    - name: Record the chia LaunchDaemons stopped for the migration
      ansible.builtin.set_fact:
        chia_darwin_local_external_jobs_stopped: >-
          {{ chia_darwin_launchd_jobs | default([]) | selectattr('enabled', 'truthy') | list | length > 0 }}
      changed_when: false

    - name: Stop the enabled chia LaunchDaemons before the migration
      vars:
        chia_job: "{{ item }}"
      ansible.builtin.include_tasks: darwin-stop-job.yml
      loop: "{{ chia_darwin_launchd_jobs | default([]) | selectattr('enabled', 'truthy') | list }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Create the local-external migration staging directory
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.file:
        path: "{{ chia_darwin_local_external_dot_chia_migrating }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ chia_darwin_group }}"
        mode: "0755"

    - name: Copy non-database CHIA_ROOT contents into the staging directory
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.command:
        argv:
          - /usr/bin/rsync
          - -a
          - --exclude=/*/db/
          - --exclude=/*/db/**
          - "{{ chia_darwin_volume_chia_dir }}/"
          - "{{ chia_darwin_local_external_dot_chia_migrating }}/"
      changed_when: true

    - name: List the top-level network directories on the database volume
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.find:
        paths: "{{ chia_darwin_volume_chia_dir }}"
        file_type: directory
        recurse: false
      register: chia_darwin_local_external_volume_networks

    - name: Inspect each volume network database directory
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.stat:
        path: "{{ item.path }}/db"
        follow: false
      loop: "{{ chia_darwin_local_external_volume_networks.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: chia_darwin_local_external_volume_network_dbs

    - name: Ensure each staged network directory exists
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.file:
        path: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ item.path | basename }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ chia_darwin_group }}"
        mode: "0755"
      loop: "{{ chia_darwin_local_external_volume_networks.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Link each staged network database directory at the volume
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.file:
        src: "{{ item.item.path }}/db"
        dest: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ item.item.path | basename }}/db"
        state: link
        force: false
      loop: "{{ chia_darwin_local_external_volume_network_dbs.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list }}"
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Ensure the current network staging directory exists
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.file:
        path: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ network }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ chia_darwin_group }}"
        mode: "0755"

    - name: Link the current network database directory at the volume
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.file:
        src: "{{ chia_darwin_volume_db_dir }}"
        dest: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ network }}/db"
        state: link
        force: false

    - name: Rename the legacy ~/.chia symlink out of the way
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.command:
        argv:
          - /bin/mv
          - "{{ chia_darwin_local_external_dot_chia }}"
          - "{{ chia_darwin_local_external_dot_chia_legacy }}"
      changed_when: true

    - name: Move the staged internal CHIA_ROOT into place
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.command:
        argv:
          - /bin/mv
          - "{{ chia_darwin_local_external_dot_chia_migrating }}"
          - "{{ chia_darwin_local_external_dot_chia }}"
      changed_when: true

    - name: Inspect the migrated local-external CHIA_ROOT
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_local_external_dot_chia }}"
        - "{{ chia_darwin_local_external_root_db }}"
        - "{{ chia_darwin_volume_db_dir }}"
      register: chia_darwin_local_external_migrated_stats

    - name: Require the migrated local-external layout to be complete
      ansible.builtin.assert:
        that:
          - chia_darwin_local_external_migrated_stats.results[0].stat.isdir | default(false)
          - not (chia_darwin_local_external_migrated_stats.results[0].stat.islnk | default(false))
          - chia_darwin_local_external_migrated_stats.results[1].stat.islnk | default(false)
          - >-
            (chia_darwin_local_external_migrated_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            chia_darwin_local_external_volume_db_dir_norm
          - chia_darwin_local_external_migrated_stats.results[2].stat.isdir | default(false)
        fail_msg: >-
          The migration finished but the resulting layout is incomplete.
          Inspect {{ chia_darwin_local_external_dot_chia }} and
          {{ chia_darwin_volume_db_dir }}. The volume database was not moved or
          deleted.

  rescue:
    - name: Inspect ~/.chia after a failed local-external migration
      ansible.builtin.stat:
        path: "{{ chia_darwin_local_external_dot_chia }}"
        follow: false
      register: chia_darwin_local_external_failed_dot

    - name: Inspect the legacy link after a failed local-external migration
      ansible.builtin.stat:
        path: "{{ chia_darwin_local_external_dot_chia_legacy }}"
        follow: false
      register: chia_darwin_local_external_failed_legacy

    - name: Restore the legacy ~/.chia symlink after a failed swap
      become: "{{ chia_darwin_launchd_become | bool }}"
      ansible.builtin.command:
        argv:
          - /bin/mv
          - "{{ chia_darwin_local_external_dot_chia_legacy }}"
          - "{{ chia_darwin_local_external_dot_chia }}"
      when:
        - not (chia_darwin_local_external_failed_dot.stat.exists | default(false))
        - chia_darwin_local_external_failed_legacy.stat.islnk | default(false)
      changed_when: true

    - name: Report the failed local-external migration
      ansible.builtin.fail:
        msg: >-
          The local-external CHIA_ROOT migration failed while running
          "{{ ansible_failed_task.name | default('a migration task') }}":
          {{ ansible_failed_result.msg | default('no further detail') }}.
          The database on the volume was not moved or deleted. Inspect
          {{ chia_darwin_local_external_dot_chia_legacy }} and
          {{ chia_darwin_local_external_dot_chia_migrating }} before rerunning.

  always:
    - name: Request a Darwin service restart after the migration attempt
      ansible.builtin.set_fact:
        chia_darwin_restart_services: true
