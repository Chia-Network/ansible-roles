---
# local-external keeps ~/.chia and CHIA_ROOT on the internal disk. Only
# <chia_root>/db is a symlink onto the existing on-volume database directory
# <chia_darwin_volume_chia_dir>/<network>/db. This file creates that layout,
# repairs a missing db symlink, and migrates the old ~/.chia -> volume/dot-chia
# symlink without moving, copying, or deleting the blockchain database. A
# failed migration moves its staging tree aside and brings every job back.
# The caller (darwin.yml) requires the volume to be mounted first.

- name: Set the local-external CHIA_ROOT paths
  ansible.builtin.set_fact:
    chia_darwin_local_external_dot_chia: "{{ chia_darwin_home }}/.chia"
    chia_darwin_local_external_dot_chia_legacy: "{{ chia_darwin_home }}/.chia.legacy-volume-link"
    chia_darwin_local_external_dot_chia_migrating: "{{ chia_darwin_home }}/.chia.migrating"
    chia_darwin_local_external_dot_chia_leftover: "{{ chia_darwin_home }}/.chia.migrating.leftover"
    chia_darwin_local_external_root_db: "{{ chia_root }}/db"
    chia_darwin_local_external_volume_chia_dir_norm: "{{ chia_darwin_volume_chia_dir | regex_replace('/+$', '') }}"
    chia_darwin_local_external_volume_db_dir_norm: "{{ chia_darwin_volume_db_dir | regex_replace('/+$', '') }}"
    chia_darwin_local_external_paths:
      dot: "{{ chia_darwin_home }}/.chia"
      root_db: "{{ chia_root }}/db"
      volume_db: "{{ chia_darwin_volume_db_dir }}"
      legacy: "{{ chia_darwin_home }}/.chia.legacy-volume-link"
      migrating: "{{ chia_darwin_home }}/.chia.migrating"
  changed_when: false

- name: Inspect the local-external CHIA_ROOT and volume paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ chia_darwin_local_external_paths.values() | list }}"
  register: chia_darwin_local_external_path_stats
  failed_when: false

- name: Record the local-external CHIA_ROOT stats
  ansible.builtin.set_fact:
    chia_darwin_local_external_stats: >-
      {{ dict(chia_darwin_local_external_paths.keys() | list
      | zip(chia_darwin_local_external_path_stats.results | map(attribute='stat', default={}) | list)) }}
    chia_darwin_local_external_staging_present: >-
      {{ (chia_darwin_local_external_path_stats.results | map(attribute='stat', default={}) | list)[4].exists | default(false) }}
  changed_when: false

- name: Classify the local-external CHIA_ROOT layout
  vars:
    dot: "{{ chia_darwin_local_external_stats.dot }}"
    root_db: "{{ chia_darwin_local_external_stats.root_db }}"
    volume_chia_norm: "{{ chia_darwin_local_external_volume_chia_dir_norm }}"
    volume_db_norm: "{{ chia_darwin_local_external_volume_db_dir_norm }}"
  ansible.builtin.set_fact:
    chia_darwin_local_external_dot_kind: >-
      {{ 'absent' if not (dot.exists | default(false))
      else ('legacy-volume-link'
      if (dot.islnk | default(false)) and
      ((dot.lnk_target | default('') | regex_replace('/+$', '')) == volume_chia_norm)
      else ('unexpected-symlink' if dot.islnk | default(false)
      else ('real-directory' if dot.isdir | default(false) else 'unexpected'))) }}
    chia_darwin_local_external_root_db_kind: >-
      {{ 'absent' if not (root_db.exists | default(false))
      else ('correct-symlink'
      if (root_db.islnk | default(false)) and
      ((root_db.lnk_target | default('') | regex_replace('/+$', '')) == volume_db_norm)
      else ('wrong-symlink' if root_db.islnk | default(false)
      else ('real-directory' if root_db.isdir | default(false) else 'file'))) }}
  changed_when: false

- name: Detect the portable directory rename flag
  ansible.builtin.command:
    argv:
      - /bin/sh
      - -c
      - 'if [ "$(/usr/bin/uname -s)" = Darwin ]; then printf %s -h; else printf %s -T; fi'
  register: chia_darwin_local_external_rename_flag
  changed_when: false

- name: Move a leftover staging tree aside while ~/.chia exists
  when:
    - chia_darwin_local_external_dot_kind != "absent"
    - chia_darwin_local_external_staging_present | bool
  block:
    - name: Pick an unused leftover name for the staging tree
      ansible.builtin.include_tasks: darwin-local-external-leftover.yml

    - name: Rename the leftover migration staging tree aside
      ansible.builtin.include_tasks: darwin-local-external-rename.yml
      vars:
        local_external_rename_src: "{{ chia_darwin_local_external_dot_chia_migrating }}"
        local_external_rename_dest: "{{ chia_darwin_local_external_leftover }}"
        local_external_rename_name: "the leftover migration staging tree"

    - name: Record that the staging tree was moved aside
      ansible.builtin.set_fact:
        chia_darwin_local_external_staging_present: false
      changed_when: false

- name: Classify the local-external layout action and refusal
  vars:
    stats: "{{ chia_darwin_local_external_stats }}"
    dot: "{{ chia_darwin_local_external_stats.dot }}"
    root_db: "{{ chia_darwin_local_external_stats.root_db }}"
    migrating: "{{ chia_darwin_local_external_dot_chia_migrating }}"
    legacy: "{{ chia_darwin_local_external_dot_chia_legacy }}"
    volume_chia: "{{ chia_darwin_volume_chia_dir }}"
    volume_db: "{{ chia_darwin_volume_db_dir }}"
    legacy_exists: "{{ chia_darwin_local_external_stats.legacy.exists | default(false) }}"
    ensure_layout: >-
      {{ (chia_darwin_local_external_dot_kind == 'real-directory') or
      (chia_darwin_local_external_dot_kind == 'absent' and
      not (chia_darwin_local_external_staging_present | bool) and
      not (chia_darwin_local_external_stats.legacy.exists | default(false))) }}
  ansible.builtin.set_fact:
    chia_darwin_local_external_ensure_layout: "{{ ensure_layout | bool }}"
    chia_darwin_local_external_refusal: >-
      {{ 'finished-backup'
      if (chia_darwin_local_external_dot_kind == 'absent' and not (chia_darwin_local_external_staging_present | bool) and legacy_exists)
      else ('incomplete-interrupted'
      if (chia_darwin_local_external_dot_kind == 'absent' and (chia_darwin_local_external_staging_present | bool) and not legacy_exists)
      else ('unexpected-symlink'
      if chia_darwin_local_external_dot_kind == 'unexpected-symlink'
      else ('unexpected'
      if chia_darwin_local_external_dot_kind == 'unexpected'
      else ('legacy-backup-exists'
      if (chia_darwin_local_external_dot_kind == 'legacy-volume-link' and legacy_exists)
      else ('volume-db-missing'
      if (chia_darwin_local_external_dot_kind == 'legacy-volume-link' and not (stats.volume_db.isdir | default(false)))
      else ('db-real-directory'
      if (ensure_layout and chia_darwin_local_external_root_db_kind == 'real-directory')
      else ('db-wrong-symlink'
      if (ensure_layout and chia_darwin_local_external_root_db_kind == 'wrong-symlink')
      else ('db-file'
      if (ensure_layout and chia_darwin_local_external_root_db_kind == 'file') else '')))))))) }}
  changed_when: false

- name: Refuse an unsafe or unfinished local-external layout
  vars:
    stats: "{{ chia_darwin_local_external_stats }}"
    dot: "{{ chia_darwin_local_external_dot_chia }}"
    root_db: "{{ chia_darwin_local_external_root_db }}"
    migrating: "{{ chia_darwin_local_external_dot_chia_migrating }}"
    legacy: "{{ chia_darwin_local_external_dot_chia_legacy }}"
    volume_chia: "{{ chia_darwin_volume_chia_dir }}"
    volume_db: "{{ chia_darwin_volume_db_dir }}"
  ansible.builtin.fail:
    msg: >-
      {{ {
        'finished-backup': dot ~ ' is missing but ' ~ legacy ~ " exists. That link is a finished migration's backup; this role will not restore the old volume layout. Restore ~/.chia or move the legacy link aside.",
        'incomplete-interrupted': dot ~ ' is missing and ' ~ migrating ~ ' exists without ' ~ legacy ~ '. Inspect the staging tree manually; this role will not overwrite or delete it.',
        'unexpected-symlink': dot ~ ' is a symlink to ' ~ (stats.dot.lnk_target | default('')) ~ ', not ' ~ volume_chia ~ '. This role only migrates the historical local-external volume symlink. Move it aside manually.',
        'unexpected': dot ~ ' exists but is neither a directory nor a symlink. Move it aside before using local-external. This role does not delete data.',
        'legacy-backup-exists': legacy ~ ' already exists while ' ~ dot ~ ' is still the legacy volume symlink. Inspect both paths manually before rerunning. This role will not overwrite the backup path.',
        'volume-db-missing': volume_db ~ ' does not exist or is not a directory. The legacy migration expects the existing on-volume database and will not invent a new location. Nothing local was changed.',
        'db-real-directory': root_db ~ ' is a real directory. The data may already be local. This role will not replace it with a symlink. Move it aside manually if the on-volume database should be used.',
        'db-wrong-symlink': root_db ~ ' is a symlink to ' ~ (stats.root_db.lnk_target | default('')) ~ ', not ' ~ volume_db ~ '. This role will not retarget it.',
        'db-file': root_db ~ ' is a regular file. This role will not replace it with a symlink. Move it aside manually.'
      }[chia_darwin_local_external_refusal] }}
  when: chia_darwin_local_external_refusal | length > 0

- name: Find large non-database files the legacy migration would copy
  become: "{{ chia_darwin_launchd_become | bool }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/find
      - "{{ chia_darwin_volume_chia_dir }}/"
      - -path
      - "{{ chia_darwin_volume_chia_dir }}/*/db"
      - -prune
      - -o
      - -type
      - f
      - -size
      - "+{{ chia_darwin_local_external_copy_max_mb | default(512) }}M"
      - -print
  register: chia_darwin_local_external_big_files
  changed_when: false
  when: chia_darwin_local_external_dot_kind == "legacy-volume-link"

- name: Refuse to copy large non-database files onto the internal disk
  ansible.builtin.assert:
    that:
      - chia_darwin_local_external_big_files.stdout_lines | default([]) | length == 0
    fail_msg: >-
      Move these files off the CHIA_ROOT tree before migrating:
      {{ chia_darwin_local_external_big_files.stdout_lines | default([]) }}
  when: chia_darwin_local_external_dot_kind == "legacy-volume-link"

- name: Finish a local-external migration interrupted after the first rename
  when:
    - chia_darwin_local_external_dot_kind == "absent"
    - chia_darwin_local_external_staging_present | bool
    - chia_darwin_local_external_stats.legacy.exists | default(false)
  block:
    - name: Inspect the interrupted staging network directory
      ansible.builtin.stat:
        path: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ network }}"
        follow: false
      register: chia_darwin_local_external_interrupted_network

    - name: Require the interrupted staging tree to look complete
      ansible.builtin.assert:
        that:
          - chia_darwin_local_external_interrupted_network.stat.isdir | default(false)
        fail_msg: >-
          {{ chia_darwin_local_external_dot_chia }} is missing and
          {{ chia_darwin_local_external_dot_chia_migrating }} is not complete.
          The legacy link was left in place. Inspect both paths manually; this
          role will not overwrite the staging tree.

    - name: Finish the interrupted local-external swap
      ansible.builtin.include_tasks: darwin-local-external-rename.yml
      vars:
        local_external_rename_src: "{{ chia_darwin_local_external_dot_chia_migrating }}"
        local_external_rename_dest: "{{ chia_darwin_local_external_dot_chia }}"
        local_external_rename_name: "the interrupted migration staging tree"

    - name: Request a Darwin restart after finishing the interrupted migration
      ansible.builtin.set_fact:
        chia_darwin_restart_services: true

- name: Ensure the local-external directories exist
  become: "{{ chia_darwin_launchd_become | bool }}"
  become_user: "{{ user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  loop: >-
    {{ ([chia_darwin_local_external_dot_chia]
    if chia_darwin_local_external_dot_kind == 'absent' else []) +
    ([chia_root, chia_darwin_volume_db_dir]
    if chia_darwin_local_external_root_db_kind == 'absent' else []) }}
  when: chia_darwin_local_external_ensure_layout | bool

- name: Link the local-external database path at the on-volume database
  become: "{{ chia_darwin_launchd_become | bool }}"
  become_user: "{{ user }}"
  ansible.builtin.file:
    src: "{{ chia_darwin_volume_db_dir }}"
    dest: "{{ chia_darwin_local_external_root_db }}"
    state: link
    force: false
  when:
    - chia_darwin_local_external_ensure_layout | bool
    - chia_darwin_local_external_root_db_kind == "absent"

- name: Migrate the legacy external CHIA_ROOT symlink
  when:
    - chia_darwin_local_external_dot_kind == "legacy-volume-link"
    - not (chia_darwin_local_external_stats.legacy.exists | default(false))
  block:
    # Staging runs as the service user in production so rsync -a keeps user
    # ownership and links are not root:wheel. launchctl stays with the daemon
    # user (become launchd_become, no become_user).
    - name: Stop the enabled chia LaunchDaemons before the migration
      vars:
        chia_job: "{{ item }}"
      ansible.builtin.include_tasks: darwin-stop-job.yml
      loop: "{{ chia_darwin_launchd_jobs | default([]) | selectattr('enabled', 'truthy') | list }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Create the local-external migration staging directory
      become: "{{ chia_darwin_launchd_become | bool }}"
      become_user: "{{ user }}"
      ansible.builtin.file:
        path: "{{ chia_darwin_local_external_dot_chia_migrating }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ chia_darwin_group }}"
        mode: "0755"

    - name: Copy non-database CHIA_ROOT contents into the staging directory
      become: "{{ chia_darwin_launchd_become | bool }}"
      become_user: "{{ user }}"
      ansible.builtin.command:
        argv:
          - "{{ chia_darwin_rsync }}"
          - -a
          - --exclude=/*/db/
          - --exclude=/*/db/**
          - "{{ chia_darwin_volume_chia_dir }}/"
          - "{{ chia_darwin_local_external_dot_chia_migrating }}/"
      changed_when: true

    - name: List the top-level network directories on the database volume
      become: "{{ chia_darwin_launchd_become | bool }}"
      become_user: "{{ user }}"
      ansible.builtin.find:
        paths: "{{ chia_darwin_volume_chia_dir }}"
        file_type: directory
        recurse: false
      register: chia_darwin_local_external_volume_networks

    - name: Inspect each volume network database directory
      become: "{{ chia_darwin_launchd_become | bool }}"
      become_user: "{{ user }}"
      ansible.builtin.stat:
        path: "{{ item.path }}/db"
        follow: false
      loop: "{{ chia_darwin_local_external_volume_networks.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: chia_darwin_local_external_volume_network_dbs

    - name: Ensure each staged network directory exists
      become: "{{ chia_darwin_launchd_become | bool }}"
      become_user: "{{ user }}"
      ansible.builtin.file:
        path: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ item.path | basename }}"
        state: directory
        owner: "{{ user }}"
        group: "{{ chia_darwin_group }}"
        mode: "0755"
      loop: "{{ chia_darwin_local_external_volume_networks.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: Link each staged network database directory at the volume
      become: "{{ chia_darwin_launchd_become | bool }}"
      become_user: "{{ user }}"
      ansible.builtin.file:
        src: "{{ item.item.path }}/db"
        dest: "{{ chia_darwin_local_external_dot_chia_migrating }}/{{ item.item.path | basename }}/db"
        state: link
        force: false
      loop: "{{ chia_darwin_local_external_volume_network_dbs.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list }}"
      loop_control:
        label: "{{ item.item.path | basename }}"

    - name: Rename the legacy ~/.chia symlink out of the way
      ansible.builtin.include_tasks: darwin-local-external-rename.yml
      vars:
        local_external_rename_src: "{{ chia_darwin_local_external_dot_chia }}"
        local_external_rename_dest: "{{ chia_darwin_local_external_dot_chia_legacy }}"
        local_external_rename_name: "the legacy ~/.chia symlink"

    - name: Move the staged internal CHIA_ROOT into place
      ansible.builtin.include_tasks: darwin-local-external-rename.yml
      vars:
        local_external_rename_src: "{{ chia_darwin_local_external_dot_chia_migrating }}"
        local_external_rename_dest: "{{ chia_darwin_local_external_dot_chia }}"
        local_external_rename_name: "the staged internal CHIA_ROOT"

  rescue:
    - name: Inspect ~/.chia and the legacy link after a failed migration
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_local_external_dot_chia }}"
        - "{{ chia_darwin_local_external_dot_chia_legacy }}"
      register: chia_darwin_local_external_failed_stats

    - name: Restore the legacy ~/.chia symlink after a failed swap
      ansible.builtin.include_tasks: darwin-local-external-rename.yml
      vars:
        local_external_rename_src: "{{ chia_darwin_local_external_dot_chia_legacy }}"
        local_external_rename_dest: "{{ chia_darwin_local_external_dot_chia }}"
        local_external_rename_name: "the restored legacy ~/.chia symlink"
      when:
        - not (chia_darwin_local_external_failed_stats.results[0].stat.exists | default(false))
        - chia_darwin_local_external_failed_stats.results[1].stat.islnk | default(false)

    - name: Inspect ~/.chia and staging after restoring the legacy link
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_local_external_dot_chia }}"
        - "{{ chia_darwin_local_external_dot_chia_migrating }}"
      register: chia_darwin_local_external_restored_stats

    - name: Pick an unused leftover name for the failed staging tree
      ansible.builtin.include_tasks: darwin-local-external-leftover.yml

    - name: Move a failed migration's staging tree aside
      ansible.builtin.include_tasks: darwin-local-external-rename.yml
      vars:
        local_external_rename_src: "{{ chia_darwin_local_external_dot_chia_migrating }}"
        local_external_rename_dest: "{{ chia_darwin_local_external_leftover }}"
        local_external_rename_name: "the failed migration staging tree"
      when:
        - chia_darwin_local_external_restored_stats.results[0].stat.exists | default(false)
        - chia_darwin_local_external_restored_stats.results[1].stat.exists | default(false)

    - name: Report the failed local-external migration
      ansible.builtin.fail:
        msg: >-
          The local-external CHIA_ROOT migration failed while running
          "{{ ansible_failed_task.name | default('a migration task') }}":
          {{ ansible_failed_result.msg | default('no further detail') }}.
          The database on the volume was not moved or deleted. Inspect
          {{ chia_darwin_local_external_dot_chia_legacy }} and
          {{ chia_darwin_local_external_dot_chia_migrating }} before rerunning.

  always:
    - name: Inspect ~/.chia after the migration attempt
      ansible.builtin.stat:
        path: "{{ chia_darwin_local_external_dot_chia }}"
        follow: false
      register: chia_darwin_local_external_after_dot

    - name: Ask the ordered restart to bring back every job the migration stopped
      ansible.builtin.set_fact:
        chia_darwin_restart_services: true
        chia_darwin_restart_companions: true
      when: chia_darwin_local_external_after_dot.stat.exists | default(false)

    - name: Restart the jobs the migration stopped
      ansible.builtin.include_tasks: darwin-restart-ordered.yml
      when: chia_darwin_local_external_after_dot.stat.exists | default(false)

    - name: Request a Darwin service restart for later wrapper changes
      ansible.builtin.set_fact:
        chia_darwin_restart_services: true

- name: Verify the local-external CHIA_ROOT layout
  ansible.builtin.include_tasks: darwin-local-external-verify.yml
