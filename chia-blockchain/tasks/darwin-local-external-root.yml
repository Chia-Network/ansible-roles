---
# local-external keeps ~/.chia and CHIA_ROOT on the internal disk. Only
# <chia_root>/db is a symlink to <chia_darwin_volume_chia_dir>/<network>/db.
# The same path creates a fresh layout and leaves a converged one unchanged.
# A legacy ~/.chia volume symlink is refused and left untouched; this role
# never migrates, renames, or deletes user data. The caller (darwin.yml)
# requires the volume to be mounted first.

- name: Set the local-external CHIA_ROOT paths
  ansible.builtin.set_fact:
    chia_darwin_local_external_dot_chia: "{{ chia_darwin_home }}/.chia"
    chia_darwin_local_external_dot_chia_legacy: "{{ chia_darwin_home }}/.chia.legacy-volume-link"
    chia_darwin_local_external_dot_chia_migrating: "{{ chia_darwin_home }}/.chia.migrating"
    chia_darwin_local_external_root_db: "{{ chia_root }}/db"
    chia_darwin_local_external_volume_chia_dir_norm: "{{ chia_darwin_volume_chia_dir | regex_replace('/+$', '') }}"
    chia_darwin_local_external_volume_db_dir_norm: "{{ chia_darwin_volume_db_dir | regex_replace('/+$', '') }}"
    chia_darwin_local_external_paths:
      dot: "{{ chia_darwin_home }}/.chia"
      chia_root: "{{ chia_root }}"
      root_db: "{{ chia_root }}/db"
      volume_db: "{{ chia_darwin_volume_db_dir }}"
      legacy: "{{ chia_darwin_home }}/.chia.legacy-volume-link"
      migrating: "{{ chia_darwin_home }}/.chia.migrating"
  changed_when: false

- name: Inspect the local-external CHIA_ROOT and volume paths
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: "{{ chia_darwin_local_external_paths.values() | list }}"
  register: chia_darwin_local_external_path_stats
  failed_when: false

- name: Record the local-external CHIA_ROOT stats
  ansible.builtin.set_fact:
    chia_darwin_local_external_stats: >-
      {{ dict(chia_darwin_local_external_paths.keys() | list
      | zip(chia_darwin_local_external_path_stats.results | map(attribute='stat', default={}) | list)) }}
  changed_when: false

- name: Classify the local-external CHIA_ROOT layout
  vars:
    dot: "{{ chia_darwin_local_external_stats.dot }}"
    root: "{{ chia_darwin_local_external_stats.chia_root }}"
    root_db: "{{ chia_darwin_local_external_stats.root_db }}"
    volume_db: "{{ chia_darwin_local_external_stats.volume_db }}"
    volume_chia_norm: "{{ chia_darwin_local_external_volume_chia_dir_norm }}"
    volume_db_norm: "{{ chia_darwin_local_external_volume_db_dir_norm }}"
  ansible.builtin.set_fact:
    chia_darwin_local_external_dot_kind: >-
      {{ 'absent' if not (dot.exists | default(false))
      else ('legacy-volume-link'
      if (dot.islnk | default(false)) and
      ((dot.lnk_target | default('') | regex_replace('/+$', '')) == volume_chia_norm)
      else ('unexpected-symlink' if dot.islnk | default(false)
      else ('real-directory' if dot.isdir | default(false) else 'unexpected'))) }}
    chia_darwin_local_external_chia_root_kind: >-
      {{ 'absent' if not (root.exists | default(false))
      else ('symlink' if root.islnk | default(false)
      else ('real-directory' if root.isdir | default(false) else 'unexpected')) }}
    chia_darwin_local_external_root_db_kind: >-
      {{ 'absent' if not (root_db.exists | default(false))
      else ('correct-symlink'
      if (root_db.islnk | default(false)) and
      ((root_db.lnk_target | default('') | regex_replace('/+$', '')) == volume_db_norm)
      else ('wrong-symlink' if root_db.islnk | default(false)
      else ('real-directory' if root_db.isdir | default(false) else 'file'))) }}
    chia_darwin_local_external_volume_db_kind: >-
      {{ 'absent' if not (volume_db.exists | default(false))
      else ('real-directory'
      if (volume_db.isdir | default(false)) and not (volume_db.islnk | default(false))
      else 'other') }}
  changed_when: false

- name: Refuse an unsafe or unfinished ~/.chia layout
  vars:
    stats: "{{ chia_darwin_local_external_stats }}"
    dot: "{{ chia_darwin_local_external_dot_chia }}"
    migrating: "{{ chia_darwin_local_external_dot_chia_migrating }}"
    legacy: "{{ chia_darwin_local_external_dot_chia_legacy }}"
    volume_chia: "{{ chia_darwin_volume_chia_dir }}"
    staging: "{{ stats.migrating.exists | default(false) }}"
    legacy_exists: "{{ stats.legacy.exists | default(false) }}"
  ansible.builtin.fail:
    msg: "{{ item.msg }}"
  when: item.refuse | bool
  loop:
    - refuse: "{{ chia_darwin_local_external_dot_kind == 'legacy-volume-link' }}"
      msg: >-
        {{ dot }} is a symlink to {{ stats.dot.lnk_target | default('') }}. This
        role does not migrate a legacy volume symlink. Move it aside manually;
        nothing was changed.
    - refuse: "{{ chia_darwin_local_external_dot_kind == 'unexpected-symlink' }}"
      msg: >-
        {{ dot }} is a symlink to {{ stats.dot.lnk_target | default('') }}, not
        {{ volume_chia }}. Move it aside manually; nothing was changed.
    - refuse: "{{ chia_darwin_local_external_dot_kind == 'unexpected' }}"
      msg: >-
        {{ dot }} exists but is neither a directory nor a symlink. Move it aside
        before using local-external. This role does not delete data.
    - refuse: "{{ chia_darwin_local_external_dot_kind == 'absent' and staging }}"
      msg: >-
        {{ dot }} is missing and {{ migrating }} exists. Inspect that staging
        tree manually; this role will not create a new layout beside it or
        delete it. Nothing was changed.
    - refuse: "{{ chia_darwin_local_external_dot_kind == 'absent' and legacy_exists }}"
      msg: >-
        {{ dot }} is missing but {{ legacy }} exists. That link is a finished
        migration's backup; this role will not restore the old volume layout.
        Restore ~/.chia or move the legacy link aside. Nothing was changed.
    - refuse: "{{ chia_darwin_local_external_dot_kind == 'real-directory' and staging }}"
      msg: >-
        {{ dot }} is a valid internal directory but {{ migrating }} still exists.
        Inspect the staging tree manually; this role will not rename or delete
        it. Nothing was changed.
  loop_control:
    label: "{{ item.msg | truncate(40) }}"

- name: Refuse an unsafe local-external database layout
  vars:
    stats: "{{ chia_darwin_local_external_stats }}"
    root: "{{ chia_root }}"
    root_db: "{{ chia_darwin_local_external_root_db }}"
    volume_db: "{{ chia_darwin_volume_db_dir }}"
  ansible.builtin.fail:
    msg: "{{ item.msg }}"
  when: item.refuse | bool
  loop:
    - refuse: "{{ chia_darwin_local_external_chia_root_kind == 'symlink' }}"
      msg: >-
        {{ root }} is a symlink to {{ stats.chia_root.lnk_target | default('') }}.
        A local-external CHIA_ROOT must be a real directory on the internal
        disk. Move the symlink aside manually; nothing was changed.
    - refuse: "{{ chia_darwin_local_external_chia_root_kind == 'unexpected' }}"
      msg: >-
        {{ root }} exists but is neither a directory nor a symlink. Move it
        aside before using local-external. This role does not delete data.
        Nothing was changed.
    - refuse: "{{ chia_darwin_local_external_volume_db_kind == 'other' }}"
      msg: >-
        {{ volume_db }} is not a real directory. This role will not replace the
        on-volume database path with a symlink or a file. Move it aside
        manually; nothing was changed.
    - refuse: "{{ chia_darwin_local_external_root_db_kind == 'real-directory' }}"
      msg: >-
        {{ root_db }} is a real directory. The data may already be local. This
        role will not replace it with a symlink. Move it aside manually if the
        on-volume database should be used.
    - refuse: "{{ chia_darwin_local_external_root_db_kind == 'wrong-symlink' }}"
      msg: >-
        {{ root_db }} is a symlink to {{ stats.root_db.lnk_target | default('') }},
        not {{ volume_db }}. This role will not retarget it.
    - refuse: "{{ chia_darwin_local_external_root_db_kind == 'file' }}"
      msg: >-
        {{ root_db }} is a regular file. This role will not replace it with a
        symlink. Move it aside manually.
  loop_control:
    label: "{{ item.msg | truncate(40) }}"

- name: Ensure the local-external directories exist
  become: "{{ chia_darwin_launchd_become | bool }}"
  become_user: "{{ user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user }}"
    group: "{{ chia_darwin_group }}"
    mode: "0755"
  loop: >-
    {{ ([chia_darwin_local_external_dot_chia]
    if chia_darwin_local_external_dot_kind == 'absent' else []) +
    ([chia_root]
    if chia_darwin_local_external_chia_root_kind == 'absent' else []) +
    ([chia_darwin_volume_db_dir]
    if chia_darwin_local_external_volume_db_kind == 'absent' else []) }}

- name: Link the local-external database path at the on-volume database
  become: "{{ chia_darwin_launchd_become | bool }}"
  become_user: "{{ user }}"
  ansible.builtin.file:
    src: "{{ chia_darwin_volume_db_dir }}"
    dest: "{{ chia_darwin_local_external_root_db }}"
    state: link
    force: false
  when: chia_darwin_local_external_root_db_kind == "absent"
