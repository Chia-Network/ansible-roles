---
# A launchd bootout can return before the job is gone. Replacing the app bundle
# or bootstrapping a new registration while the old supervisor remains loaded
# races with a live process, so wait for the label to disappear.
- name: >-
    Wait for the Timelord.app LaunchDaemon to unload; stop the app before
    replacing the bundle or switching implementations if the label is still
    loaded after the stop timeout in seconds:
    {{ chia_darwin_timelord_app_stop_timeout }}
  become: true
  ansible.builtin.command:
    argv:
      - "{{ chia_darwin_launchctl }}"
      - print
      - "system/{{ chia_darwin_timelord_app_service_label }}"
  register: chia_darwin_timelord_app_unload
  until: chia_darwin_timelord_app_unload.rc != 0
  retries: "{{ (chia_darwin_timelord_app_stop_timeout | int / 2) | round(0, 'ceil') | int }}"
  delay: 2
  changed_when: false
  failed_when: chia_darwin_timelord_app_unload.rc == 0
