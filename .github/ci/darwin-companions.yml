---
# Static checks for the Darwin companion services and watchdog. These do not
# install anything; they keep the role's job list, templates, and pins wired
# together so a future edit cannot silently drop a service.
- name: Check Darwin companion service assumptions
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  vars:
    role_dir: "{{ playbook_dir }}/../../chia-blockchain"
  tasks:
    - name: Read the companion-related role sources
      ansible.builtin.set_fact:
        darwin_text: "{{ lookup('file', role_dir ~ '/tasks/darwin.yml') }}"
        companions_text: "{{ lookup('file', role_dir ~ '/tasks/darwin-companions.yml') }}"
        launchd_text: "{{ lookup('file', role_dir ~ '/tasks/darwin-hw-vdf-launchd.yml') }}"
        launchd_job_text: "{{ lookup('file', role_dir ~ '/tasks/darwin-launchd-job.yml') }}"
        restart_text: "{{ lookup('file', role_dir ~ '/tasks/darwin-restart-ordered.yml') }}"
        restart_job_text: "{{ lookup('file', role_dir ~ '/tasks/darwin-restart-job.yml') }}"
        watchdog_text: "{{ lookup('file', role_dir ~ '/templates/darwin/chia-watchdog.sh.j2') }}"
        watchdog_plist_text: "{{ lookup('file', role_dir ~ '/templates/darwin/chia-watchdog.plist.j2') }}"
        launchd_plist_text: "{{ lookup('file', role_dir ~ '/templates/darwin/launchdaemon.plist.j2') }}"

    - name: Parse the Darwin task files
      ansible.builtin.set_fact:
        darwin_tasks: "{{ darwin_text | from_yaml }}"

    - name: The role defines every companion job and includes the install tasks
      ansible.builtin.assert:
        that:
          - "'Build the Darwin companion LaunchDaemon job list' in (darwin_tasks | map(attribute='name') | list)"
          - "'Install the Darwin companion services and watchdog' in (darwin_tasks | map(attribute='name') | list)"
          - "'chia_darwin_companion_jobs:' in darwin_text"
          - "'chia_darwin_watchdog_job:' in darwin_text"
          - "'release:' in darwin_text"
          - "'wrapper_template:' in darwin_text"
          - "'tag_prefix:' in darwin_text"
          - "'chia_darwin_enable_chia_exporter' in darwin_text"
          - "'chia_darwin_enable_chia_healthcheck' in darwin_text"
          - "'chia_darwin_enable_node_exporter' in darwin_text"
          - "'chia_darwin_enable_watchdog' in darwin_text"
          - "'darwin-companions.yml' in darwin_text"
        fail_msg: >-
          darwin.yml must define the four companion jobs, their release and
          wrapper metadata, select the watchdog job, and include
          darwin-companions.yml before the LaunchDaemons are installed.

    - name: The daemon keeps the daemon restart timeouts
      ansible.builtin.assert:
        that:
          - "'chia_darwin_daemon_throttle_interval' in darwin_text.split('name: daemon')[1].split('name: full-node')[0]"
          - "'chia_darwin_daemon_exit_timeout' in darwin_text.split('name: daemon')[1].split('name: full-node')[0]"
          - "'chia_darwin_companion_throttle_interval' not in darwin_text.split('name: daemon')[1].split('name: full-node')[0]"
          - "'chia_darwin_companion_exit_timeout' not in darwin_text.split('name: daemon')[1].split('name: full-node')[0]"
        fail_msg: >-
          The daemon job must keep chia_darwin_daemon_throttle_interval and
          chia_darwin_daemon_exit_timeout; the companion timeouts are only for
          the companion jobs.

    - name: The LaunchDaemon list includes companions and the restart path covers them
      ansible.builtin.assert:
        that:
          - "'chia_darwin_companion_jobs | default([])' in launchd_text"
          - "'Restart companion jobs' in restart_text"
          - "'chia_darwin_restart_companions' in restart_text"
          - "'chia_darwin_plist_template' not in launchd_job_text"
          - "'chia_job.plist_template | default' in launchd_job_text"
          - "'restart-chia-darwin-companions' in launchd_job_text"
        fail_msg: >-
          Companion plists must join chia_darwin_launchd_jobs, and a
          companion-only change must restart only companion jobs.

    - name: Companion-only restarts do not probe or start ASIC boards
      vars:
        restart_text: "{{ lookup('file', role_dir ~ '/tasks/darwin-restart-ordered.yml') }}"
      ansible.builtin.assert:
        that:
          - "'See which ASIC boards are loaded after the stops' in restart_text"
          - "'Start ASIC boards that are down, in ID order' in restart_text"
          - "'chia_darwin_restart_services | bool' in restart_text"
          - "'chia_darwin_hw_vdf_changed_labels | length > 0' in restart_text"
          - "'chia_darwin_start_down_boards | default(false) | bool' in restart_text"
          - "'Stop the watchdog before a service or board restart' in restart_text"
          - "'Restart the watchdog after the service and board restart' in restart_text"
          - "'chia_darwin_watchdog_quiesced' in restart_text"
        fail_msg: >-
          A companion-only restart must not probe or bootstrap ASIC boards.
          Gate the board-loaded check and the start-down loop on a service
          restart or a changed board label.

    - name: The watchdog restarts even when it was bootstrapped during this apply
      ansible.builtin.assert:
        that:
          - "'chia_darwin_restart_forced' in restart_text"
          - "'chia_darwin_restart_forced' in restart_job_text"
          - "'chia_job.label not in (chia_darwin_fresh_bootstraps | default([])) or' in restart_job_text"
        fail_msg: >-
          Quiescing a freshly bootstrapped watchdog must override the
          fresh-bootstrap skip, or a first apply leaves monitoring down.

    - name: The watchdog parent check does not rewrite an existing /usr/local
      ansible.builtin.assert:
        that:
          - "'Ensure /usr/local exists' not in companions_text"
          - "'Stat /usr/local' in companions_text"
          - "'Create /usr/local when absent' in companions_text"
          - "'chia_darwin_watchdog_parent_local.stat.exists | default(false)' in companions_text"
          - companions_text.index('Stat /usr/local') < companions_text.index('Create /usr/local when absent')
          - "'register: chia_darwin_watchdog_parent_local_after' in companions_text"
          - "'register: chia_darwin_watchdog_parent_libexec_after' in companions_text"
          - "'chia_darwin_watchdog_parent_local_created is changed' in companions_text"
          - "'chia_darwin_watchdog_parent_libexec_created is changed' in companions_text"
          - "'chia_darwin_watchdog_parent_local_after.stat | default(chia_darwin_watchdog_parent_local.stat)' in companions_text"
          - "'chia_darwin_watchdog_parent_libexec_after.stat | default(chia_darwin_watchdog_parent_libexec.stat)' in companions_text"
        fail_msg: >-
          Stat the watchdog parents before creating them and only set owner,
          group, and mode when the directory is absent. Re-stat into a
          separate register: a skipped task still overwrites its register
          with no stat. An existing unsafe /usr/local must fail the
          root-owned check, not be rewritten.

    - name: The sudo probe runs as the service user
      ansible.builtin.assert:
        that:
          - "'Check whether the service user can run sudo' in darwin_text"
          - "'/usr/bin/sudo, -n, true' in darwin_text"
          - "'sudo, -n, -l, -U' not in darwin_text"
          - >-
            'become_user:' in darwin_text.split('Check whether the service user can run sudo')[1].split('Require explicit opt-in')[0]
        fail_msg: >-
          Test whether the service user can actually run sudo by executing
          sudo -n true as that user. Listing privileges as root always
          succeeds, including for users with no sudo rights.

    - name: The base plist supports per-job resource limits and process type
      ansible.builtin.assert:
        that:
          - "'chia_job.run_at_load' not in launchd_plist_text"
          - "'chia_job.nofile' in launchd_plist_text"
          - "'chia_job.process_type | default' in launchd_plist_text"
        fail_msg: >-
          The core LaunchDaemon template must keep the per-job nofile and
          ProcessType defaults without a RunAtLoad special case.

    - name: The watchdog runs as root and restarts every enabled ASIC board
      ansible.builtin.assert:
        that:
          - "'<key>UserName</key>' not in watchdog_plist_text"
          - "'<key>RunAtLoad</key><true/>' in watchdog_plist_text"
          - "'<key>KeepAlive</key><true/>' in watchdog_plist_text"
          - "'HW_JOB_LIST=' in watchdog_text"
          - "'SERVICE_JOB_LIST=' in watchdog_text"
          - "'read -r -a HW_JOBS' in watchdog_text"
          - "'read -r -a SERVICE_JOBS' in watchdog_text"
          - "'PLIST_DIR=' in watchdog_text"
          - "'BOARD_STOP_TIMEOUT=' in watchdog_text"
          - "'stop_board' in watchdog_text"
          - "'start_board' in watchdog_text"
          - "'launchctl bootout' in watchdog_text"
          - "'launchctl bootstrap system' in watchdog_text"
          - "'still loaded after' in watchdog_text"
          - "'bootstrap $1 skipped: still loaded' in watchdog_text"
          - '''stop_board "$j"'' in watchdog_text'
          - '''start_board "$j"'' in watchdog_text'
          - "'EXPECTED_VDFS' in watchdog_text"
          - "'hw_jobs_running' in watchdog_text"
          - "'restart_hwvdf' in watchdog_text"
          - '''for j in "${SERVICE_JOBS[@]}"; do'' in watchdog_text'
          - '''for j in "${HW_JOBS[@]}"; do'' in watchdog_text'
          - '''for j in "${HW_JOBS[@]}"'' in watchdog_text'
          - "'CHECK_HEALTHCHECK' in watchdog_text"
          - "'CHECK_FULL_NODE' in watchdog_text"
          - "'CHECK_EXPORTER' in watchdog_text"
          - "'CHECK_NODE' in watchdog_text"
        fail_msg: >-
          The watchdog must run as root, check every enabled hw-vdf job, and
          restart all exposed boards rather than only hw-vdf.

    - name: The companion binaries and watchdog files are pinned and installed
      ansible.builtin.assert:
        that:
          - chia_darwin_chia_exporter_version | length > 0
          - chia_darwin_chia_healthcheck_version | length > 0
          - chia_darwin_node_exporter_version | length > 0
          - chia_darwin_chia_exporter_sha256 | length == 64
          - chia_darwin_chia_healthcheck_sha256 | length == 64
          - chia_darwin_node_exporter_sha256 | length == 64
          - "'item.release.checksum' in companions_text"
          - "'/usr/bin/tar' in companions_text"
          - "'Unpack the companion archives' in companions_text"
          - "'restart-chia-darwin-companions' in companions_text"
          - "'alert-token' in companions_text"
          - "'webhook-url' in companions_text"
          - "'no_log: true' in companions_text"
        fail_msg: >-
          Companion downloads need pinned versions and checksums. The watchdog
          alert files must stay optional and no_log.

    - name: The expected companion templates exist
      ansible.builtin.stat:
        path: "{{ role_dir }}/templates/darwin/{{ item }}"
      loop:
        - chia-exporter-run.sh.j2
        - chia-healthcheck-run.sh.j2
        - node-exporter-run.sh.j2
        - chia-watchdog.sh.j2
        - chia-watchdog.plist.j2
      register: companion_templates

    - name: Fail when a companion template is missing
      ansible.builtin.assert:
        that:
          - companion_templates.results | rejectattr('stat.exists') | list | length == 0
        fail_msg: >-
          Missing companion template:
          {{ companion_templates.results | rejectattr('stat.exists') | map(attribute='item') | list | join(', ') }}
