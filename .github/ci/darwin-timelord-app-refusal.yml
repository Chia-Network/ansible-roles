---
- name: Refuse {{ refusal_case.name }}
  block:
    - name: Set the invalid {{ refusal_case.name }} inventory
      ansible.builtin.set_fact:
        chia_darwin_topology: "{{ refusal_case.facts.chia_darwin_topology }}"
        chia_darwin_timelord_implementation: "{{ refusal_case.facts.chia_darwin_timelord_implementation }}"
        chia_darwin_timelord_app_bundle_path: "{{ refusal_case.facts.chia_darwin_timelord_app_bundle_path | default('') }}"
        chia_darwin_timelord_app_bundle_src: "{{ refusal_case.facts.chia_darwin_timelord_app_bundle_src | default('') }}"
        chia_darwin_enable_hw_vdf: "{{ refusal_case.facts.chia_darwin_enable_hw_vdf | default(refusal_case.facts.chia_darwin_timelord_implementation == 'chia-blockchain') }}"

    # local-internal and vdf-only fail here, before jobs or implementation
    # validation run.
    - name: Include the early topology check for {{ refusal_case.name }}
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-topology-validate.yml

    # The remaining invalid combinations pass the topology allow-list, so
    # derive the production job facts before the implementation checks.
    - name: Derive the job facts for {{ refusal_case.name }}
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-jobs.yml

    - name: Include the implementation checks for {{ refusal_case.name }}
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-implementation-validate.yml

    - name: Fail when the {{ refusal_case.name }} inventory was accepted
      ansible.builtin.fail:
        msg: "{{ refusal_case.accepted }}"
  rescue:
    - name: The {{ refusal_case.name }} refusal names the expected problem
      ansible.builtin.assert:
        that:
          - refusal_case.expected in ansible_failed_result.msg | default('')
        fail_msg: >-
          {{ refusal_case.name }} must fail with a message containing
          {{ refusal_case.expected }}, got:
          {{ ansible_failed_result.msg | default('') }}
