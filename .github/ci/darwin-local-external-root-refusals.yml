---
# Data-driven refusal and guard cases for
# chia-blockchain/tasks/darwin-local-external-root.yml. Included by
# darwin-local-external-root-tests.yml after the success paths.
- name: Define the local-external refusal cases
  vars:
    default_volume: "{{ chia_darwin_db_volume }}"
  ansible.builtin.set_fact:
    local_external_refusal_cases:
      - name: unexpected ~/.chia symlink target
        home: "{{ test_root }}/unexpected/home"
        volume: "{{ default_volume }}"
        dirs:
          - "{{ test_root }}/not-the-volume"
        links:
          - src: "{{ test_root }}/not-the-volume"
            dest: "{{ test_root }}/unexpected/home/.chia"
        files: []
        expect: Move it aside manually
        expect_path: "{{ test_root }}/unexpected/home/.chia"
        unchanged:
          - path: "{{ test_root }}/unexpected/home/.chia"
            kind: symlink
            target: "{{ test_root }}/not-the-volume"
      - name: unexpected ~/.chia path type
        home: "{{ test_root }}/unexpected-type/home"
        volume: "{{ default_volume }}"
        dirs: []
        links: []
        files:
          - dest: "{{ test_root }}/unexpected-type/home/.chia"
            content: not-a-directory
        expect: neither a directory nor a symlink
        expect_path: "{{ test_root }}/unexpected-type/home/.chia"
        unchanged:
          - path: "{{ test_root }}/unexpected-type/home/.chia"
            kind: file
            content: not-a-directory
      - name: real local database directory
        home: "{{ test_root }}/real-db/home"
        volume: "{{ default_volume }}"
        dirs:
          - "{{ test_root }}/real-db/home/.chia/{{ network }}/db"
        links: []
        files:
          - dest: "{{ test_root }}/real-db/home/.chia/{{ network }}/db/local.sqlite"
            content: keep-me
        expect: real directory
        expect_path: "{{ test_root }}/real-db/home/.chia/{{ network }}/db"
        unchanged:
          - path: "{{ test_root }}/real-db/home/.chia/{{ network }}/db"
            kind: directory
          - path: "{{ test_root }}/real-db/home/.chia/{{ network }}/db/local.sqlite"
            kind: file
            content: keep-me
      - name: wrong database symlink
        home: "{{ test_root }}/wrong-link/home"
        volume: "{{ default_volume }}"
        dirs:
          - "{{ test_root }}/wrong-link/home/.chia/{{ network }}"
          - "{{ test_root }}/wrong-target"
        links:
          - src: "{{ test_root }}/wrong-target"
            dest: "{{ test_root }}/wrong-link/home/.chia/{{ network }}/db"
        files: []
        expect: will not retarget
        expect_path: "{{ test_root }}/wrong-link/home/.chia/{{ network }}/db"
        unchanged:
          - path: "{{ test_root }}/wrong-link/home/.chia/{{ network }}/db"
            kind: symlink
            target: "{{ test_root }}/wrong-target"
      - name: regular file at the database path
        home: "{{ test_root }}/file-db/home"
        volume: "{{ default_volume }}"
        dirs:
          - "{{ test_root }}/file-db/home/.chia/{{ network }}"
        links: []
        files:
          - dest: "{{ test_root }}/file-db/home/.chia/{{ network }}/db"
            content: not-a-database
        expect: regular file
        expect_path: "{{ test_root }}/file-db/home/.chia/{{ network }}/db"
        unchanged:
          - path: "{{ test_root }}/file-db/home/.chia/{{ network }}/db"
            kind: file
            content: not-a-database
      - name: missing ~/.chia next to a finished backup
        home: "{{ test_root }}/finished/home"
        volume: "{{ default_volume }}"
        dirs: []
        links:
          - src: "{{ external_chia }}"
            dest: "{{ test_root }}/finished/home/.chia.legacy-volume-link"
        files: []
        expect: finished migration's backup
        expect_path: "{{ test_root }}/finished/home/.chia"
        unchanged:
          - path: "{{ test_root }}/finished/home/.chia"
            kind: absent
          - path: "{{ test_root }}/finished/home/.chia.legacy-volume-link"
            kind: symlink
            target: "{{ external_chia }}"
      - name: missing ~/.chia next to a live staging tree
        home: "{{ test_root }}/staging-only/home"
        volume: "{{ default_volume }}"
        dirs:
          - "{{ test_root }}/staging-only/home/.chia.migrating/{{ network }}"
        links: []
        files:
          - dest: "{{ test_root }}/staging-only/home/.chia.migrating/{{ network }}/keep.txt"
            content: keep-staging
        expect: Inspect that staging tree
        expect_path: "{{ test_root }}/staging-only/home/.chia.migrating"
        unchanged:
          - path: "{{ test_root }}/staging-only/home/.chia"
            kind: absent
          - path: "{{ test_root }}/staging-only/home/.chia.migrating/{{ network }}/keep.txt"
            kind: file
            content: keep-staging
      - name: live staging tree beside a valid internal ~/.chia
        home: "{{ test_root }}/live-staging/home"
        volume: "{{ default_volume }}"
        dirs:
          - "{{ test_root }}/live-staging/home/.chia"
          - "{{ test_root }}/live-staging/home/.chia.migrating/{{ network }}"
        links: []
        files:
          - dest: "{{ test_root }}/live-staging/home/.chia.migrating/{{ network }}/keep.txt"
            content: keep-staging
        expect: still exists
        expect_path: "{{ test_root }}/live-staging/home/.chia.migrating"
        unchanged:
          - path: "{{ test_root }}/live-staging/home/.chia"
            kind: directory
          - path: "{{ test_root }}/live-staging/home/.chia.migrating/{{ network }}/keep.txt"
            kind: file
            content: keep-staging
      - name: legacy volume symlink with a trailing slash
        home: "{{ test_root }}/legacy-trailing/home"
        volume: "{{ default_volume }}"
        dirs: []
        links:
          - src: "{{ external_chia }}/"
            dest: "{{ test_root }}/legacy-trailing/home/.chia"
        files: []
        expect: does not migrate a legacy volume symlink
        expect_path: "{{ test_root }}/legacy-trailing/home/.chia"
        unchanged:
          - path: "{{ test_root }}/legacy-trailing/home/.chia"
            kind: symlink
            target: "{{ external_chia }}"
      - name: CHIA_ROOT symlink
        home: "{{ test_root }}/root-symlink/home"
        volume: "{{ default_volume }}"
        dirs:
          - "{{ test_root }}/root-symlink/home/.chia"
          - "{{ test_root }}/volume-root"
        links:
          - src: "{{ test_root }}/volume-root"
            dest: "{{ test_root }}/root-symlink/home/.chia/{{ network }}"
        files: []
        expect: A local-external CHIA_ROOT must be a real directory
        expect_path: "{{ test_root }}/root-symlink/home/.chia/{{ network }}"
        unchanged:
          - path: "{{ test_root }}/root-symlink/home/.chia/{{ network }}"
            kind: symlink
            target: "{{ test_root }}/volume-root"
      - name: on-volume database path is a symlink
        home: "{{ test_root }}/volume-db-link/home"
        volume: "{{ test_root }}/Volumes/Bad DB"
        dirs:
          - "{{ test_root }}/volume-db-link/home/.chia/{{ network }}"
          - "{{ test_root }}/Volumes/Bad DB/dot-chia/{{ network }}"
          - "{{ test_root }}/volume-db-target"
        links:
          - src: "{{ test_root }}/volume-db-target"
            dest: "{{ test_root }}/Volumes/Bad DB/dot-chia/{{ network }}/db"
        files: []
        expect: is not a real directory
        expect_path: "{{ test_root }}/Volumes/Bad DB/dot-chia/{{ network }}/db"
        unchanged:
          - path: "{{ test_root }}/Volumes/Bad DB/dot-chia/{{ network }}/db"
            kind: symlink
            target: "{{ test_root }}/volume-db-target"
          - path: "{{ test_root }}/volume-db-link/home/.chia/{{ network }}/db"
            kind: absent
      - name: on-volume database path is a file
        home: "{{ test_root }}/volume-db-file/home"
        volume: "{{ test_root }}/Volumes/File DB"
        dirs:
          - "{{ test_root }}/volume-db-file/home/.chia/{{ network }}"
          - "{{ test_root }}/Volumes/File DB/dot-chia/{{ network }}"
        links: []
        files:
          - dest: "{{ test_root }}/Volumes/File DB/dot-chia/{{ network }}/db"
            content: not-a-database-directory
        expect: is not a real directory
        expect_path: "{{ test_root }}/Volumes/File DB/dot-chia/{{ network }}/db"
        unchanged:
          - path: "{{ test_root }}/Volumes/File DB/dot-chia/{{ network }}/db"
            kind: file
            content: not-a-database-directory
          - path: "{{ test_root }}/volume-db-file/home/.chia/{{ network }}/db"
            kind: absent
  changed_when: false

- name: Create each refusal case home directory
  ansible.builtin.file:
    path: "{{ item.home }}"
    state: directory
    mode: "0755"
  loop: "{{ local_external_refusal_cases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create each refusal case directory
  ansible.builtin.file:
    path: "{{ item.1 }}"
    state: directory
    mode: "0755"
  loop: "{{ local_external_refusal_cases | subelements('dirs') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Create each refusal case symlink
  ansible.builtin.file:
    src: "{{ item.1.src }}"
    dest: "{{ item.1.dest }}"
    state: link
    force: false
  loop: "{{ local_external_refusal_cases | subelements('links') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1.dest }}"

- name: Write each refusal case file
  ansible.builtin.copy:
    content: "{{ item.1.content }}"
    dest: "{{ item.1.dest }}"
    mode: "0644"
  loop: "{{ local_external_refusal_cases | subelements('files') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1.dest }}"

- name: Run each local-external refusal case
  ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-refusal-case.yml"
  vars:
    chia_darwin_home: "{{ case.home }}"
    chia_root: "{{ case.home }}/.chia/{{ network }}"
    chia_darwin_db_volume: "{{ case.volume }}"
  loop: "{{ local_external_refusal_cases }}"
  loop_control:
    loop_var: case
    label: "{{ case.name }}"

- name: Inspect each unchanged refusal path
  ansible.builtin.stat:
    path: "{{ item.1.path }}"
    follow: false
  loop: "{{ local_external_refusal_cases | subelements('unchanged') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1.path }}"
  register: local_external_unchanged_stats

- name: Require each refused path to be unchanged
  vars:
    entry: "{{ item.item[1] }}"
    st: "{{ item.stat }}"
  ansible.builtin.assert:
    that:
      - >-
        (entry.kind != 'symlink') or
        ((st.islnk | default(false)) and
        ((st.lnk_target | default('') | regex_replace('/+$', '')) ==
        (entry.target | regex_replace('/+$', ''))))
      - >-
        (entry.kind != 'directory') or
        ((st.isdir | default(false)) and not (st.islnk | default(false)))
      - >-
        (entry.kind != 'file') or
        ((st.isreg | default(false)) and lookup('file', entry.path) == entry.content)
      - (entry.kind != 'absent') or not (st.exists | default(false))
    fail_msg: >-
      {{ item.item[0].name }}: {{ entry.path }} was changed by the refusal.
  loop: "{{ local_external_unchanged_stats.results }}"
  loop_control:
    label: "{{ item.item[0].name }}: {{ item.item[1].path }}"
