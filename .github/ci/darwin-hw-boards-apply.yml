---
- name: Reset inputs before applying boards
  ansible.builtin.include_tasks: darwin-hw-boards-reset.yml

- name: Clear the launchctl log for this apply
  when: launch_log is defined
  ansible.builtin.copy:
    dest: "{{ launch_log }}"
    mode: "0644"
    content: ""

- name: Set the inventory to apply
  ansible.builtin.set_fact:
    chia_darwin_hw_vdf_expected_serial: "{{ hw_apply_serial }}"
    chia_darwin_hw_vdf_boards: "{{ hw_apply_boards }}"
    chia_darwin_start_now: "{{ hw_apply_start_now | default(true) }}"
    chia_darwin_start_on_boot: "{{ hw_apply_start_on_boot | default(true) }}"
    chia_darwin_hw_vdf_claim_existing: "{{ hw_apply_claim | default(false) }}"
    chia_darwin_service_jobs: "{{ hw_apply_service_jobs | default([]) }}"

- name: Resolve the inventory
  ansible.builtin.include_role:
    name: chia-blockchain-test
    tasks_from: darwin-hw-vdf-boards.yml

- name: Decide which hw-vdf LaunchDaemons this role will change
  ansible.builtin.include_role:
    name: chia-blockchain-test
    tasks_from: darwin-hw-vdf-launchd.yml

- name: Install enabled wrappers
  ansible.builtin.include_role:
    name: chia-blockchain-test
    tasks_from: darwin-hw-vdf-install.yml

- name: Install and apply the LaunchDaemons
  ansible.builtin.include_role:
    name: chia-blockchain-test
    tasks_from: darwin-launchd-apply.yml

- name: Read the launchctl log for this apply
  when: launch_log is defined
  ansible.builtin.slurp:
    src: "{{ launch_log }}"
  register: hw_apply_log
