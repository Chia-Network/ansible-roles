---
- name: Snapshot the old files after the failed takeover
  ansible.builtin.include_tasks: darwin-hw-boards-snapshot.yml
  vars:
    hw_snapshot_var: hw_restore_after
    hw_snapshot_paths: "{{ hw_restore_paths }}"

- name: List loaded jobs after the failed takeover
  ansible.builtin.find:
    paths: "{{ launch_state }}/loaded"
    patterns: "*"
    file_type: file
  register: hw_restore_loaded

- name: Read the failed takeover launchctl log
  ansible.builtin.slurp:
    src: "{{ launch_log }}"
  register: hw_restore_log

- name: The failed takeover restores loaded old jobs and leaves unloaded ones down
  vars:
    names: "{{ hw_restore_loaded.files | map(attribute='path') | map('basename') | sort }}"
    log_text: "{{ hw_restore_log.content | b64decode }}"
  ansible.builtin.assert:
    that:
      - hw_restore_before == hw_restore_after
      - names == hw_restore_names
      - (work ~ '/client-ran') is file
      - log_text is search('(?m)^bootout system/net\\.chia\\.timelord\\.hw-vdf$')
      - log_text is search('(?m)^bootout system/net\\.chia\\.timelord\\.hw-vdf-2$')
      - log_text is search('(?m)^bootout system/net\\.chia\\.timelord\\.hw-vdf-3$')
      - log_text is search('(?m)^bootstrap system .*/net\\.chia\\.timelord\\.hw-vdf\\.plist$')
      - log_text is search('(?m)^bootstrap system .*/net\\.chia\\.timelord\\.hw-vdf-2\\.plist$')
      - not (log_text is search('(?m)^bootstrap system .*/net\\.chia\\.timelord\\.hw-vdf-3\\.plist$'))
