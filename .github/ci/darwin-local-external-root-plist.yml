---
# Write one fake LaunchDaemon plist for the local-external fixture. The caller
# sets local_external_plist to a job dict and chia_darwin_launchd_dir first.
- name: Write the {{ local_external_plist.label }} launchd plist
  ansible.builtin.copy:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      <plist version="1.0">
      <dict>
        <key>Label</key>
        <string>{{ local_external_plist.label }}</string>
      </dict>
      </plist>
    dest: "{{ chia_darwin_launchd_dir }}/{{ local_external_plist.label }}.plist"
    mode: "0644"
