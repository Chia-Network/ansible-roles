---
# The ordered restart must fail closed. A board that stays loaded is not
# followed by a service bootstrap.
- name: Ordered restart fails closed while a board stays loaded
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    work: "{{ lookup('env', 'RUNNER_TEMP') | default('/tmp', true) }}/chia-darwin-hw-restart"
    launch_log: "{{ work }}/launchctl.log"
    launch_state: "{{ work }}/state"
  tasks:
    - name: Create the shared restart tree
      vars:
        hw_tree_dirs:
          - "{{ launch_state }}/hold"
      ansible.builtin.include_tasks: darwin-hw-boards-tree.yml
    - name: Point restart state at this play
      ansible.builtin.set_fact:
        chia_darwin_launchd_become: false
        chia_darwin_start_now: true
        chia_darwin_start_on_boot: true
        chia_darwin_restart_services: true
        chia_darwin_restart_unload_margin: 1
        chia_darwin_fresh_bootstraps: []
        chia_darwin_hw_vdf_changed_labels: []
        chia_darwin_hw_vdf_jobs:
          - name: hw-vdf
            label: net.chia.timelord.hw-vdf
            wrapper: "{{ work }}/chia-hw-vdf-run.sh"
            throttle: 15
            exit_timeout: 0
            enabled: true
            board: "{{ dict() }}"
        chia_darwin_service_jobs:
          - name: daemon
            label: net.chia.timelord.daemon
            wrapper: "{{ work }}/chia-daemon-run.sh"
            throttle: 15
            exit_timeout: 0
            enabled: true
    - name: Plant the board plist and a loaded daemon
      ansible.builtin.copy:
        dest: "{{ item }}"
        mode: "0644"
        content: "plist\n"
      loop:
        - "{{ chia_darwin_launchd_dir }}/net.chia.timelord.hw-vdf.plist"
        - "{{ chia_darwin_launchd_dir }}/net.chia.timelord.daemon.plist"
    - name: Mark the daemon and an unrelated job loaded
      ansible.builtin.file:
        path: "{{ launch_state }}/loaded/{{ item }}"
        state: touch
        mode: "0644"
      loop:
        - net.chia.timelord.daemon
        - com.example.keep
    - name: Hold hw-vdf so print keeps reporting it
      ansible.builtin.copy:
        dest: "{{ launch_state }}/hold/net.chia.timelord.hw-vdf"
        mode: "0644"
        content: "9\n"
    - name: Mark hw-vdf loaded
      ansible.builtin.file:
        path: "{{ launch_state }}/loaded/net.chia.timelord.hw-vdf"
        state: touch
        mode: "0644"
    - name: Prepare an empty launchctl log
      ansible.builtin.copy:
        dest: "{{ launch_log }}"
        mode: "0644"
        content: ""
    - name: A stuck board stops the restart before the daemon
      block:
        - name: Run the ordered restart
          ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-restart-ordered.yml
        - name: The stuck board was restarted anyway
          ansible.builtin.fail:
            msg: a still-loaded job was bootstrapped
      rescue:
        - name: The failure says bootstrap was not attempted
          ansible.builtin.assert:
            that:
              - (ansible_failed_result | to_json) is search('still loaded')
              - (ansible_failed_result | to_json) is search('Bootstrap was not attempted')
              - "'was bootstrapped' not in (ansible_failed_result.msg | default('') | string)"
    - name: Read the stuck restart log
      ansible.builtin.slurp:
        src: "{{ launch_log }}"
      register: stuck_log
    - name: The daemon was not bootstrapped and the unrelated job remains
      vars:
        log_text: "{{ stuck_log.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'bootstrap system' not in log_text"
          - "'daemon.plist' not in log_text"
          - (launch_state ~ '/loaded/com.example.keep') is file
          - (launch_state ~ '/loaded/net.chia.timelord.daemon') is file

- name: Stop helper accepts a failed bootout after the job is gone
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    work: "{{ lookup('env', 'RUNNER_TEMP') | default('/tmp', true) }}/chia-darwin-hw-stop-gone"
    launch_log: "{{ work }}/launchctl.log"
    launch_state: "{{ work }}/state"
  tasks:
    - name: Create the shared failed-bootout tree
      vars:
        hw_tree_dirs:
          - "{{ launch_state }}/fail"
      ansible.builtin.include_tasks: darwin-hw-boards-tree.yml
    - name: Set short unload wait for the failed-bootout case
      ansible.builtin.set_fact:
        chia_darwin_launchd_become: false
        chia_darwin_restart_unload_margin: 1
    - name: Make bootout fail for an unloaded job
      ansible.builtin.copy:
        dest: "{{ launch_state }}/fail/net.chia.timelord.hw-vdf"
        mode: "0644"
        content: "failure\n"
    - name: Prepare an empty failed-bootout log
      ansible.builtin.copy:
        dest: "{{ launch_log }}"
        mode: "0644"
        content: ""
    - name: Stop a job whose bootout fails but which is already gone
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-stop-job.yml
      vars:
        chia_job:
          label: net.chia.timelord.hw-vdf
          exit_timeout: 0
    - name: Read the failed-bootout stop log
      ansible.builtin.slurp:
        src: "{{ launch_log }}"
      register: gone_log
    - name: A failed bootout of a gone job is accepted without bootstrap
      vars:
        log_text: "{{ gone_log.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - log_text is search('(?m)^bootout system/net\\.chia\\.timelord\\.hw-vdf$')
          - log_text is search('(?m)^print system/net\\.chia\\.timelord\\.hw-vdf$')
          - "'bootstrap system' not in log_text"
