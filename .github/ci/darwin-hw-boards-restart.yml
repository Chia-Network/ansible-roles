---
- name: Restart handler waits out a loaded job and skips fresh or idle jobs
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - darwin-hw-boards-fixture.yml
  vars:
    work: /tmp/chia-darwin-hw-restart
    launch_log: "{{ work }}/launchctl.log"
    launch_state: "{{ work }}/state"
    restart_job:
      name: hw-vdf
      label: net.chia.timelord.hw-vdf
      wrapper: "{{ work }}/chia-hw-vdf-run.sh"
      throttle: 15
      exit_timeout: 0
      enabled: true
      board: {}
  tasks:
    - name: Start from an empty restart tree
      ansible.builtin.file:
        path: "{{ work }}"
        state: absent
    - name: Keep restart paths on this play's directory
      ansible.builtin.set_fact:
        chia_darwin_launchctl: "{{ work }}/launchctl"
        chia_darwin_launchd_dir: "{{ work }}/LaunchDaemons"
        chia_darwin_start_now: true
        chia_darwin_start_on_boot: true
    - name: Create the restart tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ chia_darwin_launchd_dir }}"
        - "{{ launch_state }}/loaded"
        - "{{ launch_state }}/hold"
    - name: Install the fake launchctl
      ansible.builtin.include_tasks: darwin-hw-boards-launchctl.yml
    - name: Plant a plist and an unrelated loaded job
      ansible.builtin.copy:
        dest: "{{ chia_darwin_launchd_dir }}/net.chia.timelord.hw-vdf.plist"
        mode: "0644"
        content: "plist\n"
    - name: Touch the unrelated loaded marker
      ansible.builtin.file:
        path: "{{ launch_state }}/loaded/com.example.keep"
        state: touch
        mode: "0644"
    - name: Prepare an empty launchctl log
      ansible.builtin.copy:
        dest: "{{ launch_log }}"
        mode: "0644"
        content: ""
    - name: Mark hw-vdf loaded and hold it there
      ansible.builtin.file:
        path: "{{ launch_state }}/loaded/net.chia.timelord.hw-vdf"
        state: touch
        mode: "0644"
    - name: Hold the job so print keeps reporting it
      ansible.builtin.copy:
        dest: "{{ launch_state }}/hold/net.chia.timelord.hw-vdf"
        mode: "0644"
        content: "9\n"
    - name: Use a one-try unload budget
      ansible.builtin.set_fact:
        chia_darwin_restart_unload_margin: 1
        chia_darwin_fresh_bootstraps: []
        chia_job: "{{ restart_job }}"
    - name: The restart task must refuse to bootstrap a job that is still loaded
      block:
        - name: Restart the stuck job
          ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-restart-job.yml
        - name: A still-loaded job was bootstrapped
          ansible.builtin.fail:
            msg: a still-loaded job was bootstrapped
      rescue:
        - name: The failure says bootstrap was not attempted
          ansible.builtin.assert:
            that:
              - (ansible_failed_result | to_json) is search('still loaded')
              - (ansible_failed_result | to_json) is search('Bootstrap was not attempted')
              - "'was bootstrapped' not in (ansible_failed_result.msg | default('') | string)"
    - name: Read the stuck-job log
      ansible.builtin.slurp:
        src: "{{ launch_log }}"
      register: stuck_log
    - name: Bootstrap was not called and the unrelated job remains
      ansible.builtin.assert:
        that:
          - "'bootstrap system' not in (stuck_log.content | b64decode)"
          - (launch_state ~ '/loaded/com.example.keep') is file

    - name: Mark hw-vdf loaded again
      ansible.builtin.file:
        path: "{{ launch_state }}/loaded/net.chia.timelord.hw-vdf"
        state: touch
        mode: "0644"
    - name: Let the second print report the job gone
      ansible.builtin.copy:
        dest: "{{ launch_state }}/hold/net.chia.timelord.hw-vdf"
        mode: "0644"
        content: "1\n"
    - name: Clear the launchctl log before the successful restart
      ansible.builtin.copy:
        dest: "{{ launch_log }}"
        mode: "0644"
        content: ""
    - name: Allow two unload tries
      ansible.builtin.set_fact:
        chia_darwin_restart_unload_margin: 2
        chia_darwin_fresh_bootstraps: []
        chia_job: "{{ restart_job }}"
    - name: Restart after the job unloads
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-restart-job.yml
    - name: Read the successful restart log
      ansible.builtin.slurp:
        src: "{{ launch_log }}"
      register: restarted_log
    - name: Bootstrap runs once the unload wait sees the job leave
      ansible.builtin.assert:
        that:
          - "'bootstrap system' in (restarted_log.content | b64decode)"
          - (launch_state ~ '/loaded/net.chia.timelord.hw-vdf') is file
          - (launch_state ~ '/loaded/com.example.keep') is file

    - name: Clear the launchctl log before the fresh-bootstrap skip
      ansible.builtin.copy:
        dest: "{{ launch_log }}"
        mode: "0644"
        content: ""
    - name: Remember that this run already bootstrapped hw-vdf
      ansible.builtin.set_fact:
        chia_darwin_fresh_bootstraps:
          - net.chia.timelord.hw-vdf
        chia_job: "{{ restart_job }}"
    - name: Skip a job bootstrapped earlier in this run
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-restart-job.yml
    - name: Read the fresh-bootstrap log
      ansible.builtin.slurp:
        src: "{{ launch_log }}"
      register: fresh_log
    - name: A fresh bootstrap is not restarted
      ansible.builtin.assert:
        that:
          - (fresh_log.content | b64decode) | trim | length == 0

    - name: Turn start_now off
      ansible.builtin.set_fact:
        chia_darwin_start_now: false
        chia_darwin_fresh_bootstraps: []
        chia_job: "{{ restart_job }}"
    - name: Do not restart when start_now is false
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-restart-job.yml
    - name: Read the idle restart log
      ansible.builtin.slurp:
        src: "{{ launch_log }}"
      register: idle_log
    - name: start_now false leaves the job and the unrelated label alone
      ansible.builtin.assert:
        that:
          - (idle_log.content | b64decode) | trim | length == 0
          - (launch_state ~ '/loaded/com.example.keep') is file
