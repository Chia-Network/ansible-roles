---
# Run twice with the same test_root. The first run creates a fresh layout and
# leaves a converged, migrated-looking layout unchanged. The second must report
# changed=0 because both layouts are already in place.
- name: Prove a second local-external root run is idempotent
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  vars:
    test_root: "{{ lookup('env', 'DARWIN_LOCAL_EXTERNAL_ROOT_TEST_ROOT') | default('/tmp/darwin-local-external-root-idempotence', true) }}"
  tasks:
    - name: Create the shared fixtures and fake tools
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-setup.yml"

    - name: Record the idempotence paths
      ansible.builtin.set_fact:
        fresh_home: "{{ test_root }}/fresh/home"
        converged_home: "{{ test_root }}/converged/home"
        external_chia: "{{ chia_darwin_volume_chia_dir }}"
        external_db: "{{ chia_darwin_volume_db_dir }}"
        converged_leftover: "{{ test_root }}/converged/home/.chia.migrating.leftover-20000101T000000Z"
      changed_when: false

    - name: Prepare the on-volume database and the converged home
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ external_db }}"
        - "{{ converged_home }}/.chia"
        - "{{ converged_home }}/.chia/{{ network }}"
        - "{{ converged_leftover }}"

    - name: Write the on-volume database fixture
      ansible.builtin.copy:
        content: converged database
        dest: "{{ external_db }}/blockchain_v2_{{ network }}.sqlite"
        mode: "0644"

    - name: Link the converged database at the volume
      ansible.builtin.file:
        src: "{{ external_db }}/"
        dest: "{{ converged_home }}/.chia/{{ network }}/db"
        state: link
        force: false

    - name: Create the converged legacy backup link
      ansible.builtin.file:
        src: "{{ external_chia }}/"
        dest: "{{ converged_home }}/.chia.legacy-volume-link"
        state: link
        force: false

    - name: Write a marker in the converged leftover tree
      ansible.builtin.copy:
        content: keep-leftover
        dest: "{{ converged_leftover }}/keep.txt"
        mode: "0644"

    - name: Run the local-external include on a fresh layout
      vars:
        chia_darwin_home: "{{ fresh_home }}"
        chia_root: "{{ fresh_home }}/.chia/{{ network }}"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-local-external-root.yml"

    - name: Run the local-external include on a converged layout
      vars:
        chia_darwin_home: "{{ converged_home }}"
        chia_root: "{{ converged_home }}/.chia/{{ network }}"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-local-external-root.yml"

    - name: Inspect both idempotent local-external layouts
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ fresh_home }}/.chia"
        - "{{ fresh_home }}/.chia/{{ network }}/db"
        - "{{ converged_home }}/.chia"
        - "{{ converged_home }}/.chia/{{ network }}/db"
        - "{{ converged_home }}/.chia.legacy-volume-link"
        - "{{ converged_leftover }}"
      register: idempotent_stats

    - name: Require both idempotent local-external layouts
      ansible.builtin.assert:
        that:
          - idempotent_stats.results[0].stat.isdir | default(false)
          - not (idempotent_stats.results[0].stat.islnk | default(false))
          - idempotent_stats.results[1].stat.islnk | default(false)
          - idempotent_stats.results[2].stat.isdir | default(false)
          - not (idempotent_stats.results[2].stat.islnk | default(false))
          - idempotent_stats.results[3].stat.islnk | default(false)
          - >-
            (idempotent_stats.results[3].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_db | regex_replace('/+$', ''))
          - idempotent_stats.results[4].stat.islnk | default(false)
          - >-
            (idempotent_stats.results[4].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_chia | regex_replace('/+$', ''))
          - idempotent_stats.results[5].stat.isdir | default(false)
          - lookup('file', converged_leftover ~ '/keep.txt') == 'keep-leftover'
        fail_msg: >-
          Fresh and converged layouts must both stay internal with only
          <chia_root>/db linked at the on-volume database, and the backup link
          and leftover tree beside the converged root must stay in place.

    - name: Report the idempotent local-external root layout
      ansible.builtin.debug:
        msg: "Darwin local-external root idempotence passed under {{ test_root }}"
