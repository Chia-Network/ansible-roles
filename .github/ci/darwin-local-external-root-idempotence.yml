---
# Run twice with the same test_root. The first run creates the fresh layout.
# The second must report changed=0 because the layout is already migrated.
- name: Prove a second local-external root run is idempotent
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  vars:
    test_root: "{{ lookup('env', 'DARWIN_LOCAL_EXTERNAL_ROOT_TEST_ROOT') | default('/tmp/darwin-local-external-root-idempotence', true) }}"
  tasks:
    - name: Create the shared fixtures and fake tools
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-setup.yml"

    - name: Pin the local-external CHIA_ROOT test path
      ansible.builtin.set_fact:
        chia_root: "{{ chia_darwin_home }}/.chia/{{ network }}"
      changed_when: false

    - name: Run the local-external root include
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-local-external-root.yml"

    - name: Inspect the idempotent local-external layout
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_home }}/.chia"
        - "{{ chia_root }}/db"
        - "{{ chia_darwin_volume_db_dir }}"
      register: idempotent_stats

    - name: Require the idempotent local-external layout
      ansible.builtin.assert:
        that:
          - idempotent_stats.results[0].stat.isdir | default(false)
          - not (idempotent_stats.results[0].stat.islnk | default(false))
          - idempotent_stats.results[1].stat.islnk | default(false)
          - >-
            (idempotent_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (chia_darwin_volume_db_dir | regex_replace('/+$', ''))
          - idempotent_stats.results[2].stat.isdir | default(false)
        fail_msg: >-
          The local-external layout must stay internal with only <chia_root>/db
          linked at the on-volume database.
