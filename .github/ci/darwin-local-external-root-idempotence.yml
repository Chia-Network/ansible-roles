---
# Run twice with the same test_root. The first run creates a fresh layout and
# migrates a legacy layout. The second must report changed=0 because both
# layouts are already in place.
- name: Prove a second local-external root run is idempotent
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  vars:
    test_root: "{{ lookup('env', 'DARWIN_LOCAL_EXTERNAL_ROOT_TEST_ROOT') | default('/tmp/darwin-local-external-root-idempotence', true) }}"
  tasks:
    - name: Create the shared fixtures and fake tools
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-setup.yml"

    - name: Record the idempotence paths
      ansible.builtin.set_fact:
        fresh_home: "{{ test_root }}/fresh/home"
        legacy_home: "{{ test_root }}/legacy/home"
        legacy_volume: "{{ test_root }}/legacy/volume/dot-chia"
      changed_when: false

    - name: Prepare the legacy on-volume data for the idempotence migration
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ legacy_volume }}/{{ network }}/db"
        - "{{ legacy_volume }}/{{ network }}/config"
        - "{{ legacy_home }}"

    - name: Write the legacy on-volume database fixture
      ansible.builtin.copy:
        content: legacy database
        dest: "{{ legacy_volume }}/{{ network }}/db/blockchain_v2_{{ network }}.sqlite"
        mode: "0644"

    - name: Stat the legacy ~/.chia link before the idempotence run
      ansible.builtin.stat:
        path: "{{ legacy_home }}/.chia"
        follow: false
      register: idempotent_legacy_link

    - name: Create the legacy ~/.chia volume link once
      ansible.builtin.file:
        src: "{{ legacy_volume }}"
        dest: "{{ legacy_home }}/.chia"
        state: link
        force: false
      when: not (idempotent_legacy_link.stat.exists | default(false))

    - name: Run the local-external include on a fresh layout
      vars:
        chia_darwin_home: "{{ fresh_home }}"
        chia_root: "{{ fresh_home }}/.chia/{{ network }}"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-local-external-root.yml"

    - name: Run the local-external include on a legacy layout
      vars:
        chia_darwin_home: "{{ legacy_home }}"
        chia_root: "{{ legacy_home }}/.chia/{{ network }}"
        chia_darwin_volume_chia_dir: "{{ legacy_volume }}"
        chia_darwin_volume_db_dir: "{{ legacy_volume }}/{{ network }}/db"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-local-external-root.yml"

    - name: Inspect both idempotent local-external layouts
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ fresh_home }}/.chia"
        - "{{ fresh_home }}/.chia/{{ network }}/db"
        - "{{ legacy_home }}/.chia"
        - "{{ legacy_home }}/.chia/{{ network }}/db"
        - "{{ legacy_home }}/.chia.legacy-volume-link"
      register: idempotent_stats

    - name: Require both idempotent local-external layouts
      ansible.builtin.assert:
        that:
          - idempotent_stats.results[0].stat.isdir | default(false)
          - not (idempotent_stats.results[0].stat.islnk | default(false))
          - idempotent_stats.results[1].stat.islnk | default(false)
          - idempotent_stats.results[2].stat.isdir | default(false)
          - not (idempotent_stats.results[2].stat.islnk | default(false))
          - idempotent_stats.results[3].stat.islnk | default(false)
          - >-
            (idempotent_stats.results[3].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            ((legacy_volume ~ '/' ~ network ~ '/db') | regex_replace('/+$', ''))
          - idempotent_stats.results[4].stat.islnk | default(false)
          - >-
            (idempotent_stats.results[4].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (legacy_volume | regex_replace('/+$', ''))
        fail_msg: >-
          Fresh and migrated layouts must both stay internal with only
          <chia_root>/db linked at the on-volume database.

    - name: Report the idempotent local-external root layout
      ansible.builtin.debug:
        msg: "Darwin local-external root idempotence passed under {{ test_root }}"
