---
# Local tests for chia-blockchain/tasks/darwin-db-seed.yml. They use a fake aws
# executable and local fixtures. No S3 bucket, Mac, launchd job, or external
# volume is touched.
- name: Test the Darwin database seed without S3 or a Mac
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  tasks:
    - name: Create a temporary test root
      ansible.builtin.tempfile:
        state: directory
        suffix: " darwin db seed"
      register: darwin_db_seed_temp

    - name: Record the test root
      ansible.builtin.set_fact:
        test_root: "{{ darwin_db_seed_temp.path }}"
        mainnet_root: "{{ darwin_db_seed_temp.path }}/internal/mainnet"
        remote_root: "{{ darwin_db_seed_temp.path }}/remote/mainnet"
        disabled_root: "{{ darwin_db_seed_temp.path }}/disabled/mainnet"
        empty_bucket_root: "{{ darwin_db_seed_temp.path }}/empty-bucket/mainnet"
        existing_root: "{{ darwin_db_seed_temp.path }}/existing/mainnet"
        directory_root: "{{ darwin_db_seed_temp.path }}/directory/mainnet"
        symlink_root: "{{ darwin_db_seed_temp.path }}/symlink/mainnet"
        boundary_root: "{{ darwin_db_seed_temp.path }}/boundary/mainnet"
        stub_root: "{{ darwin_db_seed_temp.path }}/stub/mainnet"
        wal_root: "{{ darwin_db_seed_temp.path }}/stale-wal/mainnet"
        large_loaded_root: "{{ darwin_db_seed_temp.path }}/large-loaded/mainnet"
        running_root: "{{ darwin_db_seed_temp.path }}/running/mainnet"
        publish_root: "{{ darwin_db_seed_temp.path }}/publish-failure/mainnet"
        cache_publish_root: "{{ darwin_db_seed_temp.path }}/cache-publish-failure/mainnet"
        publish_files:
          - height-to-hash
          - sub-epoch-summaries
          - blockchain_v2_mainnet.sqlite

    - name: Set the shared test identity, fixtures, and tool paths
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-test-identity.yml"

    - name: Create the shared fake tools and fixtures
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-setup.yml"

    - name: Reset the fake tool state
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/{{ item }}"
        mode: "0644"
      loop:
        - aws.log
        - fail-file
        - fail-publish
        - launchctl.log

    - name: Check the publish include applies the service-user directives
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/check_darwin_db_seed_publish_become.py"
          - --tasks
          - "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-db-seed.yml"
          - --defaults
          - "{{ playbook_dir }}/../../chia-blockchain/defaults/main.yml"
          - --service-user
          - "{{ test_user }}-publish-service"
          - --remote-user
          - "{{ test_user }}"
      changed_when: false

    - name: Prepare the scenario directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ existing_root }}/db"
        - "{{ directory_root }}/db"
        - "{{ symlink_root }}/db"
        - "{{ boundary_root }}/db"
        - "{{ stub_root }}/db"
        - "{{ wal_root }}/db"
        - "{{ large_loaded_root }}/db"
        - "{{ running_root }}/db"
        - "{{ publish_root }}/db"
        - "{{ cache_publish_root }}/db"

    - name: Seed an absent local-internal database
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: absent local-internal
          root: "{{ mainnet_root }}"

    - name: Assert the local-internal database was seeded
      ansible.builtin.assert:
        that:
          - lookup('file', mainnet_root ~ '/db/blockchain_v2_mainnet.sqlite') == fixture_main
          - lookup('file', mainnet_root ~ '/db/height-to-hash') == fixture_h2h
          - lookup('file', mainnet_root ~ '/db/sub-epoch-summaries') == fixture_ses
          - "'s3://test-bucket/mainnet/blockchain_v2_mainnet.sqlite' in lookup('file', test_root ~ '/aws.log')"
          - "'s3://test-bucket/mainnet/height-to-hash' in lookup('file', test_root ~ '/aws.log')"
          - "'s3://test-bucket/mainnet/sub-epoch-summaries' in lookup('file', test_root ~ '/aws.log')"

    - name: Inspect the seeded local-internal database
      ansible.builtin.stat:
        path: "{{ mainnet_root }}/db/blockchain_v2_mainnet.sqlite"
      register: darwin_db_seed_internal_main

    - name: Inspect the local-internal staging directory
      ansible.builtin.stat:
        path: "{{ mainnet_root }}/db/.chia-s3-seed-mainnet"
      register: darwin_db_seed_internal_staging

    - name: Assert ownership, permissions, and staging cleanup
      ansible.builtin.assert:
        that:
          - darwin_db_seed_internal_main.stat.pw_name == test_user
          - darwin_db_seed_internal_main.stat.gr_name == test_group
          - darwin_db_seed_internal_main.stat.mode == "0644"
          - not (darwin_db_seed_internal_staging.stat.exists | default(false))

    - name: Record the first-run database and download state
      ansible.builtin.set_fact:
        first_run_log_size: "{{ lookup('file', test_root ~ '/aws.log') | length }}"
        first_run_inode: "{{ darwin_db_seed_internal_main.stat.inode }}"
        first_run_size: "{{ darwin_db_seed_internal_main.stat.size }}"
        first_run_mtime: "{{ darwin_db_seed_internal_main.stat.mtime }}"

    - name: Run the local-internal seed a second time
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: second local-internal run
          root: "{{ mainnet_root }}"

    - name: Inspect the database after the second run
      ansible.builtin.stat:
        path: "{{ mainnet_root }}/db/blockchain_v2_mainnet.sqlite"
      register: darwin_db_seed_internal_second

    - name: A second successful run does not redownload or change the database
      ansible.builtin.assert:
        that:
          - (lookup('file', test_root ~ '/aws.log') | length) == (first_run_log_size | int)
          - darwin_db_seed_internal_second.stat.inode == (first_run_inode | int)
          - darwin_db_seed_internal_second.stat.size == (first_run_size | int)
          - darwin_db_seed_internal_second.stat.mtime == (first_run_mtime | float)

    - name: Seed an absent local-external testnet11 database through the symlink
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: absent local-external testnet11
          root: "{{ test_root }}/home ext/.chia/testnet11"
          topology: local-external
          network: testnet11

    - name: Assert the external testnet11 database was seeded
      ansible.builtin.assert:
        that:
          - lookup('file', external_root ~ '/testnet11/db/blockchain_v2_testnet11.sqlite') == fixture_main
          - lookup('file', external_root ~ '/testnet11/db/height-to-hash') == fixture_h2h
          - lookup('file', external_root ~ '/testnet11/db/sub-epoch-summaries') == fixture_ses
          - "'s3://test-bucket/testnet11/blockchain_v2_testnet11.sqlite' in lookup('file', test_root ~ '/aws.log')"
          - "'s3://test-bucket/testnet11/height-to-hash' in lookup('file', test_root ~ '/aws.log')"
          - "'s3://test-bucket/testnet11/sub-epoch-summaries' in lookup('file', test_root ~ '/aws.log')"

    - name: Reset the fake tool state before the skip cases
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/{{ item }}"
        mode: "0644"
      loop:
        - aws.log
        - fail-file
        - fail-publish
        - launchctl.log

    - name: Skip the seed for disabled local topologies
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      loop:
        - name: remote-node
          root: "{{ remote_root }}"
          topology: remote-node
        - name: download disabled
          root: "{{ disabled_root }}"
          download: false
        - name: empty bucket
          root: "{{ empty_bucket_root }}"
          bucket: ""
      loop_control:
        loop_var: case
        label: "{{ case.name }}"

    - name: Inspect the skip-case database paths
      ansible.builtin.stat:
        path: "{{ item }}/db/blockchain_v2_mainnet.sqlite"
      loop:
        - "{{ remote_root }}"
        - "{{ disabled_root }}"
        - "{{ empty_bucket_root }}"
      register: darwin_db_seed_skips

    - name: Assert the skip cases took no action
      ansible.builtin.assert:
        that:
          - darwin_db_seed_skips.results | rejectattr('stat.exists') | list | length == 3
          - (lookup('file', test_root ~ '/aws.log') | length) == 0
          - (lookup('file', test_root ~ '/launchctl.log') | length) == 0

    - name: Write the existing large database and sidecars
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ existing_root }}/db/{{ item.name }}"
        mode: "0644"
      loop:
        - name: blockchain_v2_mainnet.sqlite
          content: "{{ 'K' * 11000 }}"
        - name: height-to-hash
          content: old-height-to-hash
        - name: sub-epoch-summaries
          content: old-sub-epoch-summaries
        - name: blockchain_v2_mainnet.sqlite-wal
          content: old-wal
        - name: blockchain_v2_mainnet.sqlite-shm
          content: old-shm
        - name: blockchain_v2_mainnet.sqlite-journal
          content: old-journal

    - name: Preserve an existing non-stub database and its sidecars
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: existing large database
          root: "{{ existing_root }}"

    - name: Assert the existing database, caches, and sidecars were not touched
      ansible.builtin.assert:
        that:
          - lookup('file', existing_root ~ '/db/blockchain_v2_mainnet.sqlite') == ('K' * 11000)
          - lookup('file', existing_root ~ '/db/height-to-hash') == 'old-height-to-hash'
          - lookup('file', existing_root ~ '/db/sub-epoch-summaries') == 'old-sub-epoch-summaries'
          - lookup('file', existing_root ~ '/db/blockchain_v2_mainnet.sqlite-wal') == 'old-wal'
          - lookup('file', existing_root ~ '/db/blockchain_v2_mainnet.sqlite-shm') == 'old-shm'
          - lookup('file', existing_root ~ '/db/blockchain_v2_mainnet.sqlite-journal') == 'old-journal'
          - (lookup('file', test_root ~ '/aws.log') | length) == 0

    - name: Prepare a directory at the main database path
      ansible.builtin.file:
        path: "{{ directory_root }}/db/blockchain_v2_mainnet.sqlite"
        state: directory
        mode: "0755"

    - name: Preserve a directory at the main database path
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: directory at main path
          root: "{{ directory_root }}"

    - name: Inspect the directory at the main database path
      ansible.builtin.stat:
        path: "{{ directory_root }}/db/blockchain_v2_mainnet.sqlite"
      register: darwin_db_seed_directory

    - name: Assert the directory was not removed or replaced
      ansible.builtin.assert:
        that:
          - darwin_db_seed_directory.stat.isdir | default(false)
          - (lookup('file', test_root ~ '/aws.log') | length) == 0

    - name: Prepare a symlink at the main database path
      ansible.builtin.copy:
        content: "{{ 'L' * 12000 }}"
        dest: "{{ symlink_root }}/linked-database.sqlite"
        mode: "0644"

    - name: Create the main database symlink
      ansible.builtin.file:
        src: "{{ symlink_root }}/linked-database.sqlite"
        dest: "{{ symlink_root }}/db/blockchain_v2_mainnet.sqlite"
        state: link
        force: true

    - name: Preserve a symlink at the main database path
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: symlink at main path
          root: "{{ symlink_root }}"

    - name: Inspect the symlink at the main database path
      ansible.builtin.stat:
        path: "{{ symlink_root }}/db/blockchain_v2_mainnet.sqlite"
        follow: false
      register: darwin_db_seed_symlink

    - name: Assert the symlink and its target were not replaced
      ansible.builtin.assert:
        that:
          - darwin_db_seed_symlink.stat.islnk | default(false)
          - lookup('file', symlink_root ~ '/linked-database.sqlite') == ('L' * 12000)
          - (lookup('file', test_root ~ '/aws.log') | length) == 0

    - name: Prepare a database one byte above the stub limit
      ansible.builtin.copy:
        content: "{{ 'B' * 10241 }}"
        dest: "{{ boundary_root }}/db/blockchain_v2_mainnet.sqlite"
        mode: "0644"

    - name: Preserve a database one byte above the stub limit
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: boundary database
          root: "{{ boundary_root }}"

    - name: Assert the 10241-byte database was preserved
      ansible.builtin.assert:
        that:
          - lookup('file', boundary_root ~ '/db/blockchain_v2_mainnet.sqlite') == ('B' * 10241)
          - (lookup('file', test_root ~ '/aws.log') | length) == 0

    - name: Prepare a database exactly at the stub limit
      ansible.builtin.copy:
        content: "{{ 'S' * 10240 }}"
        dest: "{{ stub_root }}/db/blockchain_v2_mainnet.sqlite"
        mode: "0644"

    - name: Replace a database exactly at the documented stub limit
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: stub database
          root: "{{ stub_root }}"

    - name: Assert the stub was replaced with the snapshot
      ansible.builtin.assert:
        that:
          - lookup('file', stub_root ~ '/db/blockchain_v2_mainnet.sqlite') == fixture_main
          - lookup('file', stub_root ~ '/db/height-to-hash') == fixture_h2h
          - lookup('file', stub_root ~ '/db/sub-epoch-summaries') == fixture_ses
          - (lookup('file', test_root ~ '/aws.log') | split('\n') | reject('eq', '') | list | length) == 3

    - name: Reset the fake tool state before the stale-sidecar case
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/{{ item }}"
        mode: "0644"
      loop:
        - aws.log
        - fail-file
        - fail-publish
        - launchctl.log

    - name: Prepare a stub with stale WAL, SHM, and journal sidecars
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ wal_root }}/db/{{ item.name }}"
        mode: "0644"
      loop:
        - name: blockchain_v2_mainnet.sqlite
          content: "{{ 'S' * 8192 }}"
        - name: blockchain_v2_mainnet.sqlite-wal
          content: "{{ 'W' * 12392 }}"
        - name: blockchain_v2_mainnet.sqlite-shm
          content: stale-shm
        - name: blockchain_v2_mainnet.sqlite-journal
          content: stale-journal

    - name: Replace a stub with stale database sidecars
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: stale sidecars
          root: "{{ wal_root }}"

    - name: Inspect the replaced stub and sidecars
      ansible.builtin.stat:
        path: "{{ wal_root }}/db/{{ item }}"
      loop:
        - blockchain_v2_mainnet.sqlite
        - blockchain_v2_mainnet.sqlite-wal
        - blockchain_v2_mainnet.sqlite-shm
        - blockchain_v2_mainnet.sqlite-journal
      register: darwin_db_seed_stale_sidecars

    - name: Assert stale sidecars are gone and the snapshot was published
      ansible.builtin.assert:
        that:
          - lookup('file', wal_root ~ '/db/blockchain_v2_mainnet.sqlite') == fixture_main
          - darwin_db_seed_stale_sidecars.results[1].stat.exists is false
          - darwin_db_seed_stale_sidecars.results[2].stat.exists is false
          - darwin_db_seed_stale_sidecars.results[3].stat.exists is false

    - name: Reset the fake tool state before the loaded large-database case
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/{{ item }}"
        mode: "0644"
      loop:
        - aws.log
        - fail-file
        - fail-publish
        - launchctl.log

    - name: Prepare a large database with the full node loaded
      ansible.builtin.copy:
        content: "{{ 'K' * 11000 }}"
        dest: "{{ large_loaded_root }}/db/blockchain_v2_mainnet.sqlite"
        mode: "0644"

    - name: A loaded full node with a large database is not touched
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: loaded large database
          root: "{{ large_loaded_root }}"
          launchctl: loaded

    - name: Assert the loaded large database took no action
      ansible.builtin.assert:
        that:
          - lookup('file', large_loaded_root ~ '/db/blockchain_v2_mainnet.sqlite') == ('K' * 11000)
          - (lookup('file', test_root ~ '/aws.log') | length) == 0
          - (lookup('file', test_root ~ '/launchctl.log') | length) == 0

    - name: A loaded full node with a stub is refused before any write
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-run-case.yml"
      vars:
        case:
          name: loaded stub
          root: "{{ running_root }}"
          launchctl: loaded
          expect_failure: "LaunchDaemon is loaded"

    - name: Inspect the loaded-node database and staging paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ running_root }}/db/blockchain_v2_mainnet.sqlite"
        - "{{ running_root }}/db/.chia-s3-seed-mainnet"
      register: darwin_db_seed_running

    - name: Assert the loaded-node case wrote nothing
      ansible.builtin.assert:
        that:
          - darwin_db_seed_running.results | rejectattr('stat.exists') | list | length == 2
          - (lookup('file', test_root ~ '/aws.log') | length) == 0
          - (lookup('file', test_root ~ '/launchctl.log') | length) > 0

    - name: Each snapshot copy failure is fatal and publishes no partial database
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-failure-case.yml"
      loop:
        - name: height-to-hash
          file: height-to-hash
        - name: sub-epoch-summaries
          file: sub-epoch-summaries
      loop_control:
        loop_var: failure_case
        label: "{{ failure_case.name }}"

    - name: Failed publish renames stop later files and recover
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-publish-failure-case.yml"
      loop:
        - name: main database publish failure
          root: "{{ publish_root }}"
          file: blockchain_v2_mainnet.sqlite
        - name: cache publish failure
          root: "{{ cache_publish_root }}"
          file: height-to-hash
      loop_control:
        loop_var: publish_case
        label: "{{ publish_case.name }}"

    - name: Report the temporary test root
      ansible.builtin.debug:
        msg: "Darwin database seed tests passed under {{ test_root }}"
