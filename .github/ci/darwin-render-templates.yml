---
# Render the Darwin templates for every topology for CI linting.
- name: Render the Darwin templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  vars:
    render_out: /tmp/darwin
    topologies:
      - local-internal
      - local-external
      - remote-node
      - vdf-only
    templates:
      - chia-daemon-run.sh
      - chia-env.sh
      - chia-exporter-run.sh
      - chia-full-node-run.sh
      - chia-healthcheck-run.sh
      - chia-hw-vdf-run.sh
      - chia-periodic-connect-run.sh
      - chia-periodic-connect.plist
      - chia-timelord-run.sh
      - chia-watchdog.plist
      - launchdaemon.plist
      - timelord-app-config.toml
      - node-exporter-run.sh
      - pppc.mobileconfig
      - rotpipe.py
      - FULL-DISK-ACCESS.txt
    no_local_service_jobs:
      - name: daemon
        enabled: false
      - name: full-node
        enabled: false
      - name: timelord
        enabled: false
    minimal_companion_jobs:
      - name: chia-exporter
        enabled: false
      - name: chia-healthcheck
        enabled: false
      - name: node-exporter
        enabled: true
      - name: periodic-connect
        enabled: false
      - name: watchdog
        enabled: true
  tasks:
    - name: Set the render variables
      ansible.builtin.set_fact:
        user: timelord
        chia_root: /Users/timelord/.chia
        chia_darwin_hw_vdf_expected_serial: "FT'TEST 01"
        chia_timelord_full_node_peer_host: 10.0.0.5
        chia_periodic_connect_peers:
          - seed.example.net
        chia_darwin_hw_vdf_jobs:
          - name: hw-vdf
            enabled: true
            board:
              n_vdfs: 1
          - name: hw-vdf-2
            enabled: true
            board:
              n_vdfs: 1
          - name: hw-vdf-3
            enabled: true
            board:
              n_vdfs: 1
        chia_darwin_service_jobs:
          - name: daemon
            enabled: true
          - name: full-node
            enabled: true
          - name: timelord
            enabled: true
        chia_darwin_companion_jobs:
          - name: chia-exporter
            enabled: true
          - name: chia-healthcheck
            enabled: true
          - name: node-exporter
            enabled: true
          - name: watchdog
            enabled: true
        chia_job:
          name: timelord
          label: net.chia.timelord
          wrapper: /Users/timelord/bin/chia-timelord-run.sh
          throttle: 10
          exit_timeout: 30
          start_interval: 300

    - name: Create the topology output directories
      ansible.builtin.file:
        path: "{{ render_out }}/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ topologies }}"

    - name: Render the templates
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/{{ item.1 }}.j2"
        dest: "{{ render_out }}/{{ item.0 }}/{{ item.1 }}"
        mode: "0644"
      vars:
        chia_darwin_topology: "{{ item.0 }}"
        chia_darwin_local_full_node: "{{ item.0 in ['local-internal', 'local-external'] }}"
        chia_darwin_local_timelord: "{{ item.0 != 'vdf-only' }}"
      loop: "{{ topologies | product(templates) | list }}"
      loop_control:
        label: "{{ item.0 }}/{{ item.1 }}"

    - name: Create the remote-node watchdog fixture directory
      ansible.builtin.file:
        path: "{{ render_out }}/remote-node-no-full-node"
        state: directory
        mode: "0755"

    - name: Set the remote-node service list without a local full node
      ansible.builtin.set_fact:
        chia_darwin_service_jobs:
          - name: daemon
            enabled: true
          - name: full-node
            enabled: false
          - name: timelord
            enabled: true

    - name: Render the remote-node watchdog with no local full node
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/chia-watchdog.sh.j2"
        dest: "{{ render_out }}/remote-node-no-full-node/chia-watchdog.sh"
        mode: "0644"
      vars:
        chia_darwin_topology: remote-node

    - name: Read the remote-node watchdog
      ansible.builtin.slurp:
        src: "{{ render_out }}/remote-node-no-full-node/chia-watchdog.sh"
      register: remote_node_watchdog

    - name: The remote-node watchdog omits the full-node check and restart
      vars:
        text: "{{ remote_node_watchdog.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - '''CHECK_FULL_NODE="0"'' in text'
          - '''SERVICE_JOB_LIST="daemon timelord"'' in text'
          - '''CHECK_HEALTHCHECK="1"'' in text'
          - '''CHECK_FULL_NODE_PORTS="0"'' in text'
          - '''CHECK_EXPORTER="1"'' in text'
          - '''CHECK_NODE="1"'' in text'
          - '''EXPECTED_VDFS="3"'' in text'

    - name: Restore the local full-service list
      ansible.builtin.set_fact:
        chia_darwin_service_jobs:
          - name: daemon
            enabled: true
          - name: full-node
            enabled: true
          - name: timelord
            enabled: true

    - name: Render the local-external watchdog
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/chia-watchdog.sh.j2"
        dest: "{{ render_out }}/local-external/chia-watchdog.sh"
        mode: "0644"
      vars:
        chia_darwin_topology: local-external

    - name: Read the local watchdog
      ansible.builtin.slurp:
        src: "{{ render_out }}/local-external/chia-watchdog.sh"
      register: local_watchdog

    - name: The local watchdog checks the local full node
      vars:
        text: "{{ local_watchdog.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - >-
            'CHECK_FULL_NODE="1"' in text
          - >-
            'SERVICE_JOB_LIST="daemon full-node timelord"' in text
          - >-
            'CHECK_HEALTHCHECK="1"' in text
          - >-
            'CHECK_EXPORTER="1"' in text
          - >-
            'CHECK_NODE="1"' in text
          - >-
            'EXPECTED_VDFS="3"' in text
          - "'ENABLE_ON_BOOT=1' in text"
          - '''CHECK_FULL_NODE_PORTS="1"'' in text'
          - "'DEBUG_THRESHOLD=2' in text"
          - "'set_log_level' in text"
          - "'fnp_fail' in text"
          - "'/full_node/ports' in text"
          - "'GRACE_BOOT=${WATCHDOG_BOOT_GRACE:-3600}' in text"
          - "'GRACE_RESTART=${WATCHDOG_RESTART_GRACE:-600}' in text"

    - name: Create the no-boot watchdog fixture directory
      ansible.builtin.file:
        path: "{{ render_out }}/watchdog-no-boot-start"
        state: directory
        mode: "0755"

    - name: Render the watchdog with start_on_boot false
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/chia-watchdog.sh.j2"
        dest: "{{ render_out }}/watchdog-no-boot-start/chia-watchdog.sh"
        mode: "0644"
      vars:
        chia_darwin_topology: local-external
        chia_darwin_start_on_boot: false

    - name: Read the no-boot watchdog
      ansible.builtin.slurp:
        src: "{{ render_out }}/watchdog-no-boot-start/chia-watchdog.sh"
      register: no_boot_watchdog

    - name: start_on_boot false enables a board only for the watchdog start
      vars:
        text: "{{ no_boot_watchdog.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'ENABLE_ON_BOOT=0' in text"
          - >-
            'launchctl enable "system/$PREFIX.$1"' in text
          - >-
            'launchctl disable "system/$PREFIX.$1"' in text

    - name: Read the vdf-only hw-vdf wrapper
      ansible.builtin.slurp:
        src: "{{ render_out }}/vdf-only/chia-hw-vdf-run.sh"
      register: vdf_only_wrapper

    - name: vdf-only skips the local timelord wait
      vars:
        text: "{{ vdf_only_wrapper.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'vdf-only has no local timelord' in text"
          - '''wait_for_listen "$PORT"'' not in text'

    - name: Create the vdf-only watchdog fixture directory
      ansible.builtin.file:
        path: "{{ render_out }}/vdf-only-no-services"
        state: directory
        mode: "0755"

    - name: Set the vdf-only service and companion lists
      ansible.builtin.set_fact:
        chia_darwin_service_jobs: "{{ no_local_service_jobs }}"
        chia_darwin_companion_jobs: "{{ minimal_companion_jobs }}"

    - name: Render the vdf-only watchdog with no local services
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/chia-watchdog.sh.j2"
        dest: "{{ render_out }}/vdf-only-no-services/chia-watchdog.sh"
        mode: "0644"
      vars:
        chia_darwin_topology: vdf-only

    - name: Read the vdf-only watchdog
      ansible.builtin.slurp:
        src: "{{ render_out }}/vdf-only-no-services/chia-watchdog.sh"
      register: vdf_only_watchdog

    - name: The vdf-only watchdog checks boards but not local HTTP services
      vars:
        text: "{{ vdf_only_watchdog.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - '''CHECK_FULL_NODE="0"'' in text'
          - '''CHECK_HEALTHCHECK="0"'' in text'
          - '''CHECK_FULL_NODE_PORTS="0"'' in text'
          - "'CHECK_VDF_CONNS' not in text"
          - '''SERVICE_JOB_LIST=""'' in text'
          - '''EXPECTED_VDFS="3"'' in text'
          - "'hw_jobs_running' in text"

    - name: Create the VDF tuning fixture directory
      ansible.builtin.file:
        path: "{{ render_out }}/vdf-tuning"
        state: directory
        mode: "0755"

    - name: Render the hw-vdf wrapper with auto-freq and max-freq
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/chia-hw-vdf-run.sh.j2"
        dest: "{{ render_out }}/vdf-tuning/chia-hw-vdf-run.sh"
        mode: "0644"
      vars:
        chia_darwin_topology: local-external
        chia_darwin_local_full_node: true
        chia_darwin_local_timelord: true
        chia_darwin_hw_vdf_auto_freq_period: 60
        chia_darwin_hw_vdf_max_freq: 1620

    - name: Read the tuned hw-vdf wrapper
      ansible.builtin.slurp:
        src: "{{ render_out }}/vdf-tuning/chia-hw-vdf-run.sh"
      register: tuned_hw_vdf

    - name: The hw-vdf wrapper passes the Linux tuning flags
      vars:
        text: "{{ tuned_hw_vdf.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - '''--max-freq "$MAX_FREQ"'' in text'
          - '''--auto-freq-period "$AUTO_FREQ_PERIOD"'' in text'
          - "'MAX_FREQ=1620' in text"
          - "'AUTO_FREQ_PERIOD=60' in text"

    - name: Read the node-exporter wrapper
      ansible.builtin.slurp:
        src: "{{ render_out }}/local-external/node-exporter-run.sh"
      register: node_exporter_wrapper

    - name: The node-exporter wrapper rotates its log
      vars:
        text: "{{ node_exporter_wrapper.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'node-exporter.log' in text"
          - "'rotpipe.py' in text"

    - name: Read the periodic peer-connect wrapper and plist
      ansible.builtin.slurp:
        src: "{{ render_out }}/local-external/{{ item }}"
      loop:
        - chia-periodic-connect-run.sh
        - chia-periodic-connect.plist
      register: periodic_files

    - name: The periodic peer job connects on a launchd interval
      vars:
        wrapper: "{{ periodic_files.results[0].content | b64decode }}"
        plist: "{{ periodic_files.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'chia peer full_node -a seed.example.net:8444' in wrapper"
          - "'periodic-connect.log' in wrapper"
          - "'<key>StartInterval</key><integer>300</integer>' in plist"
          - "'<key>RunAtLoad</key><true/>' in plist"
          - "'<key>KeepAlive</key>' not in plist"

    - name: Read the Timelord.app configs
      ansible.builtin.slurp:
        src: "{{ render_out }}/{{ item }}/timelord-app-config.toml"
      loop:
        - local-external
        - remote-node
      register: timelord_app_configs

    - name: Timelord.app configs use the app listeners and identity-free setup
      vars:
        local_config: "{{ timelord_app_configs.results[0].content | b64decode }}"
        remote_config: "{{ timelord_app_configs.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'schema_version = 1' in local_config"
          - '''status_listen = "127.0.0.1:9257"'' in local_config'
          - '''observability_listen = "0.0.0.0:9258"'' in local_config'
          - "'allow_remote_observability = true' in local_config"
          - '''supervisor_observability_listen = "0.0.0.0:9259"'' in local_config'
          - '''host = "localhost"'' in local_config'
          - "'port = 8444' in local_config"
          - '''network = "mainnet"'' in local_config'
          - '''client_binary = "/Applications/Timelord.app/Contents/Helpers/hw_vdf_client"'' in local_config'
          - '''driver_library = "/Applications/Timelord.app/Contents/Frameworks/libftd2xx.dylib"'' in local_config'
          - "'certificate =' not in local_config"
          - "'private_key =' not in local_config"
          - '''host = "10.0.0.5"'' in remote_config'

    - name: Create the loopback Timelord.app config fixture directory
      ansible.builtin.file:
        path: "{{ render_out }}/timelord-app-loopback"
        state: directory
        mode: "0755"

    - name: Render the loopback Timelord.app config
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/timelord-app-config.toml.j2"
        dest: "{{ render_out }}/timelord-app-loopback/timelord-app-config.toml"
        mode: "0644"
      vars:
        chia_darwin_local_full_node: true
        chia_darwin_timelord_app_expose_observability: false

    - name: Read the loopback Timelord.app config
      ansible.builtin.slurp:
        src: "{{ render_out }}/timelord-app-loopback/timelord-app-config.toml"
      register: timelord_app_loopback_config

    - name: The loopback Timelord.app config omits the deployment listener
      vars:
        text: "{{ timelord_app_loopback_config.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - '''observability_listen = "0.0.0.0:9258"'' not in text'
          - "'allow_remote_observability = false' in text"
          - '''supervisor_observability_listen = "127.0.0.1:9259"'' in text'

    - name: Create the Timelord.app watchdog fixture directory
      ansible.builtin.file:
        path: "{{ render_out }}/timelord-app-watchdog"
        state: directory
        mode: "0755"

    - name: Select the Timelord.app implementation
      ansible.builtin.set_fact:
        chia_darwin_topology: local-external
        chia_darwin_timelord_implementation: timelord-app

    - name: Build the Timelord.app job list
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-jobs.yml

    - name: Render the Timelord.app watchdog
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/chia-watchdog.sh.j2"
        dest: "{{ render_out }}/timelord-app-watchdog/chia-watchdog.sh"
        mode: "0644"
      vars:
        chia_darwin_topology: local-external

    - name: Read the Timelord.app watchdog
      ansible.builtin.slurp:
        src: "{{ render_out }}/timelord-app-watchdog/chia-watchdog.sh"
      register: timelord_app_watchdog

    - name: The Timelord.app watchdog checks both app listeners and the full node
      vars:
        text: "{{ timelord_app_watchdog.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - '''CHECK_APP="1"'' in text'
          - '''CHECK_TIMELORD="0"'' in text'
          - '''CHECK_HEALTHCHECK="1"'' in text'
          - '''CHECK_FULL_NODE="1"'' in text'
          - '''CHECK_FULL_NODE_PORTS="1"'' in text'
          - "'CHECK_FULL_NODE_JOB=$((CHECK_APP && CHECK_FULL_NODE))' in text"
          - '''SERVICE_JOB_LIST="daemon full-node"'' in text'
          - "'APP_LABEL=net.chia.timelord.supervisor' in text"
          - "'APP_STATUS=http://127.0.0.1:9257' in text"
          - "'APP_SUPERVISOR=http://127.0.0.1:9259' in text"
          - "'timelord-app-health' in text"

    - name: Set the remote Timelord.app watchdog fixture
      ansible.builtin.set_fact:
        chia_darwin_local_full_node: false
        chia_darwin_service_jobs: "{{ no_local_service_jobs }}"
        chia_darwin_companion_jobs: "{{ minimal_companion_jobs }}"

    - name: Create the remote Timelord.app watchdog fixture directory
      ansible.builtin.file:
        path: "{{ render_out }}/timelord-app-remote-watchdog"
        state: directory
        mode: "0755"

    - name: Render the remote Timelord.app watchdog
      ansible.builtin.template:
        src: "../../chia-blockchain/templates/darwin/chia-watchdog.sh.j2"
        dest: "{{ render_out }}/timelord-app-remote-watchdog/chia-watchdog.sh"
        mode: "0644"
      vars:
        chia_darwin_topology: remote-node

    - name: Read the remote Timelord.app watchdog
      ansible.builtin.slurp:
        src: "{{ render_out }}/timelord-app-remote-watchdog/chia-watchdog.sh"
      register: remote_timelord_app_watchdog

    - name: The remote Timelord.app watchdog has no local full-node jobs
      vars:
        text: "{{ remote_timelord_app_watchdog.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - '''CHECK_APP="1"'' in text'
          - '''CHECK_FULL_NODE="0"'' in text'
          - '''CHECK_FULL_NODE_PORTS="0"'' in text'
          - "'CHECK_FULL_NODE_JOB=$((CHECK_APP && CHECK_FULL_NODE))' in text"
          - '''CHECK_HEALTHCHECK="0"'' in text'
          - '''SERVICE_JOB_LIST=""'' in text'
