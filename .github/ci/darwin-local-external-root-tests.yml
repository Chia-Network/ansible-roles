---
# Local tests for chia-blockchain/tasks/darwin-local-external-root.yml. They
# use a temporary test root, a fake mount, and a stateful fake launchctl. No
# real Mac, external volume, launchd job, or S3 bucket is touched.
- name: Test the local-external CHIA_ROOT layout without a Mac
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  tasks:
    - name: Create a temporary local-external root test directory
      ansible.builtin.tempfile:
        state: directory
        suffix: " darwin local external root"
      register: darwin_local_external_temp

    - name: Record the local-external root test directory
      ansible.builtin.set_fact:
        test_root: "{{ darwin_local_external_temp.path }}"

    - name: Create the shared fixtures and fake tools
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-setup.yml"

    - name: Record the shared external paths
      ansible.builtin.set_fact:
        external_chia: "{{ chia_darwin_volume_chia_dir }}"
        external_db: "{{ chia_darwin_volume_db_dir }}"

    - name: Create the shared on-volume database directory
      ansible.builtin.file:
        path: "{{ external_db }}"
        state: directory
        mode: "0755"

    - name: Load the production Darwin tasks for the mount preflight test
      ansible.builtin.set_fact:
        local_external_darwin_tasks: "{{ lookup('file', playbook_dir ~ '/../../chia-blockchain/tasks/darwin.yml') | from_yaml }}"

    - name: Extract the production mount preflight tasks
      ansible.builtin.set_fact:
        local_external_mount_tasks: >-
          {{ (local_external_darwin_tasks
          | selectattr('name', 'equalto', 'Manage the chia-blockchain CHIA_ROOT')
          | first)['block']
          | selectattr('name', 'in', ['Read mounted filesystems', 'Require the database volume to be mounted now'])
          | list }}

    - name: Write the production mount preflight tasks to a temporary include
      ansible.builtin.copy:
        content: "{{ local_external_mount_tasks | to_nice_yaml }}"
        dest: "{{ test_root }}/mount-preflight.yml"
        mode: "0644"

    - name: Extract the production CHIA_ROOT directory tasks
      ansible.builtin.set_fact:
        local_external_root_dir_tasks: >-
          {{ (local_external_darwin_tasks
          | selectattr('name', 'equalto', 'Install chia-blockchain into the virtualenv')
          | first)['block']
          | selectattr('name', 'in', ['Ensure the CHIA_ROOT config directory exists', 'Ensure the CHIA_ROOT db directory exists for internal topologies', 'Inspect the local-external CHIA_ROOT db symlink', 'Require the local-external CHIA_ROOT db symlink to be unchanged'])
          | list }}

    - name: Write the production CHIA_ROOT directory tasks to a temporary include
      ansible.builtin.copy:
        content: "{{ local_external_root_dir_tasks | to_nice_yaml }}"
        dest: "{{ test_root }}/chia-root-dirs.yml"
        mode: "0644"

    - name: A fresh host gets a real internal CHIA_ROOT and a db symlink
      vars:
        chia_darwin_home: "{{ test_root }}/fresh/home"
        chia_root: "{{ test_root }}/fresh/home/.chia/{{ network }}"
      block:
        - name: Run the local-external root include on a fresh host
          ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

        - name: Require the fresh run to succeed
          ansible.builtin.assert:
            that:
              - not (local_external_case_failed | bool)
            fail_msg: "The fresh run failed: {{ local_external_case_message }}"

        - name: Inspect the fresh local-external layout
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ chia_darwin_home }}/.chia"
            - "{{ chia_root }}/db"
            - "{{ external_db }}"
            - "{{ external_chia }}/{{ network }}/wallet"
            - "{{ chia_darwin_home }}/.chia.legacy-volume-link"
            - "{{ chia_darwin_home }}/.chia.migrating"
          register: fresh_stats

        - name: Require the fresh local-external layout
          ansible.builtin.assert:
            that:
              - fresh_stats.results[0].stat.isdir | default(false)
              - not (fresh_stats.results[0].stat.islnk | default(false))
              - fresh_stats.results[1].stat.islnk | default(false)
              - >-
                (fresh_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
                (external_db | regex_replace('/+$', ''))
              - fresh_stats.results[2].stat.isdir | default(false)
              - not (fresh_stats.results[3].stat.exists | default(false))
              - not (fresh_stats.results[4].stat.exists | default(false))
              - not (fresh_stats.results[5].stat.exists | default(false))
            fail_msg: >-
              A fresh local-external host must get a real internal ~/.chia and
              CHIA_ROOT, an on-volume DB directory, and only <chia_root>/db as
              a symlink. Wallet data must stay off the volume.

        - name: Write the fresh on-volume database fixture
          ansible.builtin.copy:
            content: fresh database
            dest: "{{ external_db }}/blockchain_v2_mainnet.sqlite"
            mode: "0644"

        - name: Record the fresh on-volume database before the directory tasks
          ansible.builtin.stat:
            path: "{{ external_db }}/blockchain_v2_mainnet.sqlite"
          register: fresh_db_before

        - name: Run the production CHIA_ROOT directory tasks on the fresh layout
          ansible.builtin.include_tasks: "{{ test_root }}/chia-root-dirs.yml"

        - name: Inspect the fresh layout after the directory tasks
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ chia_root }}/config"
            - "{{ chia_root }}/db"
            - "{{ external_db }}/blockchain_v2_mainnet.sqlite"
          register: fresh_after_dirs

        - name: Require the fresh directory tasks to preserve the db symlink and database
          ansible.builtin.assert:
            that:
              - fresh_after_dirs.results[0].stat.isdir | default(false)
              - not (fresh_after_dirs.results[0].stat.islnk | default(false))
              - fresh_after_dirs.results[1].stat.islnk | default(false)
              - >-
                (fresh_after_dirs.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
                (external_db | regex_replace('/+$', ''))
              - fresh_after_dirs.results[2].stat.isreg | default(false)
              - fresh_after_dirs.results[2].stat.inode == (fresh_db_before.stat.inode | int)
              - fresh_after_dirs.results[2].stat.path == external_db ~ '/blockchain_v2_mainnet.sqlite'
            fail_msg: >-
              The later CHIA_ROOT directory tasks must create config as a real
              directory without touching the local-external db symlink or the
              on-volume database file.

    - name: Repair a missing db symlink on an existing real ~/.chia
      vars:
        chia_darwin_home: "{{ test_root }}/repair/home"
        chia_root: "{{ test_root }}/repair/home/.chia/{{ network }}"
      block:
        - name: Create a real ~/.chia without a CHIA_ROOT
          ansible.builtin.file:
            path: "{{ chia_darwin_home }}/.chia"
            state: directory
            mode: "0755"

        - name: Run the local-external root include to repair the db symlink
          ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

        - name: Require the repair run to succeed
          ansible.builtin.assert:
            that:
              - not (local_external_case_failed | bool)
            fail_msg: "The repair run failed: {{ local_external_case_message }}"

        - name: Inspect the repaired local-external layout
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ chia_root }}"
            - "{{ chia_root }}/db"
            - "{{ external_db }}"
          register: repair_stats

        - name: Require the repaired local-external layout
          ansible.builtin.assert:
            that:
              - repair_stats.results[0].stat.isdir | default(false)
              - repair_stats.results[1].stat.islnk | default(false)
              - >-
                (repair_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
                (external_db | regex_replace('/+$', ''))
              - repair_stats.results[2].stat.isdir | default(false)
            fail_msg: >-
              A real ~/.chia with no <chia_root>/db must be repaired by
              creating the internal CHIA_ROOT and linking db at the volume.

    - name: Prepare a legacy ~/.chia volume symlink with on-volume data
      vars:
        legacy_home: "{{ test_root }}/legacy/home"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ legacy_home }}"
        - "{{ external_chia }}/mainnet/config"
        - "{{ external_chia }}/mainnet/wallet/db"
        - "{{ external_chia }}/mainnet/db"
        - "{{ external_chia }}/testnet11/db"

    - name: Write the legacy on-volume fixtures
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - content: mainnet config fixture
          dest: "{{ external_chia }}/mainnet/config/config.yaml"
          mode: "0644"
        - content: keeper mode fixture
          dest: "{{ external_chia }}/mainnet/config/secret.txt"
          mode: "0600"
        - content: wallet db fixture
          dest: "{{ external_chia }}/mainnet/wallet/db/wallet.sqlite"
          mode: "0644"
        - content: volume-only blockchain database
          dest: "{{ external_chia }}/mainnet/db/blockchain_v2_mainnet.sqlite"
          mode: "0644"
        - content: testnet11 blockchain database
          dest: "{{ external_chia }}/testnet11/db/blockchain_v2_testnet11.sqlite"
          mode: "0644"
        - content: leftover non-db file on the volume
          dest: "{{ external_chia }}/mainnet/leftover.txt"
          mode: "0644"

    - name: Create the legacy ~/.chia volume symlink
      ansible.builtin.file:
        src: "{{ external_chia }}"
        dest: "{{ test_root }}/legacy/home/.chia"
        state: link
        force: false

    - name: Record the on-volume database inode before migration
      ansible.builtin.stat:
        path: "{{ external_chia }}/mainnet/db/blockchain_v2_mainnet.sqlite"
      register: legacy_volume_db_before

    - name: Reset the fake launchctl log before the migration
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/launchctl.log"
        mode: "0644"

    - name: Migrate the legacy ~/.chia volume symlink
      vars:
        chia_darwin_home: "{{ test_root }}/legacy/home"
        chia_root: "{{ test_root }}/legacy/home/.chia/{{ network }}"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the legacy migration to succeed
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: "The legacy migration failed: {{ local_external_case_message }}"

    - name: Inspect the migrated local-external layout
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ test_root }}/legacy/home/.chia"
        - "{{ test_root }}/legacy/home/.chia/mainnet/db"
        - "{{ test_root }}/legacy/home/.chia/testnet11/db"
        - "{{ test_root }}/legacy/home/.chia.legacy-volume-link"
        - "{{ test_root }}/legacy/home/.chia.migrating"
        - "{{ external_chia }}/mainnet/db/blockchain_v2_mainnet.sqlite"
        - "{{ external_chia }}/mainnet/config/config.yaml"
        - "{{ external_chia }}/mainnet/config/secret.txt"
        - "{{ external_chia }}/mainnet/wallet/db/wallet.sqlite"
        - "{{ external_chia }}/mainnet/leftover.txt"
      register: migrated_stats

    - name: Require the migrated local-external layout
      ansible.builtin.assert:
        that:
          - migrated_stats.results[0].stat.isdir | default(false)
          - not (migrated_stats.results[0].stat.islnk | default(false))
          - migrated_stats.results[1].stat.islnk | default(false)
          - >-
            (migrated_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_db | regex_replace('/+$', ''))
          - migrated_stats.results[2].stat.islnk | default(false)
          - >-
            (migrated_stats.results[2].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            ((external_chia ~ '/testnet11/db') | regex_replace('/+$', ''))
          - migrated_stats.results[3].stat.islnk | default(false)
          - >-
            (migrated_stats.results[3].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_chia | regex_replace('/+$', ''))
          - not (migrated_stats.results[4].stat.exists | default(false))
          - migrated_stats.results[5].stat.isreg | default(false)
          - migrated_stats.results[5].stat.inode == (legacy_volume_db_before.stat.inode | int)
          - migrated_stats.results[6].stat.isreg | default(false)
          - migrated_stats.results[7].stat.isreg | default(false)
          - migrated_stats.results[7].stat.mode == '0600'
          - migrated_stats.results[8].stat.isreg | default(false)
          - migrated_stats.results[9].stat.isreg | default(false)
          - lookup('file', test_root ~ '/legacy/home/.chia/mainnet/config/config.yaml') == 'mainnet config fixture'
          - lookup('file', test_root ~ '/legacy/home/.chia/mainnet/wallet/db/wallet.sqlite') == 'wallet db fixture'
          - chia_darwin_local_external_restarted | bool
        fail_msg: >-
          The legacy migration must keep ~/.chia internal and real, copy non-db
          data, preserve modes, link only <chia_root>/db at the original volume
          DB, leave the volume database in place, and restart the loaded jobs.

    - name: Require the migration to restart the enabled jobs and not the disabled one
      vars:
        launchctl_lines: "{{ lookup('file', test_root ~ '/launchctl.log') | split('\n') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - launchctl_lines | select('search', 'bootout system/net.chia.roottest.timelord') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.timelord') | list | length >= 1
          - launchctl_lines | select('search', 'bootout system/net.chia.roottest.chia-exporter') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.chia-exporter') | list | length >= 1
          - launchctl_lines | select('search', 'net.chia.roottest.disabled') | list | length == 0
        fail_msg: >-
          The migration must stop and restart only this role's loaded enabled
          jobs and must not touch disabled or non-chia jobs. Log:
          {{ launchctl_lines }}

    - name: Require the migration to stop the timelord before rsync copies
      vars:
        launchctl_lines: "{{ lookup('file', test_root ~ '/launchctl.log') | split('\n') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - launchctl_lines | select('search', '^rsync ') | list | length >= 1
          - >-
            (launchctl_lines.index('bootout system/net.chia.roottest.timelord')) <
            (launchctl_lines.index(launchctl_lines | select('search', '^rsync ') | first))
        fail_msg: >-
          The timelord must be booted out before the migration copies data.
          Log: {{ launchctl_lines }}

    - name: Record the migrated on-volume database before the directory tasks
      ansible.builtin.stat:
        path: "{{ external_chia }}/mainnet/db/blockchain_v2_mainnet.sqlite"
      register: migrated_db_before_dirs

    - name: Run the production CHIA_ROOT directory tasks on the migrated layout
      vars:
        chia_darwin_home: "{{ test_root }}/legacy/home"
        chia_root: "{{ test_root }}/legacy/home/.chia/{{ network }}"
      ansible.builtin.include_tasks: "{{ test_root }}/chia-root-dirs.yml"

    - name: Inspect the migrated layout after the directory tasks
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ test_root }}/legacy/home/.chia/mainnet/config"
        - "{{ test_root }}/legacy/home/.chia/mainnet/db"
        - "{{ external_chia }}/mainnet/db/blockchain_v2_mainnet.sqlite"
      register: migrated_after_dirs

    - name: Require the migrated directory tasks to preserve the db symlink and database
      ansible.builtin.assert:
        that:
          - migrated_after_dirs.results[0].stat.isdir | default(false)
          - not (migrated_after_dirs.results[0].stat.islnk | default(false))
          - migrated_after_dirs.results[1].stat.islnk | default(false)
          - >-
            (migrated_after_dirs.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_db | regex_replace('/+$', ''))
          - migrated_after_dirs.results[2].stat.isreg | default(false)
          - migrated_after_dirs.results[2].stat.inode == (migrated_db_before_dirs.stat.inode | int)
          - migrated_after_dirs.results[2].stat.path == external_chia ~ '/mainnet/db/blockchain_v2_mainnet.sqlite'
        fail_msg: >-
          The later CHIA_ROOT directory tasks must leave the migrated db
          symlink and the on-volume database file in place.

    - name: Run the local-external refusal and guard cases
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-refusals.yml"

    - name: Run the local-external leftover, rescue, and restart cases
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-restart.yml"

    - name: Finish a migration interrupted after the first rename
      vars:
        chia_darwin_home: "{{ test_root }}/interrupted/home"
        chia_root: "{{ test_root }}/interrupted/home/.chia/{{ network }}"
      block:
        - name: Prepare an interrupted staging tree and legacy backup
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - "{{ chia_darwin_home }}/.chia.migrating/{{ network }}"
            - "{{ chia_darwin_home }}"

        - name: Link the interrupted staging database at the volume
          ansible.builtin.file:
            src: "{{ external_db }}"
            dest: "{{ chia_darwin_home }}/.chia.migrating/{{ network }}/db"
            state: link
            force: false

        - name: Create the interrupted migration legacy backup link
          ansible.builtin.file:
            src: "{{ external_chia }}"
            dest: "{{ chia_darwin_home }}/.chia.legacy-volume-link"
            state: link
            force: false

        - name: Run the local-external root include on the interrupted layout
          ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

        - name: Require the interrupted finish to succeed
          ansible.builtin.assert:
            that:
              - not (local_external_case_failed | bool)
            fail_msg: "The interrupted finish failed: {{ local_external_case_message }}"

        - name: Inspect the finished interrupted layout
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
          loop:
            - "{{ chia_darwin_home }}/.chia"
            - "{{ chia_darwin_home }}/.chia/{{ network }}/db"
            - "{{ chia_darwin_home }}/.chia.migrating"
            - "{{ chia_darwin_home }}/.chia.legacy-volume-link"
          register: interrupted_stats

        - name: Require the interrupted finish to complete the swap
          ansible.builtin.assert:
            that:
              - interrupted_stats.results[0].stat.isdir | default(false)
              - not (interrupted_stats.results[0].stat.islnk | default(false))
              - interrupted_stats.results[1].stat.islnk | default(false)
              - >-
                (interrupted_stats.results[1].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
                (external_db | regex_replace('/+$', ''))
              - not (interrupted_stats.results[2].stat.exists | default(false))
              - interrupted_stats.results[3].stat.islnk | default(false)

    - name: Fail closed when the production mount preflight does not see the volume
      vars:
        chia_darwin_home: "{{ test_root }}/unmounted/home"
        chia_root: "{{ test_root }}/unmounted/home/.chia/{{ network }}"
      block:
        - name: Prepare a legacy ~/.chia symlink before the mount preflight
          ansible.builtin.file:
            path: "{{ chia_darwin_home }}"
            state: directory
            mode: "0755"

        - name: Point ~/.chia at the volume before the mount preflight
          ansible.builtin.file:
            src: "{{ external_chia }}"
            dest: "{{ chia_darwin_home }}/.chia"
            state: link
            force: false

        - name: Run the production mount preflight against an unmounted volume
          ansible.builtin.include_tasks: "{{ test_root }}/mount-preflight.yml"
          vars:
            chia_darwin_topology: local-external
            chia_darwin_mount: "{{ test_root }}/bin/mount-unmounted"

        - name: Fail because the unmounted volume passed the mount preflight
          ansible.builtin.fail:
            msg: The unmounted volume passed the mount preflight

      rescue:
        - name: Require the mount preflight refusal
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('not mounted')
            fail_msg: >-
              The unmounted volume failed with the wrong message:
              {{ ansible_failed_result.msg | default('no message') }}

    - name: Inspect ~/.chia after the refused mount preflight
      ansible.builtin.stat:
        path: "{{ test_root }}/unmounted/home/.chia"
        follow: false
      register: unmounted_stat

    - name: Require the mount preflight to leave ~/.chia untouched
      ansible.builtin.assert:
        that:
          - unmounted_stat.stat.islnk | default(false)
          - >-
            (unmounted_stat.stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_chia | regex_replace('/+$', ''))

    - name: Report the temporary local-external root test directory
      ansible.builtin.debug:
        msg: "Darwin local-external root tests passed under {{ test_root }}"
