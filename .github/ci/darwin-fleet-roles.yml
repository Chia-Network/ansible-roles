---
# Static and render checks for the fleet roles that the Darwin timelord adds:
# base-setup (SSH), alloy (central logs), and smartctl-exporter (SMART metrics).
# The source and render plays only read files and render to a temp directory.
# The tailscale exercise play overwrites system paths (brew, launchctl, plutil,
# and the tailscale LaunchDaemon), so it must run only on a throwaway
# GitHub-hosted runner.
- name: Check the Darwin fleet role sources
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    repo_dir: "{{ playbook_dir }}/../.."
  tasks:
    - name: Read the fleet role sources
      ansible.builtin.set_fact:
        base_main: "{{ lookup('file', repo_dir ~ '/base-setup/tasks/main.yml') }}"
        base_darwin: "{{ lookup('file', repo_dir ~ '/base-setup/tasks/darwin.yml') }}"
        base_linux: "{{ lookup('file', repo_dir ~ '/base-setup/tasks/linux.yml') }}"
        base_handlers: "{{ lookup('file', repo_dir ~ '/base-setup/handlers/main.yml') }}"
        base_meta: "{{ lookup('file', repo_dir ~ '/base-setup/meta/main.yml') }}"
        ssh_ca_main: "{{ lookup('file', repo_dir ~ '/ssh-ca/tasks/main.yml') }}"
        ssh_ca_defaults: "{{ lookup('file', repo_dir ~ '/ssh-ca/defaults/main.yml') }}"
        ssh_ca_handlers: "{{ lookup('file', repo_dir ~ '/ssh-ca/handlers/main.yml') }}"
        alloy_main: "{{ lookup('file', repo_dir ~ '/alloy/tasks/main.yml') }}"
        alloy_darwin: "{{ lookup('file', repo_dir ~ '/alloy/tasks/darwin.yml') }}"
        alloy_defaults: "{{ lookup('file', repo_dir ~ '/alloy/defaults/main.yml') }}"
        alloy_handlers: "{{ lookup('file', repo_dir ~ '/alloy/handlers/main.yml') }}"
        alloy_template: "{{ lookup('file', repo_dir ~ '/alloy/templates/config.alloy.j2') }}"
        smartctl_main: "{{ lookup('file', repo_dir ~ '/smartctl-exporter/tasks/main.yml') }}"
        smartctl_darwin: "{{ lookup('file', repo_dir ~ '/smartctl-exporter/tasks/darwin.yml') }}"
        smartctl_defaults: "{{ lookup('file', repo_dir ~ '/smartctl-exporter/defaults/main.yml') }}"
        smartctl_handlers: "{{ lookup('file', repo_dir ~ '/smartctl-exporter/handlers/main.yml') }}"
        tailscale_main: "{{ lookup('file', repo_dir ~ '/tailscale/tasks/main.yml') }}"
        tailscale_darwin: "{{ lookup('file', repo_dir ~ '/tailscale/tasks/darwin.yml') }}"

    - name: base-setup routes Darwin and Linux separately
      ansible.builtin.assert:
        that:
          - "'darwin.yml' in base_main"
          - "'linux.yml' in base_main"
          - '''ansible_os_family != "Darwin"'' in base_main'
          - "'PasswordAuthentication no' in base_darwin"
          - "'PermitRootLogin no' in base_darwin"
          - "'KbdInteractiveAuthentication no' in base_darwin"
          - "'authorized_keys' in base_darwin"
          - "'base_setup_authorized_keys_path' in base_darwin"
          - "'base_setup_sshd_validate' in base_darwin"
          - "'/etc/passwd' not in base_darwin"
          - "'/usr/sbin/sshd, -t, -f' not in base_darwin"
          - "'restart-ssh-darwin' in base_darwin"
          - "'launchctl, kickstart, -k, system/com.openssh.sshd' in base_handlers"
          - '''when: ansible_os_family != "Darwin"'' in base_handlers'
          - "'PasswordAuthentication no' in base_linux"
          - '''when: ansible_os_family != "Darwin"'' in base_meta'
        fail_msg: >-
          base-setup must keep the Linux sshd tasks and add a Darwin path that
          proves key auth before disabling passwords, validates sshd, and
          restarts launchd's com.openssh.sshd.

    - name: ssh-ca is not gated off Darwin and restarts sshd per OS
      vars:
        base_meta_yaml: "{{ base_meta | from_yaml }}"
      ansible.builtin.assert:
        that:
          - >-
            base_meta_yaml.dependencies | selectattr('role', 'eq', 'ssh-ca')
            | list | length == 1
          - >-
            'when' not in (base_meta_yaml.dependencies
            | selectattr('role', 'eq', 'ssh-ca') | list | first)
          - '''when: ansible_os_family != "Darwin"'' in base_meta'
          - "'ssh_ca_sshd_config' in ssh_ca_defaults"
          - "'ssh_ca_trusted_user_ca_keys' in ssh_ca_defaults"
          - "'/etc/ssh/sshd_config' in ssh_ca_defaults"
          - "'/etc/ssh/trusted-user-ca-keys.pem' in ssh_ca_defaults"
          - "'ssh_ca_sshd_config' in ssh_ca_main"
          - "'ssh_ca_trusted_user_ca_keys' in ssh_ca_main"
          - "'dest: /etc/ssh/trusted-user-ca-keys.pem' not in ssh_ca_main"
          - "'path: /etc/ssh/sshd_config' not in ssh_ca_main"
          - '''line: "TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem"'' not in ssh_ca_main'
          - "'TrustedUserCAKeys' in ssh_ca_main"
          - "'notify: ssh-ca-restart-ssh' in ssh_ca_main"
          - "'notify: restart-ssh' not in ssh_ca_main"
          - "'name: ssh-ca-restart-ssh-linux' in ssh_ca_handlers"
          - "'name: ssh-ca-restart-ssh-darwin' in ssh_ca_handlers"
          - "'listen: ssh-ca-restart-ssh' in ssh_ca_handlers"
          - "'listen: restart-ssh' not in ssh_ca_handlers"
          - "'name: restart-ssh' not in ssh_ca_handlers"
          - "'name: restart-ssh-darwin' not in ssh_ca_handlers"
          - "'ansible.builtin.service' in ssh_ca_handlers"
          - "'name: ssh' in ssh_ca_handlers"
          - '''ansible_os_family != "Darwin"'' in ssh_ca_handlers'
          - '''ansible_os_family == "Darwin"'' in ssh_ca_handlers'
          - "'/bin/launchctl, kickstart, -k, system/com.openssh.sshd' in ssh_ca_handlers"
        fail_msg: >-
          ssh-ca must work on Darwin: its dependency is not skipped there, the
          tasks use configurable paths, and the handler restarts launchd's
          com.openssh.sshd on Darwin while keeping systemd ssh on Linux.

    - name: alloy routes Darwin and Linux and keeps a Darwin config path
      ansible.builtin.assert:
        that:
          - "'darwin.yml' in alloy_main"
          - "'linux.yml' in alloy_main"
          - '''ansible_os_family != "Darwin"'' in alloy_main'
          - "'grafana-alloy' in alloy_defaults"
          - "'alloy_darwin_config_file' in alloy_defaults"
          - "'alloy_darwin_extra_log_files' in alloy_defaults"
          - "'alloy_syslog_path' in alloy_template"
          - "'alloy_chia_log_path' in alloy_template"
          - "'restart alloy darwin' in alloy_handlers"
          - "'alloy_darwin_launchctl' in alloy_handlers"
          - "'launchctl' in alloy_darwin"
          - "'alloy.plist.j2' in alloy_darwin"
        fail_msg: >-
          alloy must keep the Linux apt/systemd path and add a Homebrew +
          launchd path with a Darwin config directory, log paths, and handler.

    - name: smartctl-exporter routes Darwin and installs a launchd job
      ansible.builtin.assert:
        that:
          - "'darwin.yml' in smartctl_main"
          - "'linux.yml' in smartctl_main"
          - '''ansible_os_family != "Darwin"'' in smartctl_main'
          - "'smartctl_exporter_darwin_version' in smartctl_defaults"
          - "'smartctl_exporter_darwin_sha256' in smartctl_defaults"
          - "'darwin-arm64' in smartctl_defaults"
          - "'smartmontools' in smartctl_darwin"
          - "'smartctl_exporter_darwin_sha256' in smartctl_darwin"
          - "'sha256:' in smartctl_darwin"
          - "'smartctl_exporter.plist.j2' in smartctl_darwin"
          - "'restart smartctl_exporter darwin' in smartctl_handlers"
          - "'smartctl_exporter_darwin_launchctl' in smartctl_handlers"
        fail_msg: >-
          smartctl-exporter must keep the Linux systemd path and add a pinned
          darwin-arm64 release, Homebrew smartmontools, and a launchd job.

    - name: Check for tailscale handler files
      ansible.builtin.stat:
        path: "{{ repo_dir }}/tailscale/{{ item }}"
      loop:
        - handlers
      register: tailscale_handlers

    - name: tailscale only reads state and keeps no handlers
      vars:
        tailscale_sources: "{{ tailscale_main ~ tailscale_darwin }}"
        tailscale_forbidden:
          - notify
          - brew services
          - bootstrap
          - bootout
          - kickstart
          - unload
          - "launchd:"
      ansible.builtin.assert:
        that:
          - tailscale_forbidden | select('in', tailscale_sources) | list | length == 0
          - tailscale_handlers.results | selectattr('stat.exists') | list | length == 0
        fail_msg: >-
          The tailscale role must only read state and ship no handlers.

- name: Render the Darwin Alloy configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../alloy/defaults/main.yml
  vars:
    ansible_os_family: Darwin
    ansible_hostname: darwin-test
    chia_root: /Users/timelord/.chia/mainnet
    alloy_darwin_chia_root: /Users/timelord/.chia/mainnet
    network: mainnet
    fleet_out: "{{ render_out | default('/tmp/darwin-fleet') }}"
  tasks:
    - name: Set the Darwin Alloy Chia root
      ansible.builtin.set_fact:
        alloy_darwin_chia_root: /Users/timelord/.chia/mainnet
        chia_root: /Users/timelord/.chia/mainnet
        ansible_os_family: Darwin
        ansible_hostname: darwin-test

    - name: Create the render directory
      ansible.builtin.file:
        path: "{{ fleet_out }}"
        state: directory
        mode: "0755"

    - name: Render the Alloy config
      ansible.builtin.template:
        src: ../../alloy/templates/config.alloy.j2
        dest: "{{ fleet_out }}/config.alloy"
        mode: "0644"

    - name: Render the Alloy LaunchDaemon
      ansible.builtin.template:
        src: ../../alloy/templates/alloy.plist.j2
        dest: "{{ fleet_out }}/alloy.plist"
        mode: "0644"

    - name: Read the rendered Alloy files
      ansible.builtin.slurp:
        src: "{{ fleet_out }}/{{ item }}"
      loop:
        - config.alloy
        - alloy.plist
      register: alloy_rendered

    - name: The Alloy render uses macOS paths and avoids fail2ban
      vars:
        config: "{{ alloy_rendered.results[0].content | b64decode }}"
        plist: "{{ alloy_rendered.results[1].content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'/var/log/system.log' in config"
          - "'/var/log/fail2ban.log' not in config"
          - "'/Users/timelord/.chia/mainnet/log/debug.log' in config"
          - "'chia-watchdog.log' in config"
          - "'/opt/homebrew/bin/alloy' in plist"
          - "'--storage.path=/var/lib/alloy' in plist"
          - "'<key>KeepAlive</key><true/>' in plist"

    - name: The Darwin Alloy block labels are valid and unique
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/check_alloy_labels.py"
          - --require-label
          - chia_watchdog
          - --require-job
          - chia-watchdog
          - "{{ fleet_out }}/config.alloy"
      changed_when: false

    - name: The Darwin Alloy config passes alloy validate
      ansible.builtin.command:
        argv:
          - alloy
          - validate
          - "{{ fleet_out }}/config.alloy"
      changed_when: false

- name: Render the Darwin smartctl_exporter LaunchDaemon
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../smartctl-exporter/defaults/main.yml
  vars:
    ansible_os_family: Darwin
    ansible_architecture: arm64
    fleet_out: "{{ render_out | default('/tmp/darwin-fleet') }}"
  tasks:
    - name: Set the smartctl_exporter test args
      ansible.builtin.set_fact:
        smartctl_exporter_args: "--smartctl.interval=120s --log.level=debug"

    - name: Render the smartctl_exporter LaunchDaemon
      ansible.builtin.template:
        src: ../../smartctl-exporter/templates/smartctl_exporter.plist.j2
        dest: "{{ fleet_out }}/smartctl_exporter.plist"
        mode: "0644"

    - name: Read the rendered smartctl_exporter LaunchDaemon
      ansible.builtin.slurp:
        src: "{{ fleet_out }}/smartctl_exporter.plist"
      register: smartctl_rendered

    - name: The smartctl_exporter LaunchDaemon uses Homebrew smartctl
      vars:
        text: "{{ smartctl_rendered.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'/usr/local/bin/smartctl_exporter' in text"
          - "'--web.listen-address=:9633' in text"
          - "'--smartctl.path=/opt/homebrew/bin/smartctl' in text"
          - "'<string>--smartctl.interval=120s</string>' in text"
          - "'<string>--log.level=debug</string>' in text"
          - "'--smartctl.interval=120s --log.level=debug' not in text"
          - "'<key>KeepAlive</key><true/>' in text"
          - "'net.chia.smartctl_exporter' in text"

- name: Render the Linux Alloy configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../alloy/defaults/main.yml
  vars:
    ansible_os_family: Debian
    ansible_hostname: linux-test
    chia_root: /home/ubuntu/.chia
    fleet_out: "{{ render_out | default('/tmp/darwin-fleet') }}"
  tasks:
    - name: Set the Linux Alloy variables
      ansible.builtin.set_fact:
        ansible_os_family: Debian
        ansible_hostname: linux-test
        chia_root: /home/ubuntu/.chia
        alloy_darwin_chia_root: ""
        alloy_extra_log_files:
          - name: 9lives
            path: /var/log/9lives.log
            job: 9lives
          - name: app.v2
            path: /var/log/app.v2.log
            job: app.v2

    - name: Create the Linux render directory
      ansible.builtin.file:
        path: "{{ fleet_out }}/linux"
        state: directory
        mode: "0755"

    - name: Render the Linux Alloy config
      ansible.builtin.template:
        src: ../../alloy/templates/config.alloy.j2
        dest: "{{ fleet_out }}/linux/config.alloy"
        mode: "0644"

    - name: Read the rendered Linux Alloy config
      ansible.builtin.slurp:
        src: "{{ fleet_out }}/linux/config.alloy"
      register: alloy_linux_rendered

    - name: Linux Alloy keeps Linux paths and excludes Darwin-only logs
      vars:
        config: "{{ alloy_linux_rendered.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'/var/log/syslog' in config"
          - "'/var/log/fail2ban.log' in config"
          - "'/home/ubuntu/.chia/log/debug.log' in config"
          - "'/var/log/chia-watchdog.log' not in config"
          - "'/var/log/system.log' not in config"

    - name: The Linux Alloy block labels are valid and unique
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/check_alloy_labels.py"
          - --require-label
          - _9lives
          - --require-label
          - app_v2
          - --require-job
          - 9lives
          - --require-job
          - app.v2
          - "{{ fleet_out }}/linux/config.alloy"
      changed_when: false

    - name: The Linux Alloy config passes alloy validate
      ansible.builtin.command:
        argv:
          - alloy
          - validate
          - "{{ fleet_out }}/linux/config.alloy"
      changed_when: false

- name: Render the Darwin ssh-ca sshd_config
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../ssh-ca/defaults/main.yml
  vars:
    ansible_os_family: Darwin
    fleet_out: "{{ render_out | default('/tmp/darwin-fleet') }}"
    # Test-only path so the role defaults loaded from vars_files cannot point
    # this render at /etc/ssh.
    ssh_ca_render_dest: "{{ fleet_out }}/sshd_config"
  tasks:
    - name: Create the ssh-ca render directory
      ansible.builtin.file:
        path: "{{ fleet_out }}"
        state: directory
        mode: "0755"

    - name: Write a sample macOS sshd_config
      ansible.builtin.copy:
        content: |
          # Sample macOS sshd_config fixture
          PasswordAuthentication no
          Subsystem sftp /usr/libexec/sftp-server
        dest: "{{ ssh_ca_render_dest }}"
        mode: "0644"

    # Match the lineinfile in ssh-ca/tasks/main.yml, but do not notify the
    # handler: CI must not restart sshd or call launchctl.
    - name: Apply the ssh-ca trusted CA line
      ansible.builtin.lineinfile:
        path: "{{ ssh_ca_render_dest }}"
        regexp: "^TrustedUserCAKeys"
        line: "TrustedUserCAKeys {{ ssh_ca_trusted_user_ca_keys }}"

    - name: Read the rendered sshd_config
      ansible.builtin.slurp:
        src: "{{ ssh_ca_render_dest }}"
      register: ssh_ca_rendered

    - name: The rendered sshd_config trusts the CA key
      vars:
        text: "{{ ssh_ca_rendered.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'TrustedUserCAKeys /etc/ssh/trusted-user-ca-keys.pem' in text"
          - "'PasswordAuthentication no' in text"

- name: Exercise the Darwin tailscale role without Homebrew or launchd
  hosts: localhost
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: Refuse to overwrite system paths outside a GitHub-hosted runner
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'RUNNER_ENVIRONMENT') == 'github-hosted'
        fail_msg: >-
          This play overwrites brew, launchctl, plutil, and the tailscale
          LaunchDaemon. Run it only on a throwaway GitHub-hosted runner.

    - name: Create the tailscale stub directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/homebrew/bin
        - /bin
        - /usr/bin
        - /Library/LaunchDaemons

    - name: Provide the wheel group for the LaunchDaemon owner
      ansible.builtin.group:
        name: wheel
        state: present

    - name: Write the brew, launchctl, plutil, and LaunchDaemon stubs
      ansible.builtin.copy:
        dest: "{{ item.path }}"
        mode: "{{ item.mode | default('0755') }}"
        content: "{{ item.content }}"
      loop:
        - path: /opt/homebrew/bin/brew
          content: |
            #!/bin/sh
            [ "$(id -u)" -ne 0 ] || { echo "brew must not run as root" >&2; exit 1; }
            echo tailscale
        - path: /bin/launchctl
          content: |
            #!/bin/sh
            [ "$1" = print ] || exit 1
            echo "state = running"
        - path: /usr/bin/plutil
          content: |
            #!/bin/sh
            exit 0
        - path: /Library/LaunchDaemons/net.chia.tailscaled.plist
          mode: "0644"
          content: "stub\n"

    - name: Run the Darwin tailscale tasks with stubbed tools
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../tailscale"
        tasks_from: darwin
