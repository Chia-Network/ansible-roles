---
# Run twice with the same test_root. The first run seeds; the second must
# report changed=0 because the database is no longer absent or a stub.
- name: Prove a second Darwin database seed run is idempotent
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../chia-blockchain/defaults/main.yml
  vars:
    test_root: "{{ lookup('env', 'DARWIN_DB_SEED_TEST_ROOT') | default('/tmp/darwin-db-seed-idempotence', true) }}"
  tasks:
    - name: Create the shared fixtures and fake tools
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-db-seed-setup.yml"

    - name: Prepare the idempotence database directory
      ansible.builtin.file:
        path: "{{ test_root }}/idempotence/mainnet/db"
        state: directory
        mode: "0755"

    - name: Seed the idempotence database
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-db-seed.yml"
      vars:
        chia_darwin_topology: local-internal
        chia_root: "{{ test_root }}/idempotence/mainnet"
        network: mainnet
        download_blockchain_db: true
        blockchain_backup_bucket: test-bucket

    - name: Require the first run to publish the fixture database
      ansible.builtin.assert:
        that:
          - lookup('file', test_root ~ '/idempotence/mainnet/db/blockchain_v2_mainnet.sqlite') == fixture_main
