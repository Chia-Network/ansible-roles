---
# Run one Darwin database seed scenario from darwin-db-seed-tests.yml. The
# include gate matches darwin.yml so disabled scenarios are skipped the same
# way in tests and production. Set case.expect_failure to a message regex when
# the seed must fail.
- name: Prepare the database directory for {{ case.name }}
  ansible.builtin.file:
    path: "{{ case.root }}/db"
    state: directory
    mode: "0755"
  when: case.prepare | default(true)

- name: Run a seed scenario that must fail for {{ case.name }}
  when: case.expect_failure is defined
  block:
    - name: Run the seed scenario for {{ case.name }}
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-db-seed.yml"
      vars:
        chia_darwin_topology: "{{ case.topology | default('local-internal') }}"
        chia_root: "{{ case.root }}"
        network: "{{ case.network | default('mainnet') }}"
        download_blockchain_db: "{{ case.download | default(true) }}"
        blockchain_backup_bucket: "{{ case.bucket | default('test-bucket') }}"
        chia_darwin_launchctl: "{{ test_root }}/bin/launchctl-{{ case.launchctl | default('notloaded') }}"
        chia_darwin_db_volume: "{{ case.volume | default(external_volume) }}"
      when:
        - (case.topology | default('local-internal')) != "remote-node"
        - case.download | default(true) | bool
        - (case.bucket | default('test-bucket')) | length > 0

    - name: Fail when the {{ case.name }} seed unexpectedly succeeded
      ansible.builtin.fail:
        msg: "The {{ case.name }} seed unexpectedly succeeded"
  rescue:
    - name: Confirm the expected failure for {{ case.name }}
      ansible.builtin.assert:
        that:
          - ansible_failed_result.msg | default('') is search(case.expect_failure)
        fail_msg: >-
          The {{ case.name }} seed failed with an unexpected message:
          {{ ansible_failed_result.msg | default('no message') }}

- name: Run the seed scenario for {{ case.name }}
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../../chia-blockchain/tasks/darwin-db-seed.yml"
  vars:
    chia_darwin_topology: "{{ case.topology | default('local-internal') }}"
    chia_root: "{{ case.root }}"
    network: "{{ case.network | default('mainnet') }}"
    download_blockchain_db: "{{ case.download | default(true) }}"
    blockchain_backup_bucket: "{{ case.bucket | default('test-bucket') }}"
    chia_darwin_launchctl: "{{ test_root }}/bin/launchctl-{{ case.launchctl | default('notloaded') }}"
    chia_darwin_db_volume: "{{ case.volume | default(external_volume) }}"
  when:
    - case.expect_failure is not defined
    - (case.topology | default('local-internal')) != "remote-node"
    - case.download | default(true) | bool
    - (case.bucket | default('test-bucket')) | length > 0
