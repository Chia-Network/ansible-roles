---
# One refusal case for darwin-timelord-app-installer.yml. The caller sets
# installer_refusal to a vendor installer that must fail, or a config on
# another network, plus the accepted and expected messages.
- name: "Write the {{ installer_refusal.name }} fixture"
  ansible.builtin.copy:
    dest: "{{ chia_darwin_timelord_app_installer if installer_refusal.installer is defined else installer_config }}"
    mode: "{{ '0755' if installer_refusal.installer is defined else '0600' }}"
    content: "{{ installer_refusal.installer | default(installer_refusal.config) }}"

- name: "Run {{ installer_refusal.name }}"
  block:
    - name: Choose the installer for the config
      ansible.builtin.include_tasks: ../../chia-blockchain/tasks/darwin-timelord-app-installer.yml
      vars:
        chia_darwin_timelord_app_installer_config: "{{ installer_config }}"
    - name: The run must not pass
      ansible.builtin.fail:
        msg: "{{ installer_refusal.accepted }}"
  rescue:
    - name: "The failure matches {{ installer_refusal.name }}"
      ansible.builtin.assert:
        that:
          - installer_refusal.expected in ansible_failed_result.msg
