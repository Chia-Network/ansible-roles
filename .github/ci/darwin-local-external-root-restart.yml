---
# Leftover, rescue, and restart cases for the local-external CHIA_ROOT include.
# Included by darwin-local-external-root-tests.yml after the success paths.
- name: Move leftover staging aside instead of refusing while ~/.chia exists
  vars:
    chia_darwin_home: "{{ test_root }}/staging/home"
    chia_root: "{{ test_root }}/staging/home/.chia/{{ network }}"
  block:
    - name: Prepare a real ~/.chia and a leftover staging tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ chia_darwin_home }}/.chia"
        - "{{ chia_darwin_home }}/.chia.migrating"

    - name: Write a file in the leftover staging tree
      ansible.builtin.copy:
        content: staged-data
        dest: "{{ chia_darwin_home }}/.chia.migrating/keep.txt"
        mode: "0644"

    - name: Run the local-external root include with a leftover staging tree
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the leftover staging tree run to proceed
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: "The leftover staging tree was refused: {{ local_external_case_message }}"

    - name: Find the timestamped leftover staging trees
      ansible.builtin.find:
        paths: "{{ chia_darwin_home }}"
        patterns:
          - ".chia.migrating.leftover*"
        file_type: directory
        hidden: true
        recurse: false
      register: staging_leftovers

    - name: Inspect the layout after the leftover move
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_home }}/.chia"
        - "{{ chia_darwin_home }}/.chia.migrating"
      register: staging_layout

    - name: Require the leftover staging tree to be preserved aside
      ansible.builtin.assert:
        that:
          - staging_leftovers.matched == 1
          - staging_layout.results[0].stat.isdir | default(false)
          - not (staging_layout.results[0].stat.islnk | default(false))
          - not (staging_layout.results[1].stat.exists | default(false))
          - lookup('file', staging_leftovers.files[0].path ~ '/keep.txt') == 'staged-data'
        fail_msg: >-
          A leftover staging tree next to a real ~/.chia must be renamed to a
          timestamped leftover directory, not deleted, and the include must
          continue.

- name: Keep existing leftovers and give a later leftover a different name
  vars:
    chia_darwin_home: "{{ test_root }}/leftover-collision/home"
    chia_root: "{{ test_root }}/leftover-collision/home/.chia/{{ network }}"
    old_leftover: "{{ test_root }}/leftover-collision/home/.chia.migrating.leftover-20000101T000000Z"
  block:
    - name: Prepare a real ~/.chia, an old leftover, and a new staging tree
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ chia_darwin_home }}/.chia"
        - "{{ old_leftover }}"
        - "{{ chia_darwin_home }}/.chia.migrating"

    - name: Write the old leftover and new staging fixtures
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: "0644"
      loop:
        - content: old-leftover
          dest: "{{ old_leftover }}/old.txt"
        - content: staged-data
          dest: "{{ chia_darwin_home }}/.chia.migrating/keep.txt"
      loop_control:
        label: "{{ item.dest }}"

    - name: Run the local-external root include when an old leftover exists
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the old-leftover run to proceed
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: "The leftover staging tree was refused: {{ local_external_case_message }}"

    - name: Find the timestamped leftover staging trees after the first move
      ansible.builtin.find:
        paths: "{{ chia_darwin_home }}"
        patterns:
          - ".chia.migrating.leftover*"
        file_type: directory
        hidden: true
        recurse: false
      register: staging_leftovers_first

    - name: Record the new leftover name
      ansible.builtin.set_fact:
        staging_first_new_leftover: >-
          {{ staging_leftovers_first.files | map(attribute='path')
          | reject('equalto', old_leftover) | first }}
      changed_when: false

    - name: Inspect the staging path after the first move
      ansible.builtin.stat:
        path: "{{ chia_darwin_home }}/.chia.migrating"
        follow: false
      register: staging_migrating_after_first

    - name: Require the old leftover to stay and the new tree to use a new name
      ansible.builtin.assert:
        that:
          - staging_leftovers_first.matched == 2
          - lookup('file', old_leftover ~ '/old.txt') == 'old-leftover'
          - staging_first_new_leftover != old_leftover
          - lookup('file', staging_first_new_leftover ~ '/keep.txt') == 'staged-data'
          - not (staging_migrating_after_first.stat.exists | default(false))
        fail_msg: >-
          An existing leftover must stay untouched and a new staging tree must
          move to a different timestamped leftover name with its data intact.

    - name: Create another staging tree after the first move
      ansible.builtin.file:
        path: "{{ chia_darwin_home }}/.chia.migrating"
        state: directory
        mode: "0755"

    - name: Write the next staging fixture
      ansible.builtin.copy:
        content: retry-data
        dest: "{{ chia_darwin_home }}/.chia.migrating/retry.txt"
        mode: "0644"

    - name: Run the local-external root include again after the first move
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the later run to proceed
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: "The later run after a leftover was refused: {{ local_external_case_message }}"

    - name: Find the timestamped leftover staging trees after the second move
      ansible.builtin.find:
        paths: "{{ chia_darwin_home }}"
        patterns:
          - ".chia.migrating.leftover*"
        file_type: directory
        hidden: true
        recurse: false
      register: staging_leftovers_second

    - name: Record the later leftover name
      ansible.builtin.set_fact:
        staging_second_new_leftover: >-
          {{ staging_leftovers_second.files | map(attribute='path')
          | reject('equalto', old_leftover)
          | reject('equalto', staging_first_new_leftover) | first }}
      changed_when: false

    - name: Inspect the staging path after the second move
      ansible.builtin.stat:
        path: "{{ chia_darwin_home }}/.chia.migrating"
        follow: false
      register: staging_migrating_after_second

    - name: Require the later run to use another new leftover name
      ansible.builtin.assert:
        that:
          - staging_leftovers_second.matched == 3
          - lookup('file', old_leftover ~ '/old.txt') == 'old-leftover'
          - lookup('file', staging_first_new_leftover ~ '/keep.txt') == 'staged-data'
          - staging_second_new_leftover not in [old_leftover, staging_first_new_leftover]
          - lookup('file', staging_second_new_leftover ~ '/retry.txt') == 'retry-data'
          - not (staging_migrating_after_second.stat.exists | default(false))
        fail_msg: >-
          A later run must still move a new staging tree aside, keep every
          earlier leftover untouched, and use a different timestamped name.

- name: Restore the legacy link and restart jobs after an rsync failure
  vars:
    chia_darwin_home: "{{ test_root }}/rescue/home"
    chia_root: "{{ test_root }}/rescue/home/.chia/{{ network }}"
  block:
    - name: Prepare the rescue home directory
      ansible.builtin.file:
        path: "{{ chia_darwin_home }}"
        state: directory
        mode: "0755"

    - name: Create the rescue legacy ~/.chia link
      ansible.builtin.file:
        src: "{{ external_chia }}"
        dest: "{{ chia_darwin_home }}/.chia"
        state: link
        force: false

    - name: Reset the fake launchctl log before the rescue run
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/launchctl.log"
        mode: "0644"

    - name: Run the local-external root include with a failing rsync
      vars:
        chia_darwin_rsync: /bin/false
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the failed migration to report and restore the legacy link
      vars:
        launchctl_lines: "{{ lookup('file', test_root ~ '/launchctl.log') | split('\n') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - local_external_case_failed | bool
          - local_external_case_message is search('migration failed')
          - launchctl_lines | select('search', 'bootout system/net.chia.roottest.timelord') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.timelord') | list | length >= 1
          - launchctl_lines | select('search', 'net.chia.roottest.disabled') | list | length == 0
        fail_msg: >-
          A failed rsync must restore the legacy link and restart the enabled
          job. Failure: {{ local_external_case_message }} Log:
          {{ launchctl_lines }}

    - name: Find the rescue leftover staging trees
      ansible.builtin.find:
        paths: "{{ chia_darwin_home }}"
        patterns:
          - ".chia.migrating.leftover*"
        file_type: directory
        hidden: true
        recurse: false
      register: rescue_leftovers

    - name: Inspect the rescue layout after the failure
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_home }}/.chia"
        - "{{ chia_darwin_home }}/.chia.migrating"
      register: rescue_stats

    - name: Require the rescue to restore the link and move staging aside
      ansible.builtin.assert:
        that:
          - rescue_stats.results[0].stat.islnk | default(false)
          - >-
            (rescue_stats.results[0].stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_chia | regex_replace('/+$', ''))
          - not (rescue_stats.results[1].stat.exists | default(false))
          - rescue_leftovers.matched == 1
        fail_msg: >-
          A failed migration must restore ~/.chia as the legacy link and move
          its staging tree to a timestamped leftover, not delete it.

    - name: Run the local-external root include again after the rescue
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the second run to proceed and migrate
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: >-
          A second run after a rescue must not refuse on leftover staging:
          {{ local_external_case_message }}

    - name: Inspect the rescue layout after the second run
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_home }}/.chia"
        - "{{ chia_darwin_home }}/.chia.legacy-volume-link"
        - "{{ chia_darwin_home }}/.chia.migrating"
      register: rescue_second

    - name: Require the second run to finish the migration
      ansible.builtin.assert:
        that:
          - rescue_second.results[0].stat.isdir | default(false)
          - not (rescue_second.results[0].stat.islnk | default(false))
          - rescue_second.results[1].stat.islnk | default(false)
          - not (rescue_second.results[2].stat.exists | default(false))

- name: Restore the legacy link when the staging swap fails
  vars:
    chia_darwin_home: "{{ test_root }}/failed-swap/home"
    chia_root: "{{ test_root }}/failed-swap/home/.chia/{{ network }}"
  block:
    - name: Prepare the failed staging swap fixture
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-failure-setup.yml"
      vars:
        failure_home: "{{ chia_darwin_home }}"

    - name: Run the local-external root include with a failing staging swap
      vars:
        chia_darwin_mv: "{{ test_root }}/bin/mv-fail-swap"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the failed staging swap to restore the legacy link and jobs
      vars:
        launchctl_lines: "{{ lookup('file', test_root ~ '/launchctl.log') | split('\n') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - local_external_case_failed | bool
          - local_external_case_message is search('migration failed')
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.timelord') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.chia-exporter') | list | length >= 1
        fail_msg: >-
          A failed staging swap must restore the legacy link and bootstrap the
          enabled jobs whose plist is installed. Failure:
          {{ local_external_case_message }} Log: {{ launchctl_lines }}

    - name: Inspect the restored legacy link after the failed staging swap
      ansible.builtin.stat:
        path: "{{ chia_darwin_home }}/.chia"
        follow: false
      register: failed_swap_dot

    - name: Require the legacy link to be back and the staging tree moved aside
      ansible.builtin.assert:
        that:
          - failed_swap_dot.stat.islnk | default(false)
          - >-
            (failed_swap_dot.stat.lnk_target | default('') | regex_replace('/+$', '')) ==
            (external_chia | regex_replace('/+$', ''))

- name: Do not restart jobs when the legacy restore also fails
  vars:
    chia_darwin_home: "{{ test_root }}/failed-restore/home"
    chia_root: "{{ test_root }}/failed-restore/home/.chia/{{ network }}"
  block:
    - name: Prepare the failed restore fixture
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-failure-setup.yml"
      vars:
        failure_home: "{{ chia_darwin_home }}"

    - name: Run the local-external root include when the restore also fails
      vars:
        chia_darwin_mv: "{{ test_root }}/bin/mv-fail-swap-and-restore"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require no bootstrap when ~/.chia was not restored
      vars:
        launchctl_lines: "{{ lookup('file', test_root ~ '/launchctl.log') | split('\n') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - local_external_case_failed | bool
          - local_external_case_message is search('staging tree is complete')
          - local_external_case_message is search('rerun finishes')
          - local_external_case_message is not search('Restore it manually')
          - launchctl_lines | select('search', 'bootstrap') | list | length == 0
        fail_msg: >-
          When ~/.chia is missing after a failed restore, the report must say
          the staging tree is complete and a rerun finishes the migration, and
          the migration must not bootstrap jobs. Failure:
          {{ local_external_case_message }} Log: {{ launchctl_lines }}

    - name: Inspect ~/.chia after the failed restore
      ansible.builtin.stat:
        path: "{{ chia_darwin_home }}/.chia"
        follow: false
      register: failed_restore_dot

    - name: Require ~/.chia to stay absent after the failed restore
      ansible.builtin.assert:
        that:
          - not (failed_restore_dot.stat.exists | default(false))

- name: Do not bootstrap an enabled companion whose plist is missing
  vars:
    chia_darwin_home: "{{ test_root }}/missing-companion-plist/home"
    chia_root: "{{ chia_darwin_home }}/.chia/{{ network }}"
  block:
    - name: Prepare a legacy link for the missing companion plist case
      ansible.builtin.file:
        path: "{{ chia_darwin_home }}"
        state: directory
        mode: "0755"

    - name: Create the missing companion plist legacy ~/.chia link
      ansible.builtin.file:
        src: "{{ external_chia }}"
        dest: "{{ chia_darwin_home }}/.chia"
        state: link
        force: false

    - name: Remove the companion plist
      ansible.builtin.file:
        path: "{{ chia_darwin_launchd_dir }}/net.chia.roottest.chia-exporter.plist"
        state: absent

    - name: Reset the fake launchctl log before the missing companion plist run
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/launchctl.log"
        mode: "0644"

    - name: Run the local-external root include with a missing companion plist
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the missing companion plist migration to succeed
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: "The missing companion plist run failed: {{ local_external_case_message }}"

    - name: Require the installed jobs to return while the missing plist is skipped
      vars:
        launchctl_lines: "{{ lookup('file', test_root ~ '/launchctl.log') | split('\n') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.timelord') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.hw-vdf-0') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.chia-exporter') | list | length == 0
        fail_msg: >-
          The migration must skip an enabled companion without a plist and
          restart the enabled jobs that have one. Log: {{ launchctl_lines }}

    - name: Restore the default companion plist for later cases
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-plist.yml"
      vars:
        local_external_plist:
          name: chia-exporter
          label: net.chia.roottest.chia-exporter

- name: Rerun a migration killed mid-rsync and restart every installed plist
  vars:
    chia_darwin_home: "{{ test_root }}/killed-rsync/home"
    chia_root: "{{ chia_darwin_home }}/.chia/{{ network }}"
  block:
    - name: Prepare the killed-rsync home and legacy ~/.chia link
      ansible.builtin.file:
        path: "{{ chia_darwin_home }}"
        state: directory
        mode: "0755"

    - name: Create the killed-rsync legacy ~/.chia link
      ansible.builtin.file:
        src: "{{ external_chia }}"
        dest: "{{ chia_darwin_home }}/.chia"
        state: link
        force: false

    - name: Create the killed-rsync staging tree
      ansible.builtin.file:
        path: "{{ chia_darwin_home }}/.chia.migrating/{{ network }}"
        state: directory
        mode: "0755"

    - name: Write a partial file into the killed-rsync staging tree
      ansible.builtin.copy:
        content: killed-mid-rsync
        dest: "{{ chia_darwin_home }}/.chia.migrating/{{ network }}/partial.txt"
        mode: "0644"

    - name: Clear every loaded marker before the killed-rsync rerun
      ansible.builtin.file:
        path: "{{ test_root }}/launchd-state/loaded/{{ item.label }}"
        state: absent
      loop: "{{ chia_darwin_launchd_jobs | selectattr('enabled', 'truthy') | list }}"
      loop_control:
        label: "{{ item.label }}"

    - name: Reset the fake launchctl log before the killed-rsync rerun
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/launchctl.log"
        mode: "0644"

    - name: Rerun the local-external root include after a killed-rsync migration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the killed-rsync rerun to finish the migration
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: "The killed-rsync rerun failed: {{ local_external_case_message }}"

    - name: Find the killed-rsync leftover staging trees
      ansible.builtin.find:
        paths: "{{ chia_darwin_home }}"
        patterns:
          - ".chia.migrating.leftover*"
        file_type: directory
        hidden: true
        recurse: false
      register: killed_rsync_leftovers

    - name: Inspect the killed-rsync layout after the rerun
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ chia_darwin_home }}/.chia"
        - "{{ chia_darwin_home }}/.chia.migrating"
        - "{{ chia_darwin_home }}/.chia.legacy-volume-link"
      register: killed_rsync_stats

    - name: Require the killed-rsync rerun to move staging aside and finish
      ansible.builtin.assert:
        that:
          - killed_rsync_leftovers.matched == 1
          - killed_rsync_stats.results[0].stat.isdir | default(false)
          - not (killed_rsync_stats.results[0].stat.islnk | default(false))
          - not (killed_rsync_stats.results[1].stat.exists | default(false))
          - killed_rsync_stats.results[2].stat.islnk | default(false)
          - >-
            lookup('file', killed_rsync_leftovers.files[0].path ~ '/' ~ network
            ~ '/partial.txt') == 'killed-mid-rsync'
        fail_msg: >-
          A rerun after a killed migration must move the staging tree aside,
          finish the migration, and keep the partial staging data.

    - name: Require the killed-rsync rerun to restart every installed plist
      vars:
        launchctl_lines: "{{ lookup('file', test_root ~ '/launchctl.log') | split('\n') | reject('eq', '') | list }}"
      ansible.builtin.assert:
        that:
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.timelord') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.chia-exporter') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.hw-vdf-0') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.hw-vdf-1') | list | length >= 1
          - launchctl_lines | select('search', 'bootstrap .*net.chia.roottest.watchdog') | list | length >= 1
          - launchctl_lines | select('search', 'net.chia.roottest.disabled') | list | length == 0
        fail_msg: >-
          A rerun after a killed migration must bootstrap every enabled job
          whose plist is installed. Log: {{ launchctl_lines }}

- name: Skip an enabled board whose plist is missing without blocking the others
  vars:
    chia_darwin_home: "{{ test_root }}/missing-board-plist/home"
    chia_root: "{{ chia_darwin_home }}/.chia/{{ network }}"
  block:
    - name: Prepare a legacy link for the missing board plist case
      ansible.builtin.file:
        path: "{{ chia_darwin_home }}"
        state: directory
        mode: "0755"

    - name: Create the missing board plist legacy ~/.chia link
      ansible.builtin.file:
        src: "{{ external_chia }}"
        dest: "{{ chia_darwin_home }}/.chia"
        state: link
        force: false

    - name: Remove one board plist
      ansible.builtin.file:
        path: "{{ chia_darwin_launchd_dir }}/net.chia.roottest.hw-vdf-1.plist"
        state: absent

    - name: Reset the fake launchctl log before the missing board plist run
      ansible.builtin.copy:
        content: ""
        dest: "{{ test_root }}/launchctl.log"
        mode: "0644"

    - name: Run the local-external root include with a missing board plist
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-case.yml"

    - name: Require the missing board plist migration to succeed
      ansible.builtin.assert:
        that:
          - not (local_external_case_failed | bool)
        fail_msg: "The missing board plist run failed: {{ local_external_case_message }}"

    - name: Require the installed board to start while the missing board is skipped
      vars:
        board_launchctl_log: "{{ lookup('file', test_root ~ '/launchctl.log') }}"
      ansible.builtin.assert:
        that:
          - board_launchctl_log is search('bootstrap .*net.chia.roottest.timelord')
          - board_launchctl_log is search('bootstrap .*net.chia.roottest.hw-vdf-0')
          - board_launchctl_log is search('bootstrap .*net.chia.roottest.watchdog')
          - board_launchctl_log is not search('bootstrap .*net.chia.roottest.hw-vdf-1')
        fail_msg: >-
          The migration must skip an enabled board without a plist without
          stranding the other boards. Log: {{ board_launchctl_log }}

    - name: Restore the missing board plist for later cases
      ansible.builtin.include_tasks: "{{ playbook_dir }}/darwin-local-external-root-plist.yml"
      vars:
        local_external_plist:
          name: hw-vdf-1
          label: net.chia.roottest.hw-vdf-1
