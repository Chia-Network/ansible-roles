name: Darwin role check

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Darwin role check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck
          python3 -m pip install --user ansible-core

      - name: Syntax check
        env:
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}
        run: ansible-playbook --syntax-check .github/ci/darwin-syntax-check.yml

      - name: Render Darwin templates
        run: ansible-playbook -e render_out="$RUNNER_TEMP/darwin" .github/ci/darwin-render-templates.yml

      - name: Lint rendered output
        working-directory: ${{ runner.temp }}/darwin
        run: |
          for f in ./*/*.sh; do zsh -n "$f"; done
          shellcheck -s bash -S warning ./*/*.sh
          for f in ./*/*.plist ./*/*.mobileconfig; do
            python3 -c 'import plistlib, sys; plistlib.load(open(sys.argv[1], "rb"))' "$f"
          done
          python3 -m py_compile ./*/rotpipe.py
