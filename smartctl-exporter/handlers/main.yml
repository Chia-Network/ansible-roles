---
- name: restart smartctl_exporter
  systemd:
    name: smartctl_exporter
    state: restarted
  become: true
  when: ansible_os_family != "Darwin"

- name: restart smartctl_exporter darwin
  become: true
  ansible.builtin.shell: |
    /bin/launchctl bootout "system/{{ smartctl_exporter_darwin_launchd_label }}" 2>/dev/null || true
    sleep 1
    /bin/launchctl enable "system/{{ smartctl_exporter_darwin_launchd_label }}"
    /bin/launchctl bootstrap system "{{ smartctl_exporter_darwin_launchd_dir }}/{{ smartctl_exporter_darwin_launchd_label }}.plist"
  changed_when: true
