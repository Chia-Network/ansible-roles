---
- name: restart smartctl_exporter
  ansible.builtin.systemd:
    name: smartctl_exporter
    state: restarted
  become: true
  when: ansible_os_family != "Darwin"

- name: Boot out smartctl_exporter for restart
  listen: restart smartctl_exporter darwin
  become: "{{ smartctl_exporter_darwin_become | bool }}"
  ansible.builtin.command:
    argv:
      [
        "{{ smartctl_exporter_darwin_launchctl }}",
        bootout,
        "system/{{ smartctl_exporter_darwin_launchd_label }}",
      ]
  failed_when: false
  changed_when: true

- name: Wait for smartctl_exporter to unload before restart
  listen: restart smartctl_exporter darwin
  become: "{{ smartctl_exporter_darwin_become | bool }}"
  ansible.builtin.command:
    argv:
      [
        "{{ smartctl_exporter_darwin_launchctl }}",
        print,
        "system/{{ smartctl_exporter_darwin_launchd_label }}",
      ]
  register: smartctl_exporter_darwin_restart_loaded
  retries: "{{ smartctl_exporter_darwin_unload_retries | int }}"
  delay: "{{ smartctl_exporter_darwin_unload_delay | int }}"
  until: smartctl_exporter_darwin_restart_loaded.rc != 0
  failed_when: false
  changed_when: false

- name: Require smartctl_exporter to be unloaded before bootstrap
  listen: restart smartctl_exporter darwin
  ansible.builtin.assert:
    that:
      - smartctl_exporter_darwin_restart_loaded.rc | default(0) | int != 0
    fail_msg: >-
      smartctl_exporter is still loaded after waiting
      {{ smartctl_exporter_darwin_unload_retries }} tries; refusing to bootstrap.

- name: Enable smartctl_exporter before restart
  listen: restart smartctl_exporter darwin
  become: "{{ smartctl_exporter_darwin_become | bool }}"
  ansible.builtin.command:
    argv:
      [
        "{{ smartctl_exporter_darwin_launchctl }}",
        enable,
        "system/{{ smartctl_exporter_darwin_launchd_label }}",
      ]
  changed_when: false

- name: Bootstrap smartctl_exporter after restart
  listen: restart smartctl_exporter darwin
  become: "{{ smartctl_exporter_darwin_become | bool }}"
  ansible.builtin.command:
    argv:
      - "{{ smartctl_exporter_darwin_launchctl }}"
      - bootstrap
      - system
      - "{{ smartctl_exporter_darwin_launchd_dir }}/{{ smartctl_exporter_darwin_launchd_label }}.plist"
  changed_when: true
